  /hierarchies/nodes:
    get:
      description: |
        Returns a list of all `HierarchyNode` based on organization and hierarchy type filters.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | listHierarchies |
        | listItemHierarchies |
      operationId: listAllHierarchyNodes
      tags:
        - Hierarchy
      x-authorities:
        - listHierarchies
        - listItemHierarchies
      parameters:
        - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
        - name: "filter[hierarchyTypeId]"
          in: query
          description: Filter the response by hierarchy type id.
          required: true
          style: form
          schema:
            type: string
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - name: "filter"
          in: query
          description: Filter group
          required: true
          style: deepObject
          schema:
            type: object
            properties:
              s:
                description: Search the given string; searches inside code and description.
                type: string
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      responses:
        "200":
          description: Hierarchy node list response.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/HierarchyNodeListResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
