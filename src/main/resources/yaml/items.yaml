openapi: 3.0.3
info:
  title: onSales Next Core API
  version: "-"
  description: Items related APIs.
tags:
  - name: Asset
    description: Asset related APIs.

  - name: Item Instance
    description: ItemInstance related APIs.

  - name: Item
    description: Item

  - name: Item Category
    description: The category of an item defines the set of attributes that all items of that category have.

  - name: Item Nutrition Fact
    description: Nutrition facts of an item. An item can have a related list of nutrition facts, if this is specified in the item category. See `hasNutritionFacts` attribute in `ItemCategory` entity.

  - name: Item Packaging Part
    description: Item packaging part related APIs.
components:
  parameters:
    InstanceId:
      name: id
      description: The id of an `ItemInstance`.
      in: path
      required: true
      schema:
        type: string
    filterItemBarcode:
      name: "filter[itemBarcode]"
      in: query
      description: Filter the response by the barcode of an `Item`.
      required: false
      style: form
      schema:
        type: string
    kpiId:
      name: kpiId
      in: path
      description: The KPI id
      required: true
      schema:
        type: string
    itemId:
      name: itemId
      in: path
      description: The item id
      required: true
      schema:
        type: string
    ItemInstanceAvailabilityFilters:
      name: "filter"
      in: query
      description: Filter group
      required: true
      style: deepObject
      schema:
        type: object
        properties:
          s:
            description: Search the given string; searches inside some attributes, as specified in the API documentation, e.g. descr, code, etc.
            type: string
          warehouse:
            description: Filter the response by warehouse.
            type: string
          item:
            description: Filter the response by item.
            type: string
          itemType:
            description: Filter the response by item type.
            type: string
          itemInstance:
            description: Filter the response by item instance.
            type: string
          expirationDate:
            description: Filter the response by item instance expiration date.
            type: string
          availabilityLevelId:
            description: Filter the response by availability level.
            type: string
          lastUpdateTs:
            description: Filter the response by last update timestamp.
            type: string
    ItemAvailabilityFilters:
      name: "filter"
      in: query
      description: Filter group
      required: true
      style: deepObject
      schema:
        type: object
        properties:
          s:
            description: Search the given string; searches inside some attributes, as specified in the API documentation, e.g. descr, code, etc.
            type: string
          warehouse:
            description: Filter the response by warehouse.
            type: string
          item:
            description: Filter the response by item.
            type: string
          itemType:
            description: Filter the response by item type.
            type: string
          itemCategory:
            description: Filter the response by item category.
            type: string
          salesLine:
            description: Filter the response by item sales line.
            type: string
          brand:
            description: Filter the response by brand.
            type: string
          availabilityLevelId:
            description: Filter the response by availability level.
            type: string
          lastUpdateTs:
            description: Filter the response by last update timestamp.
            type: string
    itemInstanceFilters:
      name: "filter"
      in: query
      description: Filter group
      required: true
      style: deepObject
      schema:
        properties:
          s:
            description: Generic string filter. It refers to the code attribute.
            type: string
          code:
            description: Code of the item instance.
            type: string
          barcode:
            description: Search the item instance by barcode.
            type: string
          expirationDate:
            description: An expiration date, used only for batches.
            type: string
          itemStatus:
            description: A status for the `ItemInstance`.
            type: string
          item:
            description: An item linked to an `ItemInstance`
            type: string
          productionDate:
            description: A production date.
            type: string
          itemInstanceDisposalReasonId:
            description: A set of reasons for the instance disposal.
            type: string
          availableStockQuantity:
            description: An availability quantity about the item instances.
            type: string
          itemInstanceTypeId:
            description: Filter the response by item instance type id.
            type: string
          locationParty:
            description: Filter the response by item instance location party id.
            type: string
          locationType:
            description: Filter the response by item instance location type id. See enum `LocationType`.
            type: string
          supplier:
            description: Filter the response by item instance supplier id.
            type: string
          itemCategory:
            description: Filter the response by relevant item category id.
            type: string
    assetFilters:
      name: "filter"
      in: query
      description: Filter group
      required: true
      style: deepObject
      schema:
        properties:
          s:
            description: Generic string filter. It refers to the asset code attribute.
            type: string
          assetId:
            description: Filter the response by asset id.
            type: string
          code:
            description: Code of the asset
            type: string
          expirationDate:
            description: An expiration date.
            type: string
          itemStatus:
            description: A status for the `ItemInstance`.
            type: string
          item:
            description: An item linked to an `ItemInstance`
            type: string
          productionDate:
            description: A production date.
            type: string
          itemInstanceDisposalReasonId:
            description: A set of reasons for the instance disposal.
            type: string
          availableStockQuantity:
            description: An availability quantity about the item instances.
            type: string
          itemInstanceTypeId:
            description: Filter the response by item instance type id.
            type: string
          locationParty:
            description: Filter the response by item instance location party id.
            type: string
          locationType:
            description: Filter the response by item instance location type id. See enum `LocationType`.
            type: string
          supplier:
            description: Filter the response by item instance supplier id.
            type: string
          itemCategory:
            description: Filter the response by relevant item category id.
            type: string
          plant:
            description: Filter the response by plant id.
            type: string
          capacity:
            description: Filters the response considering asset capacity.
            type: string
          installationTypeId:
            description: Filters the responses by asset's installation type.
            type: string
          supplierSerialNumber:
            description: Filters the responses by asset's supplier serial number.
            type: string
          lastInspectionDate:
            description: Filters the responses by asset's last inspection date.
            type: string
          customerContract:
            description: Filters the responses by customer contract id.
            type: string
          barcode:
            description: Filters the responses by barcode.
            type: string
          parentInstance:
            description: Filters the responses by parent instance id.
            type: string
          nextInspectionDate:
            description: Filters the responses by asset's next inspection date.
            type: string
          nextPeriodicServicingDate:
            description: Filters the responses by asset's next periodic servicing date.
            type: string
  schemas:
    ItemInstanceType:
      description: An enum that describes the possible types of an `ItemInstance`. See dictionary `ItemInstanceType`
      type: string
      enum:
        - ItemInstanceType.Asset
        - ItemInstanceType.Batch
        - ItemInstanceType.Serial
      x-enum-varnames:
        - asset
        - batch
        - serial
    AvailabilityLevelId:
      description: |
        Availability level. See dictionary `AvailabilityLevel`.
      type: string
      enum:
        - AvailabilityLevel.Critical
        - AvailabilityLevel.Low
        - AvailabilityLevel.None
        - AvailabilityLevel.Normal
    PeriodicRecurrence:
      description: Periodic recurrence data.
      type: object
      required:
        - validityPeriodId
        - validityValue
      properties:
        validityPeriodId:
          $ref: "./core.yaml#/components/schemas/RecurrenceType"
        validityValue:
          description: Number of `ValidityPeriodId`s before the recurrence expires.
          type: integer
          minimum: 1
    ItemInstanceAttributes:
      description: The attributes of an `ItemInstance`.
      type: object
      required:
        - code
        - itemInstanceTypeId
        - itemStatusId
      properties:
        code:
          description: Serial number or batch number.
          type: string
          example: "126547"
        itemInstanceTypeId:
          $ref: "#/components/schemas/ItemInstanceType"
        itemStatusId:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
        expirationDate:
          $ref: "./dataTypes.yaml#/components/schemas/apiDateTime"
        productionDate:
          $ref: "./dataTypes.yaml#/components/schemas/apiDateTime"
        itemInstanceDisposalReasonId:
          description: The reason why the item instance has been blocked. See dictionary `ItemInstanceDisposalReason`.
          type: string
          example: "REASON.1"
        availableStockQuantity:
          description: The available stock quantity of the item instance.
          type: number
          format: double
          readOnly: true
          example: 15.0
        lastChangeTs:
          $ref: "./core.yaml#/components/schemas/lastChangeTs"
        lastChangeUserProfileId:
          description: Last change User Profile id.
          type: string
          readOnly: true
        lastDisposalChangeTs:
          $ref: "./dataTypes.yaml#/components/schemas/apiDateTime"
          readOnly: true
        lastDisposalIdentityId:
          description: Last disposal identity id.
          type: string
          readOnly: true
        locationParty:
          description: |
            The party of the location where the item instance is stored, e.g. warehouse, customers, sales points.
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
        entityAttributes:
          description: |
            The dynamic attributes that may be associated to the item instance and the static attributes that are translated. 
            For the static attributes the attributeValue is `null`.
          type: array
          items:
            $ref: "./entityAttributes.yaml#/components/schemas/EntityAttributeValue"
        barcode:
          description: Barcode of the item instance.
          type: string
        latitude:
          description: The latitude in decimal degrees.
          type: number
          format: double
          example: 45.7261575
        longitude:
          description: The longitude in decimal degrees.
          type: number
          format: double
          example: 45.7261575
    ItemInstanceRelationships:
      description: Relationships of an `ItemInstance`.
      type: object
      properties:
        item:
          description: The item related to the `ItemInstance`.
          type: object
          required:
            - data
          properties:
            links:
              $ref: "./jsonapi.yaml#/components/schemas/relationshipLinks"
            data:
              type: object
              required:
                - type
                - id
              properties:
                type:
                  type: string
                id:
                  type: string
                meta:
                  type: object
                  additionalProperties: false
                  properties:
                    code:
                      type: string
                      readOnly: true
                    descr:
                      type: string
                      readOnly: true
                    categoryId:
                      type: string
                      readOnly: true
                    itemTypeId:
                      type: string
                      readOnly: true
        docHeader:
          $ref: "./jsonapi.yaml#/components/schemas/relToOne"
        identificationUhf:
          $ref: "./jsonapi.yaml#/components/schemas/relToOne"
        identificationNfc:
          $ref: "./jsonapi.yaml#/components/schemas/relToOne"
        identificationBarcode:
          $ref: "./jsonapi.yaml#/components/schemas/relToOne"
        supplier:
          description: To be populated if `item.itemType` is of type `ItemType.Asset`.
          $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
        parentInstance:
          $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
    ItemInstance:
      description: A serialized item. It can be either a simple item or a batch.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          description: A string that describes the type of the object.
          type: string
          default: "ItemInstance"
        id:
          description: A string that uniquely identifies the object.
          type: string
          example: "ITEM.INSTANCE.1"
        attributes:
          $ref: "#/components/schemas/ItemInstanceAttributes"
        relationships:
          $ref: "#/components/schemas/ItemInstanceRelationships"
    ItemInstanceIncluded:
      description: Related entities data of an `ItemInstance`.
      type: array
      items:
        type: object
      uniqueItems: true
    ItemInstanceRequest:
      description: An object that contains an `ItemInstance`.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/ItemInstance"
    ItemInstanceResponse:
      description: An object that contains an `ItemInstance`.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/ItemInstance"
        included:
          $ref: "#/components/schemas/ItemInstanceIncluded"
    ListItemInstanceResponse:
      description: An object that contains a list of `ItemInstance`s.
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: An array of `ItemInstance`s.
          type: array
          items:
            $ref: "#/components/schemas/ItemInstance"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/ItemInstanceIncluded"
    #
    # Asset (represent a specific type of item instance that contains additional attributes)
    #
    Asset:
      description: |
        An `Asset` is a specific type of an `ItemInstance` that contains additional attributes related to 
        periodic servicing and periodic inspection.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          description: A string that describes the type of the object.
          type: string
          default: Asset
        id:
          description: A string that uniquely identifies the object.
          type: string
        attributes:
          allOf:
            - $ref: "#/components/schemas/ItemInstanceAttributes"
            - description: Asset related attributes.
              type: object
              properties:
                lastPeriodicServicingDate:
                  $ref: "./dataTypes.yaml#/components/schemas/apiDate"
                nextPeriodicServicingDate:
                  $ref: "./dataTypes.yaml#/components/schemas/apiDateReadOnly"
                lastInspectionDate:
                  $ref: "./dataTypes.yaml#/components/schemas/apiDate"
                nextInspectionDate:
                  $ref: "./dataTypes.yaml#/components/schemas/apiDateReadOnly"
                installationTypeId:
                  description: InstallationType Id. See dictionary `InstallationType`.
                  type: string
                installationDate:
                  description: The installation date referred to when the asset was installed on the plant.
                  $ref: "./dataTypes.yaml#/components/schemas/apiDate"
                capacity:
                  description: Asset capacity.
                  type: number
                  format: double
                volume:
                  description: Asset volume.
                  type: number
                  format: double
                supplierSerialNumber:
                  description: The serial number provided by the asset's supplier.
                  type: string
                  example: "123456"
                instanceLinkTypeId:
                  description: The type of relationship between the given asset and the related `linkedAsset`.
                  type: string
        relationships:
          allOf:
            - $ref: "#/components/schemas/ItemInstanceRelationships"
            - description: Specific Asset's relationships.
              type: object
              properties:
                plant:
                  $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
                capacityUnitOfMeasurement:
                  $ref: "./jsonapi.yaml#/components/schemas/relToOne"
                volumeUnitOfMeasurement:
                  $ref: "./jsonapi.yaml#/components/schemas/relToOne"
                customerAccount:
                  $ref: "./jsonapi.yaml#/components/schemas/relToOne"
                linkedAsset:
                  $ref: "./jsonapi.yaml#/components/schemas/relToOne"
    AssetIncluded:
      description: Related entities data of an `Asset`
      type: array
      items:
        type: object
      uniqueItems: true
    AssetListResponse:
      description: An object that contains a list of `Asset`s.
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: An array of `Asset`s.
          type: array
          items:
            $ref: "#/components/schemas/Asset"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/AssetIncluded"
    AssetResponse:
      description: An object that contains an `Asset`.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Asset"
        included:
          $ref: "#/components/schemas/AssetIncluded"
    AssetRequest:
      description: An object that contains an `Asset`.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Asset"
    Item:
      description: A physical object identified by a SKU.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          description: A string that describes the type of the object
          type: string
          default: "Item"
        id:
          description: A string that uniquely identifies an item.
          type: string
          example: "1"
        attributes:
          $ref: "#/components/schemas/ItemAttributes"
        relationships:
          $ref: "#/components/schemas/ItemRelationships"
    UpdatedItem:
      description: A physical object identified by a SKU.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          description: A string that describes the type of the object
          type: string
          default: "Item"
        id:
          description: A string that uniquely identifies an item.
          type: string
          example: "1"
        attributes:
          $ref: "#/components/schemas/UpdatedItemAttributes"
        relationships:
          $ref: "#/components/schemas/ItemRelationships"
    ClonedItem:
      description: An item with only subset attributes that can be changed when an element is cloned.
      type: object
      required:
        - type
        - id
        - attributes
      properties:
        type:
          description: A string that describes the type of the object
          type: string
          default: "Item"
        id:
          description: A string that uniquely identifies an item.
          type: string
          example: "1"
        attributes:
          description: Attributes of the cloned item that need to be overridden
          type: object
          required:
            - code
            - itemTypeId
            - itemCategoryId
          properties:
            relationTypeId:
              description: See dictionary `RelationType`.
              type: string
            descr:
              description: Item description.
              type: string
            descrShort:
              description: Item short description.
              type: string
            code:
              description: Item code.
              type: string
            itemTypeId:
              description: Item type. See dictionary `ItemType`.
              type: string
            itemCategoryId:
              description: Item category.
              type: string
    ItemListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: The list of items
          type: array
          items:
            $ref: "#/components/schemas/Item"
        included:
          $ref: "#/components/schemas/ItemIncluded"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
    ItemResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Item"
        included:
          $ref: "#/components/schemas/ItemIncluded"
    ItemAttributes:
      description: An object with the attributes that describes an `Item`
      type: object
      required:
        - code
        - sequenceNumber
        - itemType
        - descr
        - descrShort
        - variableWeight
        - itemInstanceMngmType
        - isPublished
      properties:
        code:
          description: A code to distinguish the item.
          type: string
          example: "ABC-1234"
        composition:
          description: Descriptive text for composition, ingredients...
          type: string
          nullable: true
        sequenceNumber:
          description: An always increasing number associated to an `Item`
          type: integer
          example: 1
        itemType:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: A string that describes the type of the `Item`. For more details see _ItemType_ dictionary.
          default: "ItemType.Item"
        descr:
          description: A general description of the item.
          type: string
          example: "T-shirt in Jersey di lino"
        descrShort:
          description: A short description of the item.
          type: string
          example: "T-shirt"
        descrLong:
          description: A detailed description of the item.
          type: string
          nullable: true
          example: "T-shirt in Jersey di lino elasticizzato. Puro al 100%, made in Italy."
        brand:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: The `Item`'s brand identifier. For more information see _Brand_ dictionary.
        salesLine:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: The sales line. See _SalesLine_ dictionary. It limits the products that can be inserted in a document and it impacts the binding between customers and users.
        year:
          description: Creation date of the item. It defines the collection together with season and line.
          type: string
          nullable: true
          example: "2022"
        season:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: The `Item`'s season identifier. For more information see _Season_ dictionary.
        itemDiscountCategory:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Item discount category. For more information see _ItemDiscountCategory_ dictionary.
        itemInstanceMngmType:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Item instance mngm type. For more information see _ItemInstanceMngmType_ dictionary.
          default: "ItemInstanceMngmType.None"
        itemPart:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: The `Item`'s part or material. For more information see _ItemPart_ dictionary.
          nullable: true
        itemColor:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: The `Item`'s color identifier. For more information see _Color_ dictionary.
          nullable: true
        itemSize:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: The `Item`'s size identifier. For more information see _Size_ dictionary.
          nullable: true
        grossWeight:
          description: Gross Weight.
          type: number
          format: double
          nullable: true
        netWeight:
          description: Net Weight.
          type: number
          format: double
          nullable: true
        drainedWeight:
          description: Drained Weight.
          type: number
          format: double
          nullable: true
        shelfLifeDaysBefore:
          description: Validity days number of the lot previous the expiration date.
          type: integer
          nullable: true
        shelfLifeDaysAfter:
          description: Validity days number of the lot after the expiration date.
          type: integer
          nullable: true
        shelfLifeDaysMinOnDelivery:
          description: Shelf life minimum guaranteed at the delivery (in days)
          type: integer
          nullable: true
        variableWeight:
          description: Variable Weight Item
          type: boolean
          default: false
        itemBarcodes:
          description: |
            An array with the barcodes associated to the item. An item can have different barcodes, depending on the unit of measure.
          type: array
          items:
            $ref: "./core.yaml#/components/schemas/SimpleEntity"
        lastChangeTs:
          $ref: "./core.yaml#/components/schemas/lastChangeTs"
        entityAttributes:
          description: |
            The dynamic attributes that may be associated to the item and the static attributes that are translated. 
            For the static attributes the attributeValue is null.
          type: array
          items:
            $ref: "./entityAttributes.yaml#/components/schemas/EntityAttributeValue"
        intrastatCode:
          description: The intrastad code.
          type: string
          example: "99500000"
        perishable:
          description: If the item is perishable (for Italy, see law "D.L 1/2012, art. 62").
          type: boolean
          default: false
        mandateItem:
          description: Item included in a sales mandate that may limit the sale.
          type: boolean
          default: false
        processingStatusId:
          description: Item status. See dictionary "ProcessingStatus".
          type: string
          readOnly: true
        completionStatus:
          description: Completion Status expressed as a percentage.
          type: number
          format: double
          minimum: 0
          maximum: 100
          readOnly: true
        supplierItemCode:
          description: Supplier item code, used when retrieving items of a given supplier.
          type: string
        isDraft:
          $ref: "./core.yaml#/components/schemas/isDraft"
        hasRelatedItems:
          description: True if the item has related items, false otherwise.
          type: boolean
          readOnly: true
        itemSegmentId:
          description: Item segment. See dictionary `ItemSegment`.
          type: string
        authorizationBodies:
          description: Authorization bodies.
          type: array
          items:
            $ref: "./core.yaml#/components/schemas/SimpleEntityReadOnly"
        overallAvailability:
          description: Overall availability.
          type: number
          format: double
          readOnly: true
        renditionUrl:
          description: |
            URL of the requested rendition of the digital content with the sequence number 0. 
            You need to provide the `renditionTypeId` parameter in order to get the correspondent picture's link.
          type: string
          format: uri-reference
          readOnly: true
        referenceEntityObjectId:
          description: |
            If the item is published it represents its draft (if any), otherwise it represents the ID of the published item.
            It is `null` if the current entity is a new item yet to be published.
          type: string
          readOnly: true
        commissionItemGroupId:
          description: Commission item group. See dictionary `CommissionItemGroup`.
          type: string
        capacity:
          description: Item capacity.
          type: number
          format: double
        volume:
          description: Item volume.
          type: number
          format: double
        installationTypeId:
          description: InstallationType Id. See dictionary `InstallationType`.
          type: string
        itemShippingCostGroupId:
          description: Item shipping cost group id. See dictionary `ItemShippingCostGroup`.
          type: string
        periodicServicingRecurrence:
          $ref: "#/components/schemas/PeriodicRecurrence"
          description: Periodic servicing recurrence.
        inspectionRecurrence:
          $ref: "#/components/schemas/PeriodicRecurrence"
          description: Inspection recurrence.
        isPublished:
          description: |
            True if item's processing status is `Released`, false otherwise. In case of an item with ongoing changes,
            the processing status is always referred to the original version of the item.
          type: boolean
          default: false
        mainImageId:
          description: The digital content id representing the main image for this item.
          type: string
        variantLevel:
          description: |
            Variant level of an item.
            The variant level of an item can take the following values:            
            | variantLevel value | itemType allowed | description |
            |-|-|-|
            | `null` | not in (`ItemType.Model`, `ItemType.Variant`) | The item is neither a model nor a variant. |
            | `0` | `ItemType.Model` | It's an item model that can have linked item variants. |
            | `1` | `ItemType.Model` or `ItemType.Variant` | It's a 1st level item variant. |
            | `2` | `ItemType.Variant` | It's a 2nd level item variant. |
          type: integer
          minimum: 0
          maximum: 2
