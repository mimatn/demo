      type: object
      properties:
        s:
          description: Filter the response by `code`, `descr`, `descrShort`, `descrLong` attributes.
          type: string
        itemBarcode:
          description: Filter the response by the barcode of an `Item`.
          type: string
        itemType:
          description: Filter the response by the Item Type. See dictionary `ItemType`.
          type: string
        itemCategory:
          description: Filter the response by the `ItemCategory`.
          type: string
        tag:
          description: Filter the response by Tag Id.
          type: string
        lastChangeTs:
          description: Filter the response by Last Change TS.
          type: string
          example: "gt:2022-02-25T00:00:00.0Z"
        itemStatus:
          description: Filter the response by the `ItemStatus`.
          type: string
        brand:
          description: Filter the response by the Brand id. See dictionary `Brand`.
          type: string
        salesLine:
          description: Filter the response by Sales Line Id. See dictionary `SalesLine`.
          type: string
        year:
          description: Filter the response by the year of creation of the item.
          type: string
          example: "eq:2022"
        season:
          description: Filter the response by Season Id. See dictionary `Season`.
          type: string
        completionStatus:
          description: Filter the response by completion status.
          type: string
        processingStatus:
          description: Filter the response by processing status.
          type: string
        itemSegmentId:
          description: Filter the response by item segment.
          type: string
        salesDepartment:
          description: Filter the response by sales department.
          type: string
        authorizationBody:
          description: Filter the response by authorization body.
          type: string
        parentItem:
          description: Filter the response by parent item id.
          type: string
        itemPart:
          description: Filter the response by item part id.
          type: string
        marketplaceId:
          description: Filters the response by marketplace id.
          type: string
        itemCatalogHierarchyNode:
          description: Filters the response by item hierarchy node id.
          type: string
        isPublished:
          description: |
            When `true` only items with processing status `Released` are considered. In case of items with
            ongoing changes, the processing status considered by this filter is always the original item's one.
          type: string
        variantLevel:
          description: |
            Filter the response by the variant level of an item.
            The variant level of an item can take the following values:            
            | variantLevel value | itemType allowed | description |
            |-|-|-|
            | `null` | not in (`ItemType.Model`, `ItemType.Variant`) | retrieves only items are neither models nor variants. |
            | `0` | `ItemType.Model` | retrieves only the model items. |
            | `1` | `ItemType.Model` or `ItemType.Variant` | retrieves only the 1st level variant items. |
            | `2` | `ItemType.Variant` | retrieves only the 2nd level variant items. |
          type: string
          example: "eq:1"
        itemSubscriptionServiceId:
          description: |
            Filter the response by Item Subscription Service Id. See dictionary `ItemSubscriptionService`.

            **NOTE**: This filter is available only to users with the `listItemSubscriptionService` permission.
          type: string
        itemShippingCostGroupId:
          description: Filter the response by Item Shipping Cost Group Id. See dictionary `ItemShippingCostGroup`.
          type: string
