      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      summary: canDraftItemOwnershipChange
      description: |
        Invoke this service to find out if you can change the draft owner.

        To access the service you need at least one of the following permissions:
        | Permission (one of) | 
        |:-:|
        | changeDraftItemOwnership |
      operationId: canDraftItemOwnershipChange
      tags:
        - Item
      x-authorities: ["changeDraftItemOwnership"]
      responses:
        "200":
          description: Means that the owner of the draft can be changed at the moment.
        "400":
          description: |
            The current draft owner is still working on it, so it is not possible to change ownership. 
            The message error contains a minimum amount of time (in minutes) before trying to change the draft owner again.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    patch:
      summary: changeDraftItemOwnership
      description: |
        The draft of an item relates to two user profiles:
        1. The user that originally created the draft: `draftOwnerUserProfile`;
        2. The user that is currently editing the draft: `currentDraftUserProfile`.
        This service changes the `currentDraftUserProfile`. The item id must refer to a draft item. 
        If the caller is `currentDraftUserProfile` the change of ownership takes place immediately. Otherwise
        a configurable amount of time must have passed since the last modification of the draft.

        To access the service you need at least one of the following permissions:
        | Permission (one of) | 
        |:-:|
        | changeDraftItemOwnership |
      operationId: changeDraftItemOwnership
      tags:
        - Item
      x-authorities: ["changeDraftItemOwnership"]
      requestBody:
        description: The `Item` to update.
        required: true
        content:
          application/vnd.api+json:
