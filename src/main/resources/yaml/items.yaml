    ItemStatus:
      description: |
        The status of an item. It can assume the following values:
        * `UNBOUND`: item not received and not associated to an SKU;
        * `BOUND`: item associated to a SKU;
        * `ALLOCATED`: item in stock and ready to exit the warehouse;
        * `IN_TRANSFER`: item moving from-to a warehouse;
        * `SOLD`: item sold;
        * `ARCHIVED`: the item is serialized and archived in a low-cost storage;
        * `DELETED`: after being archived for a certain amount of time, the item and its info is physically deleted;
        * `DISPOSED`: an item that is returned and cannot be sold anymore.
      type: object
      required:
        - id
        - type
        - attributes
      properties:
        id:
          description: A string that uniquely identifies an `ItemStatus`.
          type: string
          example: "1"
        type:
          description: A string that describes the type of the object.
          type: string
          example: "ItemStatus"
        attributes:
          type: object
          required:
            - code
            - descr
          properties:
            code:
              description: A string used to uniquely identify an `ItemStatus`, without exposing the id.
              type: string
              example: "UNBOUND"
            descr:
              description: A text that describes the meaning of the status.
              type: string
              example: "Item not received and not associated to an SKU"
    ItemStatusIncluded:
      description: Related entities data of an `ItemStatus`.
      type: array
      items:
        type: object
      uniqueItems: true
    ItemStatusListResponse:
