        schema:
          type: string
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    post:
      description: |
        This API releases the purchase document specified in the path when it is used as a reading document.

        Releasing a purchase reading document consists on these actions:
        * Deletion of all the unexpected lines, serials and packages.
        * Deletion of all the unknown RFID tags.
        * Update of the fulfillment status of the source documents linked to the one provided in the path.
        * Update of the fulfillment status of the source documents' lines linked to the one provided in the path.
        * Change the document's processing status to `Released`.
      operationId: releasePurchaseDocReading
      tags:
        - Purchase Document
      x-authorities:
        - apiUser
      requestBody:
        description: An object containing the parameters to consider to release a reading document.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "./documents.yaml#/components/schemas/ReleaseReadingDocRequest"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /purchase-docs/reading/headers/{headerId}/aggregated-data:
    parameters:
      - name: headerId
        in: path
        description: The id of a purchase document.
        required: true
        schema:
          type: string
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: |
        This API retrieves the data of the document identified by `headerId` (reading doc)
        grouped accordingly with the aggregation strategy provided as a parameter. In
        particular, data can be aggregated by: line, package, line and package, serials.

        It is possible to specify filters to narrow down data based on the consumer's
        needs. For each element in the resulting list will be specified a map containing
        the values of the filters needed to consult its detail. For example: each group
        obtained with the `GroupByPackage` aggregation startegy, will have the filtering
        attributes to retrieve the items in a package and the serials in it.
      operationId: getPurchaseDocAggregatedData
      tags:
        - Purchase Document
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "./documents.yaml#/components/parameters/groupByFulfilledDoc"
        - $ref: "./documents.yaml#/components/parameters/groupByReason"
        - $ref: "./documents.yaml#/components/parameters/groupByOperationReason"
        - $ref: "./documents.yaml#/components/parameters/includeCountersRequired"
        - $ref: "./documents.yaml#/components/parameters/includePackageCountersRequired"
        - $ref: "./documents.yaml#/components/parameters/groupingStrategy"
        - $ref: "./documents.yaml#/components/parameters/GetReadingDocAggregatedDataSorting"
        - $ref: "./documents.yaml#/components/parameters/GetReadingDocAggregatedDataFilters"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "./documents.yaml#/components/schemas/ReadingDocGetAggregatedResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
