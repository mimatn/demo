    parameters:
      - $ref: "./documents.yaml#/components/parameters/headerId"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      summary: canDraftPurchaseOrderOwnership
      description: |
        Invoke this service to find out if you can change the draft owner.
         
        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | changeDraftPurchaseOrderOwnership |
        | changeDraftPurchaseDocOwnership |
      operationId: canDraftPurchaseOrderOwnership
      tags:
        - Purchase Document
      x-authorities: ["changeDraftPurchaseOrderOwnership", "changeDraftPurchaseDocOwnership"]
      responses:
        "200":
          description: Means that the owner of the draft can be changed at the moment.
        "400":
          description: |
            The current draft owner is still working on it, so it is not possible to change ownership. 
            The message error contains a minimum amount of time (in minutes) before trying to change the draft owner again.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    patch:
      summary: changeDraftPurchaseOrderOwnership
      description: |
        The draft of a purchase order relates to two user profiles:
        * The user that originally created the draft: `draftOwnerUserProfile`;
        * The user that is currently editing the draft:`currentDraftUserProfile`.

        This service changes the `currentDraftUserProfile`. The header id must refer to a draft purchase doc. 
        If the caller is `currentDraftUserProfile` the change of ownership takes place immediately. Otherwise,
        a configurable amount of time must have passed since the last modification of the draft.
         
        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | changeDraftPurchaseOrderOwnership |
        | changeDraftPurchaseDocOwnership |
      operationId: changeDraftPurchaseOrderOwnership
      tags:
        - Purchase Document
      x-authorities: ["changeDraftPurchaseOrderOwnership", "changeDraftPurchaseDocOwnership"]
      requestBody:
        description: The Purchase doc to update.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "./core.yaml#/components/schemas/ChangeDraftEntityOwnershipRequest"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /purchase-docs/headers/{headerId}/inbound:
