openapi: 3.0.3
info:
  title: Purchase Documents API
  version: "-"
  description: APIs for Purchase Document.
tags:
  - name: Purchase Document
    description: Purchase Document.
components:
  schemas:
    PurchaseDocHeaderAttributes:
      description: |
        Specific attributes of a purchase document header. The attributes that are in common with the other types of document
        are defined in the `DocHeaderAttributes` object.
      type: object
      required:
        - grossAmount
        - netAmount
        - taxAmount
        - totalAmount
      properties:
        fulfillmentStatusId:
          $ref: "./documents.yaml#/components/schemas/FulfillmentStatus"
        deliveryStatusId:
          description: The line's delivery status.
          type: string
          example: "DeliveryStatus.InPreparation"
        totals:
          $ref: "./documents.yaml#/components/schemas/DocHeaderTotals"
        grossAmount:
          description: Gross amount.
          type: number
        netAmount:
          description: Document value gross of discounts and net of VAT.
          type: number
        taxAmount:
          description: Document total VAT amount.
          type: number
        totalAmount:
          description: Document total, taxed included.
          type: number
        socialSecurityInstitutionId:
          description: See dictionary `SocialSecurityInstitution`.
          type: string
        socialContributionTaxableBasePct:
          description: |
            Percentage of the taxable amount on which the percentage of contributions is applied (e.g. 100 for the entire taxable amount).
          type: number
          format: double
        socialContributionTaxableBaseAmount:
          description: Tax base for the application of contributions.
          type: number
        socialContributionTaxablePct:
          description: Social contribution taxable percentage.
          type: number
          format: double
        socialContributionTaxableAmount:
          description: Social contribution taxable amount.
          type: number
        contributionThresholdExceeded:
          description: If true, social security contributions have not been calculated due to exceeding the threshold.
          type: boolean
        authorityId:
          description: Authority Id. See dictionary `Authority`.
          type: string
        withholdingTaxTaxableBasePct:
          description: Withholding tax taxable base percentage.
          type: number
          format: double
        withholdingTaxTaxableBaseAmount:
          description: Withholding tax taxable base amount.
          type: number
        withholdingTaxPercentage:
          description: Withholding tax percentage.
          type: number
          format: double
        withholdingTaxAmount:
          description: Withholding tax amount.
          type: number
        taxRegime:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Tax regime
        contributionThreshold:
          description: Contribution threshold above which contributions are not calculated.
          type: number
        previousCommissionAmount:
          description: Amount of previous commission turnover for the supplier and accounting period of the document.
          type: number
        residualCommissionAmount:
          description: Residual commission amount. Is given by `contributionThreshold` - `previousCommissionAmount` - `netAmount`
          type: number
        deliveryDate:
          $ref: "./dataTypes.yaml#/components/schemas/apiDate"
        deliveryAddress:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
        deliveryModeId:
          description: Delivery mode id. See dictionary `DeliveryMode`.
          type: string
        shippingMethodId:
          description: Shipping method id. See dictionary `ShippingMethod`.
          type: string
        courierId:
          description: Courier id. See dictionary `Courier`.
          type: string
        transportReasonId:
          description: Transport reason id. See dictionary `TransportReason`.
          type: string
        totalPackagesCount:
          description: Total number of packages in the document.
          type: number
          minimum: 0
          default: 0
          readOnly: true
        totalReadpackagesCount:
          description: |
            Total number of read packages in the document. These are the packages associated to a document's line with
            quantity greater than `0`.
          type: number
          minimum: 0
          default: 0
          readOnly: true
    PurchaseDocHeaderAttributesWithDocHeader:
      description: Complete set of attributes of a purchase document header.
      allOf:
        - $ref: "#/components/schemas/PurchaseDocHeaderAttributes"
        - description: DocHeader attributes
          type: object
          required:
            - docHeaderAttributes
          properties:
            docHeaderAttributes:
              $ref: "./documents.yaml#/components/schemas/DocHeaderAttributes"
    PurchaseDocHeaderRelationships:
      description: A purchase document's relationships. They extend generic document header's ones.
      type: object
      required:
        - buyFromSupplier
      properties:
        buyFromSupplier:
          $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
        warehouse:
          $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
        currency:
          $ref: "./jsonapi.yaml#/components/schemas/relToOne"
        priceList:
          $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
        paymentCondition:
          $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
        socialContribution:
          $ref: "./jsonapi.yaml#/components/schemas/relToOne"
        withholdingTax:
          $ref: "./jsonapi.yaml#/components/schemas/relToOne"
    PurchaseDocHeader:
      description: An object that contains the information about a purchase document header.
      type: object
      required:
        - id
        - type
        - attributes
        - relationships
      properties:
        id:
          description: A string that uniquely identifies the object.
          type: string
          example: "PDOC.HEADER.1"
        type:
          description: A string that describes the type of the object.
          type: string
          default: "PurchaseDocHeader"
        attributes:
          $ref: "#/components/schemas/PurchaseDocHeaderAttributesWithDocHeader"
        relationships:
          allOf:
            - $ref: "./documents.yaml#/components/schemas/DocHeaderRelationships"
            - $ref: "#/components/schemas/PurchaseDocHeaderRelationships"
    PurchaseDocHeaderIncluded:
      description: Related document header and common document header relationships.
      type: array
      items:
        type: object
      uniqueItems: true

    PurchaseDocHeaderListResponse:
      description: An object with a list of purchase document headers.
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: The list of purchase document headers.
          type: array
          items:
            $ref: "#/components/schemas/PurchaseDocHeader"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/PurchaseDocHeaderIncluded"
    PurchaseDocHeaderResponse:
      description: Single purchase document header response
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/PurchaseDocHeader"
        included:
          $ref: "#/components/schemas/PurchaseDocHeaderIncluded"
    PurchaseDocHeaderRequest:
      description: Object to use to create a new purchase document header.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/PurchaseDocHeader"
    PurchaseDocLineAttributes:
      description: The attributes of a purchase document line.
      type: object
      required:
        - lineNumber
        - sign
        - docFulfillQuantity
        - reason
        - docLineGrossPrice
        - docLineNetPrice
        - netAmount
        - commonLineAttributes
      properties:
        lineNumber:
          description: The line's number in the document.
          type: string
          example: "1"
        warehouse:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
        sign:
          description: +1 if line's amount is positive, -1 otherwise.
          type: integer
          minimum: -1
          maximum: 1
        docQuantity:
          description: Document quantity expressed in the document's unit of measure.
          type: number
          format: double
          default: 0.0
          example: 5.0
          minimum: 0
        docFulfillQuantity:
          description: Quantity of goods processed expressed in the document's unit of measure.
          type: number
          format: double
          default: 0.0
          example: 5.0
        expectedDocQuantity:
          description: Expected quantity expressed in the document's unit of measure.
          type: number
          format: double
          example: 5.0
          default: 0.0
          minimum: 0.0
        reason:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
        fulfillmentStatusId:
          $ref: "./documents.yaml#/components/schemas/FulfillmentStatus"
        deliveryStatusId:
          description: The line's delivery status.
          type: string
          example: "DeliveryStatus.InPreparation"
        deliveryDate:
          $ref: "./dataTypes.yaml#/components/schemas/apiDate"
        externalRefNumber:
          description: External ref number.
          type: string
        packageCode:
          description: Package code.
          type: string
        descr:
          description: Line description.
          type: string
        priceQuantity:
          description: Price quantity.
          type: number
        convFactorPriceToDoc:
          description: Conversion factor.
          type: number
        priceListPrice:
          description: Price list price.
          type: number
        docLineGrossPrice:
          description: Document line gross price.
          type: number
        docLineNetPrice:
          description: Document line net price.
          type: number
        netAmount:
          description: Net amount.
          type: number
          readOnly: true
        taxRateGroup:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Tax Rate Group
        printableTaxRates:
          description: Vat rates applied concatenated in a single string.
          type: string
          example: 4% + 1.5%
        packageQtyPerBox:
          description: If the line refers to a package, this is the number of elements in each box in the package.
          type: integer
          minimum: 0
        packageNumberPerLayer:
          description: If the line refers to a package, this is how many boxes there are in each layer of the package.
          type: integer
          minimum: 0
        packageNumberOfLayers:
          description: If the line refers to a package, this is how many layers there are in the package.
          type: integer
          minimum: 0
        expectedLoadingUnitsNumber:
          description: |
            How many loading units should be generated for the line. This number is calculated combining together 
            line's quantity and packaging information about the line.
          type: integer
          minimum: 0
          example: 5
        generatedLoadingUnitsNumber:
          description: |
            How many loading units have been generated for the line. This number could be grater than the expected one.
          type: integer
          minimum: 0
          example: 4
        toGenerateLoadingUnitsNumber:
          description: |
            How many loading units remain to generate for the line. This number is calculated as the difference between 
            the `expectedLoadingUnitsNumber` and `generatedLoadingUnitsNumber`. If were generated more loading units 
            than the expected ones, this value would be `0` since the loading units requirement have been satisfied.
          type: integer
          minimum: 0
          example: 1
        commonLineAttributes:
          $ref: "./documents.yaml#/components/schemas/CommonDocLineAttributes"
        boxesPerPackageFull:
          description: |
            The number of boxes in a package in the full loading unit.
            Full loading unit means a loading unit with all package layers filled.
            Obtained by calculating: `packageNumberPerLayer * packageNumberOfLayers`.
          type: integer
        boxesPerPackagePartial:
          description: |
            The number of boxes in a package in the partial loading unit.
            Partial loading unit means a loading unit that does not have all the layers of the package filled.
            Obtained by performing a calculation.
          type: number
          format: double
        totQntUDCFull:
          description: |
            The total quantity of pieces contained in the full loading unit.
            Full loading unit means a loading unit with all package layers filled.
            Obtained by calculating: `packageQtyPerBox * boxesPerPackageFull`.
          type: integer
        totQntUDCPartial:
          description: |
            The total quantity of pieces contained in the partial loading unit.
            Partial loading unit means a loading unit that does not have all the layers of the package filled.
            Obtained by performing a calculation.
          type: number
          format: double
        numUDCFull:
          description: |
            Number of full loading units.
            Full loading unit means a loading unit with all package layers filled.
            Obtained by performing a calculation.
          type: number
          format: double
        numUDCPartial:
          description: |
            Number of partial loading units.
            Partial loading unit means a loading unit that does not have all the layers of the package filled.
            Obtained by performing a calculation.
          type: integer
          minimum: 0
          maximum: 1
    PurchaseDocLineRelationships:
      description: The relationships of a purchase document line.
      type: object
      required:
        - purchaseDocHeader
        - item
        - itemStatus
      properties:
        purchaseDocHeader:
          $ref: "./jsonapi.yaml#/components/schemas/relToOneReadOnly"
        item:
          $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
        itemStatus:
          $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
        fulfilledDocHeader:
          $ref: "./jsonapi.yaml#/components/schemas/relToOneNullable"
        fulfilledDocLine:
          $ref: "./jsonapi.yaml#/components/schemas/relToOneNullable"
        priceItemUnitOfMeasurement:
          $ref: "./jsonapi.yaml#/components/schemas/relToOneNullable"
        priceListDetail:
          $ref: "./jsonapi.yaml#/components/schemas/relToOne"
        tax:
          $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
    PurchaseDocLineIncluded:
      description: Related relationships of a purchase document line.
      type: array
      items:
        type: object
      uniqueItems: true
    PurchaseDocLine:
      description: A purchase document line.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          description: A string that describes the type of the object.
          type: string
          default: "PurchaseDocLine"
        id:
          description: A string that uniquely identify the object.
          type: string
          example: "P.LINE.1"
        attributes:
          $ref: "#/components/schemas/PurchaseDocLineAttributes"
        relationships:
          allOf:
            - $ref: "./documents.yaml#/components/schemas/CommonDocLineRelationships"
            - $ref: "#/components/schemas/PurchaseDocLineRelationships"
    PurchaseDocLineListResponse:
      description: An object with a list of purchase document lines.
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: A list of purchase document lines.
          type: array
          items:
            $ref: "#/components/schemas/PurchaseDocLine"
        included:
          $ref: "#/components/schemas/PurchaseDocLineIncluded"
        meta:
          allOf:
            - $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
            - type: object
              required:
                - fulfilledDocTotals
              properties:
                fulfilledDocTotals:
                  $ref: "./documents.yaml#/components/schemas/DocLineTotalsPaginationMeta"
                lineNumber:
                  description: The first available line number.
                  type: integer
                  minimum: 0
    PurchaseDocLineResponse:
      description: Single Purchase Document Line response.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/PurchaseDocLine"
        included:
          $ref: "#/components/schemas/PurchaseDocLineIncluded"
    PurchaseDocLineRequest:
      description: Object to use to create a new Purchase document line.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/PurchaseDocLine"
    PurchaseDocLineListRequest:
      description: List of new Purchase document lines to create.
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseDocLine"
    PurchaseDocLineWithHeader:
      description: |
        PurchaseDocLineWithHeader resource. Contains all attributes and relationships of the purchase document line included
        purchase document header info.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "PurchaseDocLineWithHeader"
        id:
          type: string
        attributes:
          allOf:
            - $ref: "#/components/schemas/PurchaseDocHeaderAttributesWithDocHeader"
            - $ref: "#/components/schemas/PurchaseDocLineAttributes"
        relationships:
          allOf:
            - $ref: "./documents.yaml#/components/schemas/DocHeaderRelationships"
            - $ref: "#/components/schemas/PurchaseDocHeaderRelationships"
            - $ref: "#/components/schemas/PurchaseDocLineRelationships"
    PurchaseDocLineWithHeaderIncluded:
      description: PurchaseDocLineWithHeader related schemas.
      type: array
      items:
        type: object
      uniqueItems: true
    PurchaseDocLineWithHeaderListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: The list of purchase documents lines with their header info included.
          type: array
          items:
            $ref: "#/components/schemas/PurchaseDocLineWithHeader"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/PurchaseDocLineWithHeaderIncluded"
    LoadingUnitGenData:
      description: The data needed to generate a loading unit.
      type: object
      required:
        - type
        - attributes
        - relationships
      properties:
        type:
          description: A string that describes the type of the object.
          type: string
          default: "LoadingUnitGenData"
        attributes:
          description: Attributes for a loading unit generation.
          type: object
          required:
            - unitsToGenerate
            - boxesPerLoadingUnit
          properties:
            unitsToGenerate:
              description: How many loading units to generate.
              type: integer
              minimum: 1
            boxesPerLoadingUnit:
              description: The number of boxes in the loading unit.
              type: integer
              minimum: 1
        relationships:
          description: Entities related to loading unit generation.
          type: object
          required:
            - purchaseDocLine
          properties:
            purchaseDocLine:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            labelTemplate:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
    LoadingUnitGenRequest:
      description: An object that contains data needed to generate loading units.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/LoadingUnitGenData"
    LoadingUnit:
      description: The smallest storage unit placed on a modular package used to obtain an efficient movement.
      type: object
      required:
        - type
        - attributes
        - relationships
      properties:
        type:
          description: A string that describes the type of the object
          type: string
          default: "LoadingUnit"
        attributes:
          description: The attributes that describe a loading unit.
          type: object
          required:
            - generationTs
            - labelsNumber
            - filledLabelsTemplates
            - tags
          properties:
            code:
              description: The loading unit code.
              type: string
              example: "00924713"
            generationTs:
              description: When the loading units has been generated.
              allOf:
                - $ref: "./dataTypes.yaml#/components/schemas/apiDateTime"
            labelsNumber:
              description: |
                How many labels have been generated for the loading unit. Concretely, a label is an UHF tag physically
                applied to the loading unit and used to uniquely recognize it in a logistic context.
              type: integer
              minimum: 0
              example: 2
            boxesPerLoadingUnit:
              description: |
                The total number of boxes in the loading unit. The value of this attribute may differ from the one
                provided during loading unit generation phase. In particular, if the number of boxes times the quantity
                per box exceeds the total quantity of the line the unit refers to, this attribute is overridden with
                `ceil(totalQuantity / quantityPerBox)`.
              type: integer
              minimum: 1
            filledLabelsTemplates:
              description: |
                An array that contains a template for each label filled with data. This array is empty in all GET 
                services that deals with loading units and populated when loading units are generated.
              type: array
              items:
                description: A filled template.
                type: string
            tags:
              description: |
                An array containing the EPC of the tags generated during UDC creation. The length of this array must
                match the length of `filledLabelsTemplates` since there is a tag for each label.
              type: array
              items:
                description: The tags generated during UDC creation.
                type: string
            unitTotal:
              description: |
                Represents the loading unit quantity. It is obtained by multiplying `PackageNumberOfLayers *
                PackageNumberPerLayer * PackageQtyPerBox`, defined for the line the loading unit refers to.
                This calculation takes into account that the number of boxes can be override by user. Moreover, if the
                product `PackageNumberOfLayers * PackageNumberPerLayer * PackageQtyPerBox` is grater than the line
                quantity, the `unitTotal` is set to the line quantity.
              type: number
              format: double
              example: 100.0
    LoadingUnitListResponse:
      description: An object that contains a list of loading units.
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LoadingUnit"
    LoadingUnitResponse:
      description: An object that contains a loading unit.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/LoadingUnit"
    PurchaseDocReading:
      description: An object needed to create a new purchase reading document.
      type: object
      required:
        - type
        - attributes
        - relationships
      properties:
        type:
          description: A string that describes the type of the object.
          type: string
          default: "PurchaseDocReading"
        attributes:
          description: The attributes needed to create a new purchase document.
          type: object
          required:
            - creationDate
            - ignoreReadingPackage
            - ignoreReadingInstance
            - createWithLineFromExpectedDocument
            - createWithPackageFromExpectedDocument
            - createWithInstanceFromExpectedDocument
            - unexpectedDataStrategy
          properties:
            creationDate:
              $ref: "./dataTypes.yaml#/components/schemas/apiDate"
              description: The date when the document is created.
            ignoreReadingPackage:
              description: Flag to indicate whether to interpret the read packages or not.
              type: boolean
              default: false
            ignoreReadingInstance:
              description: Flag to indicate whether to interpret the read items or not.
              type: boolean
              default: false
            lineMatchAttributes:
              description: |
                Attributes used to identify the match between reading and expected document.
                The match is between the value of the ItemInstance and the one present in the reading document line.
              type: array
              items:
                uniqueItems: true
                $ref: "./documents.yaml#/components/schemas/LineMatchAttribute"
            createWithLineFromExpectedDocument:
              description: If `true`, the lines will be copied to the reading document.
              type: boolean
            createWithPackageFromExpectedDocument:
              description: If `true`, the packages will be copied to the reading document.
              type: boolean
            createWithInstanceFromExpectedDocument:
              description: If `true`, the item instances will be copied to the reading document.
              type: boolean
            unexpectedDataStrategy:
              $ref: "./documents.yaml#/components/schemas/UnexpectedDataStrategy"
        relationships:
          description: Related entities relationships needed to create a new purchase doc.
          type: object
          required:
            - supplier
            - organization
            - docType
            - language
          properties:
            supplier:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            organization:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            docType:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            userProfile:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            checkpoint:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            device:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            fulfilledDocHeaders:
              $ref: "./jsonapi.yaml#/components/schemas/relToMany"
            language:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
    PurchaseDocReadingRequest:
      description: A request to create a new purchase reading document.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/PurchaseDocReading"
    PurchaseDocInboundResponse:
      description: An object that contains information about an inbound operation registered by a purchase document.
      type: object
      required:
        - data
      properties:
        data:
          description: A list containing the inbound information of a purchase document.
          type: array
          items:
            $ref: "./documents.yaml#/components/schemas/InboundLine"
        included:
          description: Entities related to inbound information.
          type: array
          items:
            $ref: "./items.yaml#/components/schemas/Item"
          uniqueItems: true
        meta:
          description: An object that contains summary information about an inbound operation.
          type: object
          properties:
            totals:
              description: An object tha contains the totals of an inbound operation.
              type: object
              readOnly: true
              properties:
                readQty:
                  description: |
                    The total quantity of items read during the inbound operation. This number **only** counts the items
                    read by the **checkpoint** that created the inbound document. It is expressed in the document's unit of
                    measurement.
                  type: number
                  format: double
                  minimum: 0
                expectedQty:
                  description: |
                    The total quantity of items expected during the inbound operation. This number counts the items defined
                    in the lines of the document fulfilled by the inbound one. It is expressed in the document's unit of
                    measurement.
                  type: number
                  format: double
                  minimum: 0
                missingQty:
                  description: |
                    The total quantity of missing items during the inbound operation. This number is the sum of the
                    differences between expected and fulfilled quantities declared in the source document. Since fulfilled
                    quantities may be updated by multiple checkpoints at the same time, this number reflects the overall
                    inbound operation. It is expressed in the document's unit of measurement.
                  type: number
                  format: double
                  minimum: 0
                unexpectedQty:
                  description: |
                    The total quantity of unexpected items during the inbound operation. This number **only** counts the
                    unexpected items read by the **checkpoint** that created the inbound document. It is expressed in the
                    document's unit of measurement.
                  type: number
                  format: double
                  minimum: 0
    PurchaseDocLineInstance:
      description: |
        A serialized object linked to a purchase document line (e.g. an item tagged with a RFID label).
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          description: A string that describes the type of the object.
          default: "PurchaseDocLineInstance"
        id:
          description: A string that uniquely identifies the object.
          type: string
        attributes:
          description: The attributes of a purchase document line instance.
          type: object
          required:
            - itemStatusId
            - docQuantity
            - docUnitOfMeasurement
            - stockQuantity
            - stockUnitOfMeasurement
            - convFactorStockToDoc
            - convFactorDenomStockToDoc
            - lastChangeTs
          properties:
            itemStatusId:
              $ref: "./core.yaml#/components/schemas/SimpleEntity"
              description: The status of the serialized item linked to the purchase document line.
            docQuantity:
              description: The quantity of the serialized item expressed in the document's unit of measurement.
              type: number
              format: double
              minimum: 0
            docUnitOfMeasurement:
              $ref: "./core.yaml#/components/schemas/SimpleEntity"
              description: The unit of measurement of the serialized item's doc quantity.
            stockQuantity:
              description: The quantity of the serialized item expressed in the stock's unit of measurement.
              type: number
              format: double
              minimum: 0
            stockUnitOfMeasurement:
              $ref: "./core.yaml#/components/schemas/SimpleEntity"
              description: The unit of measurement of the serialized item's stock quantity.
            convFactorStockToDoc:
              description: |
                The conversion factor from the stock's unit of measurement to the document's unit of measurement.
              type: number
              format: double
              minimum: 0
              exclusiveMinimum: true
            convFactorDenomStockToDoc:
              description: |
                The conversion factor's denominator from the stock's unit of measurement to the document's unit of
                measurement.
              type: number
              format: double
              minimum: 0
              exclusiveMinimum: true
            lastChangeTs:
              $ref: "./dataTypes.yaml#/components/schemas/apiDateTime"
              description: The timestamp of the last change of the serialized item line.
            epc:
              description: The Electronic Product Code (EPC) of the serialized item when it has a RFID label attached.
              type: string
        relationships:
          description: The relationships of a purchase document line instance.
          type: object
          required:
            - purchaseDocLine
            - itemInstance
          properties:
            purchaseDocLine:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
              description: The line the instance refers to.
            itemInstance:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
              description: The instance of the serialized item.
    ListPurchaseDocLineInstanceResponse:
      description: An object that contains a list of serialized items linked to a purchase document line.
      type: object
      required:
        - data
      properties:
        data:
          description: A list of serialized items linked to a purchase document line.
          type: array
          items:
            $ref: "#/components/schemas/PurchaseDocLineInstance"
        included:
          description: Entities related to serialized items linked to a purchase document line.
          type: array
          items:
            type: object
          uniqueItems: true
    PurchaseDocLineInstanceRequest:
      description: An object that contains a single purchase doc line instance.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/PurchaseDocLineInstance"
    PurchaseDocLineInstanceResponse:
      description: An object that contains a single purchase doc line instance.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/PurchaseDocLineInstance"
    PurchaseDocLineInstanceUpdateData:
      description: The data needed to update a purchase document line instance.
      type: object
      required:
        - type
        - attributes
      properties:
        type:
          description: A string that describes the type of the object.
          default: "PurchaseDocLineInstanceUpdateData"
        attributes:
          description: The updatable attributes of a purchase document line instance.
          type: object
          required:
            - itemStatusId
          properties:
            itemStatusId:
              description: The id of the new status of the serialized item linked to the purchase document line.
              type: string
    PurchaseDocLineInstanceUpdateRequest:
      description: An object that contains the data needed to update a purchase document line instance.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/PurchaseDocLineInstanceUpdateData"
    PurchaseDocAggregatedDataResponse:
      description: An object that contains the aggregated data of a purchase document.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/PurchaseDocAggregatedData"
    PurchaseDocNoGroupingElement:
      type: object
      required:
        - lineId
        - item
        - expectedQty
        - readQty
        - missingQty
        - unexpectedQty
        - lastChangeTs
        - reason
      properties:
        lineId:
          description: The line id.
          type: string
        item:
          description: Related item.
          type: object
          required:
            - id
            - descr
            - code
            - isUnexpected
          properties:
            id:
              description: The item id.
              type: string
            descr:
              description: The item description.
              type: string
            code:
              description: The item code.
              type: string
            brand:
              description: The item brand.
              type: string
            size:
              description: The item size.
              type: string
            color:
              description: The item color.
              type: string
            isUnexpected:
              description: Indicates if the item is unexpected.
              type: boolean
              default: false
        expectedQty:
          description: The expected quantity of the item.
          type: number
          format: double
        readQty:
          description: Quantity or number of tags read.
          type: number
          format: double
        missingQty:
          description: Quantity or number of missing tags.
          type: number
          format: double
        unexpectedQty:
          description: Quantity of unexpected tags read.
          type: number
          format: double
        lastChangeTs:
          $ref: "./dataTypes.yaml#/components/schemas/apiDateTime"
        reason:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
    PurchaseDocAggregatedTotals:
      description: |
        An object containing data calculated by aggregating the lines of a purchase document based on a particular
        aggregation strategy. Since data may be aggregated in different ways, the meaning of these attributes will
        be specified in the context of the aggregation strategy used.
      type: object
      required:
        - expectedQty
        - readQty
        - missingQty
        - unexpectedQty
      properties:
        expectedQty:
          description: The total expected quantity.
          type: number
          format: double
        readQty:
          description: The total read quantity.
          type: number
          format: double
        missingQty:
          description: The total missing quantity.
          type: number
          format: double
        unexpectedQty:
          description: The total unexpected quantity.
          type: number
          format: double
    PurchaseDocNoGrouping:
      description: |
        Raw item-level aggregation without grouping.

        For the `noGrouping` strategy, the meaning of the attributes inside `totals` is the following:

        * `expectedQty`: Counts the items defined in the lines of the document fulfilled by the considered one.
        It is expressed in the document's unit of measurement.
        * `readQty`: Counts **only** the serials read by the **checkpoint** that created the considered purchase
        document. It is expressed in the document's unit of measurement.
        * `missingQty`: It is the sum of the differences between expected and fulfilled quantities declared in
        the source document. It is expressed in the document's unit of measurement.
        * `unexpectedQty`: Counts **only** the unexpected items read by the **checkpoint** that created the
        considered purchase document. It is expressed in the document's unit of measurement.
      type: object
      required:
        - groups
        - totals
      properties:
        groups:
          description: An array where each group represents a line of a purchase document.
          type: array
          items:
            $ref: "#/components/schemas/PurchaseDocNoGroupingElement"
        totals:
          $ref: "#/components/schemas/PurchaseDocAggregatedTotals"
    PurchaseDocGroupByPackageGroup:
      type: object
      required:
        - packageCode
        - expectedQty
        - readQty
        - missingQty
      properties:
        packageCode:
          description: The package code id.
          type: string
        expectedQty:
          description: The expected quantity of the item.
          type: number
          format: double
        readQty:
          description: Quantity or number of tags read.
          type: number
          format: double
        missingQty:
          description: Quantity or number of missing tags.
          type: number
          format: double
    PurchaseDocGroupByPackage:
      description: |
        Purchase document data aggregated by package code. Each group represents a single package.

        For the `groupByPackage` strategy, the meaning of the attributes inside `totals` is the following:

        * `expectedQty`: Counts how many items are defined for a given package. It is expressed in the document's
        unit of measurement.
        * `readQty`: Counts how many serials have been read for a given package. It counts **only** the serials
        read by the **checkpoint** that created the considered purchase document. It is expressed in the
        document's unit of measurement.
        * `missingQty`: It is the sum of the differences between expected and fulfilled quantities declared in
        the source document. It is expressed in the document's unit of measurement.
        * `unexpectedQty`: It has no meaning in this context.
      type: object
      required:
        - groups
        - totals
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseDocGroupByPackageGroup"
        totals:
          $ref: "#/components/schemas/PurchaseDocAggregatedTotals"
    PurchaseDocSerialsOnlyGroup:
      type: object
      required:
        - itemInstanceId
        - lineInstanceId
      properties:
        itemInstanceId:
          description: The item instance id.
          type: string
        lineInstanceId:
          description: The line instance id.
          type: string
        epc:
          description: The EPC (Electronic Product Code) of the item instance (if RFID tag).
          type: string
        item:
          description: Related item.
          type: object
          required:
            - id
            - descr
            - code
          properties:
            id:
              description: The item id.
              type: string
            descr:
              description: The item description.
              type: string
            code:
              description: The item code.
              type: string
            brand:
              description: The item brand.
              type: string
            size:
              description: The item size.
              type: string
            color:
              description: The item color.
              type: string
        sourceDocument:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
    PurchaseDocSerialsOnly:
      description: |
        Purchase document data aggregated by serials. Each group represents a single serial.

        For the `serialsOnly` strategy, the meaning of the attributes inside `totals` is the following:

        * `expectedQty`: It has no meaning in this context.
        * `readQty`: How many serials have been read in total.
        * `missingQty`: It has no meaning in this context.
        * `unexpectedQty`: How many unexpected serials have been read in total.
      type: object
      required:
        - groups
        - totals
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseDocSerialsOnlyGroup"
        totals:
          $ref: "#/components/schemas/PurchaseDocAggregatedTotals"
    PurchaseDocAggregatedData:
      description: |
        Aggregated purchase document data. Only one of the three aggregation strategies
        (`noGrouping`, `groupByPackage`, or `serialsOnly`) will be populated in the `attributes`
        field depending on the aggregation strategy defined in the request.
      type: object
      required:
        - type
        - id
        - attributes
      properties:
        type:
          type: string
          default: "PurchaseDocAggregatedData"
        id:
          description: Unique identifier of the purchase document used for aggregation.
          type: string
        attributes:
          description: Aggregated data grouped according to the selected strategy.
          type: object
          properties:
            noGrouping:
              $ref: "#/components/schemas/PurchaseDocNoGrouping"
            groupByPackage:
              $ref: "#/components/schemas/PurchaseDocGroupByPackage"
            serialsOnly:
              $ref: "#/components/schemas/PurchaseDocSerialsOnly"
  parameters:
    PurchaseDocHeaderFiltersParameter:
      name: filter
      description: Complex filters for purchase document headers.
      in: query
      required: true
      schema:
        allOf:
          - $ref: "./documents.yaml#/components/schemas/DocWithItemsHeaderFilters"
          - type: object
            properties:
              supplier:
                description: Filter the response by supplier.
                type: string
              netAmount:
                description: Filter the response by total amount, taxes excluded.
                type: string
              packageCode:
                description: |
                  Filter the response by package code. In particular it retrieves the documents for which exists at least
                  one line that satisfies the filtering condition.
                type: string
    PurchaseDocLineFiltersParameter:
      name: filter
      description: Complex filters for purchase document line.
      in: query
      required: true
      schema:
        allOf:
          - $ref: "./documents.yaml#/components/schemas/DocWithItemsLineFilters"
          - type: object
            properties:
              difference:
                description: Filters purchase doc lines considering the difference between expected and fulfilled quantities.
                type: string
              warehouse:
                description: Filter the response by warehouse.
                type: string
              buyFromSupplier:
                description: filter the response by buy from supplier.
                type: string
    LineTemplateFiltersParameter:
      name: filter
      description: Optional filters related to line's templates.
      in: query
      style: deepObject
      required: true
      schema:
        type: object
        properties:
          entityId:
            description: Filters line's templates by entity.
            type: string
          dataAdapterTypeId:
            description: Filters line's templates by data adapter type.
            type: string
    optionalFilters:
      name: "filter"
      in: query
      description: Filter group.
      required: true
      style: deepObject
      schema:
        properties:
          warehouse:
            description: Filter the response by warehouse.
            type: string
          buyFromSupplier:
            description: Filter the response by buyFromSupplier.
            type: string
          item:
            description: Filter the response by item.
            type: string
          deliveryStatus:
            description: Filter the response by delivery status.
            type: string
    PurchaseDocHeaderId:
      name: headerId
      description: The id of a purchase document header.
      in: path
      required: true
      schema:
        type: string
paths:
  /purchase-docs/headers:
    parameters:
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: |
        Returns a list of purchase document headers.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | listPurchaseOrders |
      operationId: listPurchaseDocHeaders
      tags:
        - Purchase Document
      x-authorities: ["listPurchaseOrders"]
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - name: sort
          in: query
          description: |
            Availables sorters are:
            - `buyFromSupplier` which sorts headers by supplier.
            - `warehouse.code` which sorts headers by warehouse code.
            - `warehouse.descr` which sorts headers by warehouse description.
            - `docHeaderAttributes.docType.descr` which sorts headers by document type description.
            - `docHeaderAttributes.barcode` which sorts headers by barcode.
            - `totalAmount` which sorts headers by total amount.
            - `grossAmount` which sorts headers by gross amount.
            - `netAmount` which sorts headers by net amount.
            - `taxAmount` which sorts headers by tax amount.
            - `lastChangeTs` which sorts headers by last change timestamp.
          required: false
          style: form
          schema:
            type: string
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
        - $ref: "./documents.yaml#/components/parameters/filterDocCategoryRequired"
        - $ref: "#/components/parameters/PurchaseDocHeaderFiltersParameter"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/PurchaseDocHeaderListResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    post:
      description: Creates a purchase document header.
      operationId: createPurchaseDocHeader
      tags:
        - Purchase Document
      x-authorities: ["createPurchaseOrder"]
      requestBody:
        description: The purchase document header to post.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/PurchaseDocHeaderRequest"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/PurchaseDocHeaderResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /purchase-docs/headers/{headerId}/lines:
    parameters:
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      - $ref: "./documents.yaml#/components/parameters/headerId"
    get:
      description: |
        Returns a list of purchase document lines.
         
        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | getPurchaseOrder |
        | createPurchaseOrder |
        | updatePurchaseOrder |
      operationId: listPurchaseDocLine
      tags:
        - Purchase Document
      x-authorities: ["getPurchaseOrder", "createPurchaseOrder", "updatePurchaseOrder"]
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "#/components/parameters/PurchaseDocLineFiltersParameter"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/PurchaseDocLineListResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    post:
      description: |
        Creates a purchase document line.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | createPurchaseOrder |
        | updatePurchaseOrder |
      operationId: createPurchaseDocLines
      tags:
        - Purchase Document
      x-authorities: ["createPurchaseOrder", "updatePurchaseOrder"]
      requestBody:
        description: The purchase document line to post.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/PurchaseDocLineListRequest"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/PurchaseDocLineListResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    delete:
      description: |
        Deletes all lines (and related line instances) of the purchase document specified in the path.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | createPurchaseOrder |
        | updatePurchaseOrder |
        | deletePurchaseOrder |
      operationId: deletePurchaseDocLines
      tags:
        - Purchase Document
      x-authorities:
        - createPurchaseOrder
        - updatePurchaseOrder
        - deletePurchaseOrder
      responses:
        "204":
          description: "[Deleted](https://jsonapi.org/format/#crud-deleting-responses-204)."
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /purchase-docs/headers/{headerId}/lines/{lineId}:
    parameters:
      - $ref: "./documents.yaml#/components/parameters/headerId"
      - $ref: "./documents.yaml#/components/parameters/lineId"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: |
        Return a single line of a purchase document.
         
        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | getPurchaseOrder |
        | createPurchaseOrder |
        | updatePurchaseOrder |
      operationId: getPurchaseDocLine
      tags:
        - Purchase Document
      x-authorities: ["getPurchaseOrder", "createPurchaseOrder", "updatePurchaseOrder"]
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/PurchaseDocLineResponse"
        "404":
          description: "[Not found](https://jsonapi.org/format/#fetching-resources-responses-404)."
    patch:
      description: |
        Updates a single line of a purchase document.
         
        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | createPurchaseOrder |
        | updatePurchaseOrder |
      operationId: updatePurchaseDocLine
      tags:
        - Purchase Document
      x-authorities: ["createPurchaseOrder", "updatePurchaseOrder"]
      requestBody:
        description: The line of the purchase document to patch.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/PurchaseDocLineRequest"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/PurchaseDocLineResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    delete:
      description: |
        [Delete](https://jsonapi.org/format/#crud-deleting) a Purchase Doc Line.
         
        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | createPurchaseOrder |
        | updatePurchaseOrder |
        | deletePurchaseOrder |
      operationId: deletePurchaseDocLine
      tags:
        - Purchase Document
      x-authorities: ["createPurchaseOrder", "updatePurchaseOrder", "deletePurchaseOrder"]
      responses:
        "204":
          description: "[Deleted](https://jsonapi.org/format/#crud-deleting-responses-204)."
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /purchase-docs/lines/{lineId}/string-templates:
    parameters:
      - $ref: "./documents.yaml#/components/parameters/lineId"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: Returns the list of string templates defined for the purchase doc line specified in the path.
      operationId: listLineStringTemplates
      tags:
        - Purchase Document
      x-authorities:
        - apiUser
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
        - $ref: "#/components/parameters/LineTemplateFiltersParameter"
      responses:
        "200":
          description: List of available string templates for the line.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./core.yaml#/components/schemas/ReportTemplateEntityListResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /purchase-docs/headers/{headerId}/lines/{lineId}/loading-units:
    parameters:
      - $ref: "./documents.yaml#/components/parameters/headerId"
      - $ref: "./documents.yaml#/components/parameters/lineId"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: Returns the loading units associated to the line specified in the path.
      operationId: listLoadingUnitsForLine
      tags:
        - Purchase Document
      x-authorities:
        - apiUser
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - name: filter
          description: Optional filters to customize which loading units to retrieve.
          in: query
          required: true
          schema:
            type: object
            properties:
              s:
                type: string
                description: Text query that filters loading units by code.
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/LoadingUnitListResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    post:
      description: Deletes the loading units specified in the request body for the line in the path.
      operationId: deleteLoadingUnitsForLine
      tags:
        - Purchase Document
      x-authorities:
        - apiUser
      requestBody:
        description: A list of loading unit codes.
        required: true
        content:
          application/vnd.api+json:
            schema:
              description: The list of loading unit codes.
              type: array
              items:
                type: string
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/PurchaseDocLineResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /purchase-docs/headers/{headerId}:
    parameters:
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      - $ref: "./documents.yaml#/components/parameters/headerId"
    get:
      description: |
        Returns a single purchase document header.
         
        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | getPurchaseOrder |
        | createPurchaseOrder |
        | updatePurchaseOrder |
      operationId: getPurchaseDocHeader
      tags:
        - Purchase Document
      x-authorities: ["getPurchaseOrder", "createPurchaseOrder", "updatePurchaseOrder"]
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/PurchaseDocHeaderResponse"
        "404":
          description: "[Not found](https://jsonapi.org/format/#fetching-resources-responses-404)."
    patch:
      description: Updates a single purchase document header.
      operationId: updatePurchaseDocHeader
      tags:
        - Purchase Document
