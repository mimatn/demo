      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      - $ref: "./documents.yaml#/components/parameters/headerId"
    get:
      description: |
        Returns the data about an inbound operation registered with a purchase document. The header specified in the
        path identifies the document used to keep track of the inbound operation. This document may fulfill one or more
        source documents returned as relationships of each inbound line.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | getPurchaseOrder |
      operationId: getInboundDataForPurchaseDoc
      tags:
        - Purchase Document
      x-authorities:
        - getPurchaseOrder
      parameters:
        - name: filter
          in: query
          description: Optional filters to customize inbound data to retrieve.
          required: true
          schema:
            type: object
            properties:
              missingQty:
                description: |
                  Filters inbound data considering the missing quantity. For example if this filter is `gt:0`, will be
                  considered only those items not completely received during the inbound.
                type: string
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/PurchaseDocInboundResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    post:
      parameters:
        - name: checkpointId
          in: query
          description: The id of the checkpoint where the inbound operation is performed.
          required: true
          style: form
          schema:
            type: string
      description: |
        Performs an inbound operation for the purchase document specified in the path. The operation consists in two
        steps: (1) acquiring some RFID tags representing the inbound instances; (2) associating each instance to an
        item in the archive to compile the document in the path.

        The RFID tags considered by this endpoint are those
        read by the devices associated to the checkpoint specified as query parameter.

        This endpoint **only** returns the inbound data that have changed since the last inbound operation.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | createPurchaseOrder |
        | updatePurchaseOrder |
      operationId: doInboundForPurchaseDoc
      tags:
        - Purchase Document
      x-authorities:
        - createPurchaseOrder
        - updatePurchaseOrder
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/PurchaseDocInboundResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
