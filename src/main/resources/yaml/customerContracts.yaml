openapi: 3.0.3
info:
  title: CustomerContracts API
  version: "-"
tags:
  - name: Customer Contract
    description: |
      Commodatum customer contracts that imply an asset assignment.
components:
  parameters:
    contractId:
      name: id
      in: path
      description: The `id` of a `CustomerContract`.
      required: true
      schema:
        type: string
    customerContractFilters:
      name: "filter"
      in: query
      description: Filter group
      required: true
      style: deepObject
      schema:
        properties:
          s:
            description: Generic string filter. It refers to the contract code attribute.
            type: string
          contractCode:
            description: Filter the response by contract code.
            type: string
          customerAccount:
            description: Filter the response by customer account id.
            type: string
          contractDate:
            description: Filter the response by contract date.
            type: string
          startDate:
            description: Filter the response by start date.
            type: string
          endDate:
            description: Filter the response by end date.
            type: string
          customerContractTypeId:
            description: Filter the response by customer contract type id.
            type: string
          customerContractStatusId:
            description: Filter the response by customer contract status id.
            type: string
          customerContractCategoryId:
            description: Filter the response by customer contract category id.
            type: string
          contractAssetStartDate:
            description: Filter by the start date of the asset's assignment to the customer as specified in the contract.
            type: string
          contractAssetEndDate:
            description: Filter by the start date of the asset's assignment to the customer as specified in the contract.
            type: string
          contractAssetId:
            description: Filter the response based on the asset assigned to the customer as specified in the contract.
            type: string
  schemas:
    #
    # CustomerContract
    #
    CustomerContract:
      description: |
        A customer contract is a commodatum contract which implies an asset assignment.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "CustomerContract"
        id:
          type: string
          example: "CC.1"
        attributes:
          type: object
          required:
            - contractCode
            - customerContractType
          properties:
            contractCode:
              description: contractCode of the `CustomerContract`
              type: string
            customerContractTypeId:
              description: Type of the contract. See dictionary `CustomerContractType`.
              type: string
            contractDate:
              $ref: "./dataTypes.yaml#/components/schemas/apiDate"
            startDate:
              $ref: "./dataTypes.yaml#/components/schemas/apiDate"
            endDate:
              $ref: "./dataTypes.yaml#/components/schemas/apiDate"
            customerContractStatusId:
              description: Status of the contract. See dictionary `CustomerContractStatus`.
              type: string
            customerContractCategoryId:
              description: Category of the contract. See dictionary `CustomerContractCategory`.
              type: string
        relationships:
          description: |
            Relationships of a CustomerContract:
            * Organization: The organization which the `CustomerContract` refers to.
            * CustomerAccount: The `CustomerAccount` which the `CustomerContract` refers to.
            * Plant: The plant which the `CustomerContract` refers to.
            * TechnicalSupplier: The technical supplier which the `CustomerContract` refers to.
          type: object
          required:
            - organization
            - customerAccount
          properties:
            organization:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            customerAccount:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
            plant:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            technicalSupplier:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
    #
    # CustomerContractAssetRelationships
    #
    CustomerContractAssetRelationships:
      description: Relationships of a CustomerContractAsset
      type: object
      required:
        - customerContract
        - asset
      properties:
        customerContract:
          $ref: "./jsonapi.yaml#/components/schemas/relToOne"
        asset:
          $ref: "./jsonapi.yaml#/components/schemas/relToOne"
    #
    # CustomerContractAssetIncluded
    #
    CustomerContractAssetIncluded:
      description: A `CustomerContractAsset` related schemas.
      type: array
      items:
        type: object
      uniqueItems: true
    #
    # CustomerContractAsset
    #
    CustomerContractAsset:
      description: A `CustomerContractAsset`
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "CustomerContractAsset"
        id:
          type: string
        attributes:
          type: object
          properties:
            startDate:
              $ref: "./dataTypes.yaml#/components/schemas/apiDate"
            endDate:
              $ref: "./dataTypes.yaml#/components/schemas/apiDate"
        relationships:
          $ref: "#/components/schemas/CustomerContractAssetRelationships"
    #
    # CustomerContractAssetResponse
    #
    CustomerContractAssetsResponse:
      type: object
      required:
        - data
      properties:
        data:
          description: The list of `CustomerContractAsset`.
          type: array
          items:
            $ref: "#/components/schemas/CustomerContractAsset"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/CustomerContractAssetIncluded"
    CustomerContractIncluded:
      description: Related organization, customer account and plant.
      type: array
      items:
        type: object
      uniqueItems: true
    #
    # CustomerContractResponse
    #
    CustomerContractResponse:
      description: An object that contains a single `CustomerContract`.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/CustomerContract"
        include:
          $ref: "#/components/schemas/CustomerContractIncluded"
    CustomerContractListResponse:
      description: An object that contains a list of `CustomerContract`.
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CustomerContract"
            description: The list of `CustomerContract`.
            example: []
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        include:
          $ref: "#/components/schemas/CustomerContractIncluded"
paths:
  /customer-contracts:
    get:
      description: |
        Returns a list of `CustomerContract` objects.

        To access the service you need at least one of the following permissions:
        |  Permission (one of)  | 
        |-----------------------|
        | listCustomerContracts |
      operationId: listCustomerContracts
      tags:
        - Customer Contract
      x-authorities: ["listCustomerContracts"]
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
        - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
        - $ref: "#/components/parameters/customerContractFilters"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CustomerContractListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /customer-contracts/{id}:
    parameters:
      - $ref: "#/components/parameters/contractId"
    get:
      description: |
        Get a `CustomerContract` by its `id`.

        To access the service you need at least one of the following permissions:
        |  Permission (one of) | 
        |----------------------|
        | getCustomerContract  |
      summary: getCustomerContract
      operationId: getCustomerContract
      tags:
        - Customer Contract
      x-authorities: ["getCustomerContract"]
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CustomerContractResponse"
        "404":
          description: "[Not found](https://jsonapi.org/format/#fetching-resources-responses-404)"
  /customer-contracts/assets:
    get:
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
        - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
        - name: "filter"
          in: query
          description: Filter group
          required: true
          style: deepObject
          schema:
            properties:
              customerContractId:
                description: Filter the response by customer contract id.
                type: string
              asset:
                description: Filter the response by asset id.
                type: string
              itemCategory:
                description: Filter the response by item category.
                type: string
      description: |
        Returns the Customer Contracts Assets relevant to the given `ItemInstance`.

        To access the service you need at least one of the following permissions:
        |  Permission (one of) | 
        |----------------------|
        | getCustomerContract  |
      operationId: listCustomerContractsAssets
      tags:
        - Customer Contract
      x-authorities: ["getCustomerContract"]
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./customerContracts.yaml#/components/schemas/CustomerContractAssetsResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /customer-contracts/export:
    post:
      description: |
        Request an export of a list of customer contracts.

        To access the service you need at least one of the following permissions:
        |   Permission (one of)   |
        |-------------------------|
        | exportCustomerContracts |
      operationId: exportCustomerContracts
      summary: exportCustomerContracts
      tags:
        - Customer Contract
      x-authorities: ["exportCustomerContracts"]
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
        - $ref: "./core.yaml#/components/parameters/utcOffset"
        - $ref: "./core.yaml#/components/parameters/templateIdParamRequired"
        - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
        - $ref: "#/components/parameters/customerContractFilters"
      responses:
        "202":
          description: Data export request accepted
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/info"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
