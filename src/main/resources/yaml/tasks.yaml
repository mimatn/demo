openapi: 3.0.3
info:
  title: Task API
  version: "-"
tags:
  - name: Task
    description: APIs for Tasks
  - name: Calendar
    description: APIs for Calendars
components:
  schemas:
    TaskPriorityId:
      description: A task must have a priority. See dictionary `TaskPriority`.
      type: string
      enum:
        - TaskPriority.Low
        - TaskPriority.Medium
        - TaskPriority.High
        - TaskPriority.Critical
    AssigneeType:
      description: The assignee type of a task.
      type: string
      enum:
        - Party
        - Manager
    Task:
      description: Task resource.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "Task"
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/TaskAttributes"
        relationships:
          $ref: "#/components/schemas/TaskRelationships"
    TaskAttributes:
      description: Task attributes.
      type: object
      required:
        - code
        - title
        - descr
        - taskPriorityId
      properties:
        code:
          description: Code of the task.
          type: string
        title:
          description: Title of the task.
          type: string
        descr:
          description: General description of the task.
          type: string
        taskPriorityId:
          $ref: "#/components/schemas/TaskPriorityId"
        dueDate:
          $ref: "./dataTypes.yaml#/components/schemas/apiDate"
        creationTs:
          $ref: "./dataTypes.yaml#/components/schemas/apiDateTime"
        taskActions:
          description: List of available actions for the given task.
          type: array
          items:
            $ref: "#/components/schemas/TaskAction"
    TaskRelationships:
      type: object
      description: The relationships of a Task.
      required:
        - organization
        - taskType
        - reporterParty
      properties:
        taskType:
          $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
        reporterParty:
          $ref: "./jsonapi.yaml#/components/schemas/relToOneParty"
        assigneeParty:
          $ref: "./jsonapi.yaml#/components/schemas/relToOneParty"
        subjectParty:
          $ref: "./jsonapi.yaml#/components/schemas/relToOneParty"
        organization:
          $ref: "./jsonapi.yaml#/components/schemas/relToOne"
        taskOutcome:
          $ref: "./jsonapi.yaml#/components/schemas/relToOne"
        relatedCalendarEvents:
          $ref: "./jsonapi.yaml#/components/schemas/relToMany"
    TaskIncluded:
      description: Related entities of a task.
      type: array
      items:
        type: object
      uniqueItems: true
    TaskListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: List of Tasks
          type: array
          items:
            $ref: "#/components/schemas/Task"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/TaskIncluded"
    TaskResponse:
      description: Single Task response.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Task"
        included:
          $ref: "#/components/schemas/TaskIncluded"
    TaskRequest:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Task"
    TaskAction:
      description: TaskAction resource.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "TaskAction"
        id:
          type: string
        attributes:
          type: object
          required:
            - sequenceNumber
            - mandatory
          properties:
            sequenceNum:
              description: Sequence number.
              type: integer
              minimum: 0
            mandatory:
              description: True if this action is mandatory in order to complete the task.
              type: boolean
              default: false
        relationships:
          type: object
          description: The relationships of a TaskAction.
          required:
            - task
            - docType
          properties:
            task:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            docType:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
            docHeader:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            taskOutcome:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            surveyDocTemplate:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
    TaskActionIncluded:
      description: Related entities of a task action.
      type: array
      items:
        type: object
      uniqueItems: true
    TaskActionListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: List of Task actions.
          type: array
          items:
            $ref: "#/components/schemas/TaskAction"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/TaskActionIncluded"
    TaskActionResponse:
      description: Single Task action response.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/TaskAction"
        included:
          $ref: "#/components/schemas/TaskActionIncluded"
    TaskActionRequest:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/TaskAction"
    TaskOutcome:
      description: TaskOutcome resource.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "TaskOutcome"
        id:
          type: string
        attributes:
          type: object
          required:
            - code
            - descr
            - sequenceNum
            - taskCompleted
          properties:
            code:
              description: General task code/name.
              type: string
            description:
              description: General task description.
              type: string
            sequenceNum:
              description: Sequence number.
              type: integer
              minimum: 0
            taskCompleted:
              description: True if the outcome completes the task.
              type: boolean
              default: false
            textColor:
              description: RGB/RGBA color format for the task outcome.
              type: string
              example: "#CE00A"
        relationships:
          type: object
          description: The task type associated to this task outcome.
          required:
            - taskType
          properties:
            taskType:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
    TaskOutcomeIncluded:
      description: Related entities of a task outcome.
      type: array
      items:
        $ref: "#/components/schemas/TaskType"
      uniqueItems: true
    TaskOutcomeListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: List of Task outcomes
          type: array
          items:
            $ref: "#/components/schemas/TaskOutcome"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/TaskOutcomeIncluded"
    TaskType:
      description: Task type. Determines the subject of the task (i.e. CustomerAccount, Supplier, Store etc...).
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: TaskType
        id:
          type: string
        attributes:
          required:
            - descr
            - sequenceNum
            - subjectEntityId
          properties:
            code:
              description: Task type generic code/name.
              type: string
            descr:
              description: Task type description.
              type: string
            sequenceNum:
              description: Sequence number.
              type: integer
              minimum: 0
              default: 0
            textColor:
              description: A string that defines the text color of the text displayed.
              type: string
              example: "#000000"
            subjectEntityId:
              description: The subject of the task (i.e. CustomerAccount, Supplier,  Store etc...).
              type: string
              default: CustomerAccount
              example: Store
        relationships:
          type: object
          description: A task type can be related to an organization.
          properties:
            organization:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
    TaskTypeIncluded:
      description: Task type relationships.
      type: array
      items:
        $ref: "./core.yaml#/components/schemas/Organization"
      uniqueItems: true
    TaskTypeListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: List of Task types.
          type: array
          items:
            $ref: "#/components/schemas/TaskType"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/TaskTypeIncluded"
    Calendar:
      description: Calendar resource.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "Calendar"
        id:
          type: string
        attributes:
          type: object
          required:
            - descr
            - sequenceNum
          properties:
            code:
              description: Calendar code.
              type: string
            descr:
              description: Calendar description.
              type: string
            sequenceNum:
              description: Sequence number.
              type: integer
              minimum: 0
        relationships:
          type: object
          description: |
            A calendar is owned by a user.
          required:
            - userProfile
          properties:
            userProfile:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
    CalendarIncluded:
      description: Calendar's owner.
      type: array
      items:
        $ref: "./core.yaml#/components/schemas/UserProfile"
      uniqueItems: true
    CalendarListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: List of User's calendars.
          type: array
          items:
            $ref: "#/components/schemas/Calendar"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/CalendarIncluded"
    CalendarResponse:
      description: Single Calendar response.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Calendar"
        included:
          $ref: "#/components/schemas/CalendarIncluded"
    CalendarRequest:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Calendar"
    CalendarEvent:
      description: CalendarEvent resource.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "CalendarEvent"
        id:
          type: string
        attributes:
          type: object
          required:
            - title
            - descr
            - calendarEventTypeId
            - startTs
            - endTs
            - allDay
            - recurrenceTypeId
            - sendNotifications
          properties:
            code:
              description: CalendarEvent code.
              type: string
            title:
              description: CalendarEvent title.
              type: string
            descr:
              description: CalendarEvent description.
              type: string
            calendarEventTypeId:
              description: CalendarEvent type. See dictionary `CalendarEventType`.
              type: string
            startTs:
              $ref: "./dataTypes.yaml#/components/schemas/apiDateTime"
            endTs:
              $ref: "./dataTypes.yaml#/components/schemas/apiDateTime"
            allDay:
              description: Create an all-day event.
              type: boolean
              default: false
            recurrenceTypeId:
              $ref: "./core.yaml#/components/schemas/RecurrenceType"
            recurrenceFrequency:
              description: Number of days, weeks, months or years from an occurrence and another.
              type: integer
              minimum: 1
            recurrenceEndDate:
              $ref: "./dataTypes.yaml#/components/schemas/apiDate"
            attendeesCount:
              description: |
                **DEPRECATED**: this attribute is deprecated and will be removed in future versions. 
                Use `relationships.attendees.meta.recordCount` instead.

                Number of attendees in the event.
              type: integer
              minimum: 0
              readOnly: true
            asOrganizer:
              description: It is `true` if the calling user is the organizer, `false` if it is an attendee.
              type: boolean
              default: true
              readOnly: true
            sendNotifications:
              description: Send notifications to the attendees.
              type: boolean
              default: true
        relationships:
          type: object
          description: Relationships of a calendar event.
          required:
            - calendar
          properties:
            calendar:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
              description: |
                If `asOrganizer` is `true`, this value matches the `calendarId` specified in the path parameter.
                If `asOrganizer` is `false`, this value represents the `calendarId` of the invited calendar.
            task:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            parentCalendarEvent:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            locationParty:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneParty"
            attendees:
              $ref: "./jsonapi.yaml#/components/schemas/relToManyParties"
            creatorUserProfile:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneParty"
    CalendarEventIncluded:
      description: CalendarEvent relationships.
      type: array
      items:
        type: object
      uniqueItems: true
    CalendarEventListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: List of Calendar events.
          type: array
          items:
            $ref: "#/components/schemas/CalendarEvent"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/CalendarEventIncluded"
    CalendarEventResponse:
      description: Single Calendar event response.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/CalendarEvent"
        included:
          $ref: "#/components/schemas/CalendarEventIncluded"
    CalendarEventRequest:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/CalendarEvent"
    CalendarEventAttendee:
      description: |
        CalendarEventAttendee resource. Attendees in a calendar event must be users with an active profile in .one 
        and have at least one calendar.
      type: object
      required:
        - type
        - id
        - relationships
      properties:
        type:
          type: string
          default: "CalendarEventAttendee"
        id:
          type: string
        attributes:
          type: object
          readOnly: true
          properties:
            sequenceNum:
              description: Sequence number of the attendee in the event.
              type: integer
              readOnly: true
              minimum: 0
        relationships:
          type: object
          description: Relationships of a calendar event attendee.
          required:
            - attendeeCalendar
          properties:
            attendeeCalendar:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
            userProfile:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMetaReadOnly"
    CalendarEventAttendeeIncluded:
      description: CalendarEventAttendee relationships.
      type: array
      items:
        type: object
      uniqueItems: true
    CalendarEventAttendeeListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: List of all attendees in a calendar event.
          type: array
          items:
            $ref: "#/components/schemas/CalendarEventAttendee"
        included:
          $ref: "#/components/schemas/CalendarEventIncluded"
    CalendarEventAttendeesRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CalendarEventAttendee"
    Calendars:
      type: object
      properties:
        calendars:
          type: array
          items:
            type: string
            description: Calendar id to invite to the event.
          uniqueItems: true
  parameters:
    id:
      name: id
      in: path
      description: The task id
      required: true
      schema:
        type: string
    userId:
      name: id
      in: path
      description: UserProfile id
      required: true
      schema:
        type: string
    kpiId:
      name: kpiId
      in: path
      description: The KPI id
      required: true
      schema:
        type: string
    taskFilters:
      name: "filter"
      in: query
      description: Filter group.
      required: true
      style: deepObject
      schema:
        properties:
          s:
            description: Search the given string; searches inside some attributes, as specified in the API documentation, e.g. descr, code, etc.
            type: string
          assigneeParty:
            description: Filter the response by assignee.
            type: string
          reporterParty:
            description: Filter the response by reporter.
            type: string
          taskType:
            description: Filter the response by task type.
            type: string
          dueDate:
            description: Filter the response by task due date.
            type: string
          subjectParty:
            description: Filter the response by subject.
            type: string
          taskOutcome:
            description: Filter the response by task outcome.
            type: string
          taskCompleted:
            description: Filter the response by task completion status.
            type: string
          organization:
            description: Filter the response by organization.
            type: string
paths:
  /tasks:
    get:
      description: |
        Returns a list of tasks.
         
        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | listTasks |
      operationId: listTasks
      tags:
        - Task
      x-authorities: ["listTasks"]
      parameters:
        - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
        - $ref: "#/components/parameters/taskFilters"
      responses:
        "200":
          description: Tasks list response
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    post:
      description: |
        Create a new task.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | createTask |
      operationId: createTask
      tags:
        - Task
      x-authorities: ["createTask"]
      requestBody:
        description: Task to post.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/TaskRequest"
      responses:
        "201":
          description: "[Created](https://jsonapi.org/format/#crud-creating-responses-201)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /tasks/outcomes:
    get:
      description: This service should not be implemented. It is defined for code generation purposes.
      operationId: listTaskOutcomes
      tags:
        - Task
      x-authorities:
        - apiUser
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
        - name: filter
          in: query
          required: true
          style: deepObject
          schema:
            type: object
            properties:
              s:
                description: Search the given string in task outcome and task type descr and code attributes.
                type: string
              taskType:
                description: Filter the response by task type.
                type: string
      responses:
        "200":
          description: TaskOutcomes list response
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/TaskOutcomeListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /tasks/types:
    get:
      summary: listTaskTypes
      description: |
        Returns a list of task types.
         
        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | listTasks |
      operationId: listTaskTypes
      tags:
        - Task
      x-authorities: ["listTasks"]
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
        - name: "filter"
          in: query
          description: Filter group
          required: true
          style: deepObject
          schema:
            type: object
            properties:
              s:
                description: Search the given string in descr and code attributes.
                type: string
              subjectEntityId:
                description: Filter the response by subject entity id.
                type: string
              organizationId:
                description: Filter the response by organization id.
                type: string
      responses:
        "200":
          description: Task types list response.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/TaskTypeListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: |
        Return a single task.
         
        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | getTask |
      operationId: getTask
      tags:
        - Task
      x-authorities: ["getTask"]
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "404":
          description: "[Not found](https://jsonapi.org/format/#fetching-resources-responses-404)."
    patch:
      description: |
        [Update](https://jsonapi.org/format/#crud-updating) a Task.
         
        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | updateTask |
      operationId: updateTask
      tags:
        - Task
      x-authorities: ["updateTask"]
      requestBody:
        description: Task to patch
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/TaskRequest"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#crud-updating-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    delete:
      description: |
        [Delete](https://jsonapi.org/format/#crud-deleting) a Task.
         
        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | deleteTask |
      operationId: deleteTask
      tags:
        - Task
      x-authorities: ["deleteTask"]
      responses:
        "204":
          description: "[Deleted](https://jsonapi.org/format/#crud-deleting-responses-204)."
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /tasks/{id}/actions:
    parameters:
      - $ref: "#/components/parameters/id"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: |
        Returns a list of the task's actions.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | getTask |
      operationId: listTaskActions
      tags:
        - Task
      x-authorities: ["getTask"]
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      responses:
        "200":
          description: Task actions list response.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/TaskActionListResponse"
