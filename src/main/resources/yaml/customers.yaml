            application/vnd.api+json:
              schema:
                $ref: "./core.yaml#/components/schemas/KPIEntityListResponse"
        "404":
          description: "[Not found](https://jsonapi.org/format/#fetching-resources-responses-404)"
  /customer-accounts/{id}/clusters:
    parameters:
      - $ref: "./jsonapi.yaml#/components/parameters/include"
      - name: id
        in: path
        description: The CustomerAccount id
        required: true
        schema:
          $ref: "./jsonapi.yaml#/components/schemas/id"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: Get all Clusters defined for this CustomerAccount
      operationId: listCustomerAccountClusters
      tags:
        - Customer
      x-authorities:
        - apiUser
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./clusters.yaml#/components/schemas/ClusterListResponse"
        "404":
          description: "[Not found](https://jsonapi.org/format/#fetching-resources-responses-404)"
  /customer-accounts/sheets:
    get:
      description: Returns a collection of FormSheets, which depend on the customerTypeId
      operationId: listCustomerAccountSheets
      tags:
        - Customer
      x-authorities:
        - apiUser
      parameters:
        - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
        - $ref: "./entityAttributes.yaml#/components/parameters/appIdFilter"
        - name: "filter[customerTypeId]"
          in: query
          description: Filter the response by customer type id.
          required: true
          style: form
          schema:
            type: string
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      responses:
        "200":
          description: Sheet list response
          content:
            application/vnd.api+json:
              schema:
                $ref: "./entityAttributes.yaml#/components/schemas/EntitySheetListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /customer-accounts/{id}/edit:
    parameters:
      - name: id
        in: path
        description: The CustomerAccount id
        required: true
        schema:
          type: string
      - name: customerTypeId
        in: query
        description: The customer type id.
        required: false
        schema:
          type: string
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    post:
      description: |
        Edit a Customer Account.

        To access the service you need at least one of the following permissions:
        | Permission (one of)   |
        |:---------------------:|
        | updateCustomerAccount |
      operationId: editCustomerAccount
      x-authorities:
        - updateCustomerAccount
      tags:
        - Customer
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CustomerAccountResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /customer-accounts/{id}/publish:
    parameters:
      - name: id
        in: path
        description: The CustomerAccount id
        required: true
        schema:
          type: string
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    post:
      description: Publish a Customer Account
      operationId: publishCustomerAccount
      tags:
        - Customer
      x-authorities:
        - apiUser
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CustomerAccountResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /customer-accounts/tags:
    patch:
      description: |
        Tag a set of up to 1000 customer accounts.

        To access the service you need at least one of the following permissions:
        |       Permission (one of)      | 
        |:------------------------------:|
        |   replaceCustomerAccountTags   |
      operationId: manageCustomerAccountTags
      tags:
        - Customer
      x-authorities: ["replaceCustomerAccountTags"]
      parameters:
        - $ref: "./core.yaml#/components/parameters/LinkedUserProfileId"
        - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
        - $ref: "#/components/parameters/customerAccountFilters"
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      requestBody:
        description: List of tags that are going to replace entirely the existing associations.
        required: true
        content:
          application/vnd.api+json:
            schema:
              allOf:
                - $ref: "./core.yaml#/components/schemas/Tags"
                - description: Tags can be added, replaced or removed.
                  type: object
                  properties:
                    action:
                      $ref: "./core.yaml#/components/schemas/TagsOperation"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./core.yaml#/components/schemas/Tags"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /customer-accounts/tasks:
    post:
      description: |
        Create a task for each customer that satisfies the provided filters and associate the task to them.
      operationId: createTaskForCustomerAccounts
      tags:
        - Customer
      x-authorities:
        - apiUser
      parameters:
        - $ref: "./core.yaml#/components/parameters/LinkedUserProfileId"
        - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
        - $ref: "#/components/parameters/customerAccountFilters"
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      requestBody:
        description: The new task to create
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/CustomerTaskRequest"
      responses:
        "202":
          description: "[Accepted](https://jsonapi.org/format/#crud-updating-responses-202)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/info"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /customer-accounts/{customerAccountId}/tags:
    parameters:
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      - $ref: "#/components/parameters/customerAccountId"
    patch:
      description: |
        Replace the tags associated to the given customer account id.

        To access the service you need at least one of the following permissions:
        |    Permission (one of)     | 
        |:--------------------------:|
        | replaceCustomerAccountTags |
      operationId: replaceCustomerAccountTags
      tags:
        - Customer
      x-authorities: ["replaceCustomerAccountTags"]
      requestBody:
        description: List of tags that are going to replace entirely the existing associations.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "./core.yaml#/components/schemas/Tags"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./core.yaml#/components/schemas/Tags"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /customer-accounts/{customerAccountId}/tags/{tagId}:
    parameters:
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      - $ref: "#/components/parameters/customerAccountId"
      - $ref: "./core.yaml#/components/parameters/tagId"
    post:
      description: |
        Links the tag identified by `tagId` to the customer account identified by `customerAccountId`.

        To access the service you need at least one of the following permissions:
        |   Permission (one of)   | 
        |:-----------------------:|
        |    linkTagToCustomer    |
        |   replaceCustomerTags   |
      operationId: linkTagToCustomerAccount
      tags:
        - Customer
      x-authorities: ["linkTagToCustomer", "replaceCustomerTags"]
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    delete:
      description: |
        Unlinks the tag `tagId` from the customer account `customerAccountId`.

        To access the service you need at least one of the following permissions:
        |    Permission (one of)    | 
        |:-------------------------:|
        |   unlinkTagFromCustomer   |
        |    replaceCustomerTags    |
      operationId: unlinkTagFromCustomerAccount
      tags:
        - Customer
      x-authorities: ["unlinkTagFromCustomer", "replaceCustomerTags"]
      responses:
        "204":
          description: "[Deleted](https://jsonapi.org/format/#crud-deleting-responses-204)."
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /customer-accounts/bulk-update/data-upload:
    parameters:
      - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
      - name: filter[appId]
        in: query
        description: The app id
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/customerTypeId"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    post:
      description: |
        Uploads an Excel file used for customers bulk update. 
        The response will contain all Excel columns (but the one referring to customers' id) 
        and all the customers' attributes available for bulk update
      operationId: uploadExcelForBulkUpdate
      tags:
        - Customer
      x-authorities:
        - apiUser
      requestBody:
        required: true
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
          application/vnd.ms-excel:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: |
            The response contains two lists.
            One list refers to the attributes to be mapped, the other refers to the attributes available for mapping.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./core.yaml#/components/schemas/BulkUpdateDataImportInfoResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /customer-accounts/bulk-update:
    parameters:
      - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
      - $ref: "#/components/parameters/customerTypeId"
      - $ref: "#/components/parameters/digitalContentId"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    post:
      description: |
        Updates a set of customer accounts based on the Excel file identified by digitalContentId 
        and previously uploaded using `uploadExcelForBulkUpdate` service.
      operationId: bulkUpdate
      tags:
        - Customer
      x-authorities:
        - apiUser
      requestBody:
        description: Excel import attributes mapping
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "./core.yaml#/components/schemas/BulkUpdateDataRequest"
      responses:
        "202":
          description: "[Accepted](https://jsonapi.org/format/#crud-updating-responses-202)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/info"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /customers/types:
    parameters:
      - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: Returns a list of customer types that can be used to create the customer account.
      operationId: listEligibleCustomerTypesForCreate
      tags:
        - Customer
      x-authorities:
        - apiUser
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/EligibleCustomerTypeListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /customers/types/{customerTypeId}:
    parameters:
      - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
      - name: customerTypeId
        in: path
        description: The customer type id
        required: true
        schema:
          type: string
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: Returns a list of customer types that can be used to modify the customer's type.
      operationId: listEligibleCustomerTypesForUpdate
      tags:
        - Customer
      x-authorities:
        - apiUser
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./core.yaml#/components/schemas/SimpleEntityListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /customer-accounts/{id}/history:
    parameters:
      - name: id
        in: path
        description: The CustomerAccount id
        required: true
        schema:
          $ref: "./jsonapi.yaml#/components/schemas/id"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: |
        Retrieves the customer accounts related to a specified customer account, including their status (ACTIVE or 
        INACTIVE).

        If the customer is **ACTIVE**: Returns a list of all previous customer accounts (ancestors) that reference this 
        account as their successor.

        If the customer is **INACTIVE**: Returns a single record pointing to the active successor account that inherited 
        this customer account.
      operationId: getCustomerAccountHistory
      tags:
        - Customer
      x-authorities:
        - apiUser
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CustomerAccountHistoryListResponse"
        "404":
          description: "[Not found](https://jsonapi.org/format/#fetching-resources-responses-404)"
  /customer-accounts/{customerAccountId}/sales-order-eligibility:
    parameters:
      - name: customerAccountId
        in: path
        required: true
        schema:
          type: string
        description: The CustomerAccount id
      - name: x-Marketplace
        in: header
        required: false
        schema:
          type: string
        description: Marketplace context (optional)
      - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
      - name: "filter[appId]"
        in: query
        description: Filter the response by application. The user must be enabled for the application in the filter.
        required: true
        style: form
        schema:
          type: string
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      operationId: getSalesOrderEligibility
      description: |
        Checks if the customer can place a sales order and returns eligible document types, billing customer, and 
        authorizations.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | createSalesOrder |
        | updateSalesOrder |
      tags:
        - Customer
      x-authorities:
        - createSalesOrder
        - updateSalesOrder
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/SalesOrderEligibilityResponse"
        "404":
          description: "[Not found](https://jsonapi.org/format/#fetching-resources-responses-404)."
  /customers/{id}/calendar-events:
    get:
      description: |
        Returns a paginated list of events for the given customer.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | listCalendars |
      operationId: listCustomerCalendarEvents
      tags:
        - Customer
      x-authorities:
        - listCalendars
      parameters:
        - name: id
          in: path
          description: The Customer id
          required: true
          schema:
            type: string
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
        - name: "filter"
          in: query
          description: Filter group
          required: true
          style: deepObject
          schema:
            type: object
            properties:
              startDate:
                type: string
                description: Filter events by start date.
              endDate:
                type: string
                description: Filter events by end date.
              mineOnly:
                type: string
                description: Filter events assigned to the current user only.
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      responses:
        "200":
          description: Customer event list response
          content:
            application/vnd.api+json:
              schema:
                $ref: "./tasks.yaml#/components/schemas/CalendarEventListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
