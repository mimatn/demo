openapi: 3.0.3
info:
  title: API for Communications
  version: "-"
  description: API specification for communications.
tags:
  - name: Communication
    description: Operations related to communications.
components:
  schemas:
    BodyContentType:
      description: |
        Indicates the type of content that can be specified in the body of a communication. See dictionary 
        `BodyContentType`.
      type: string
      enum:
        - BodyContentType.None
        - BodyContentType.PlainText
        - BodyContentType.HTMLText
        - BodyContentType.RichHTML
    AudienceType:
      description: |
        Enumeration of audience types for communications. Defines whether the communication is intended for 
        customers or sales representatives. See dictionary `AudienceType`.
      type: string
      enum:
        - AudienceType.Customer
        - AudienceType.SalesRep
    CommunicationActionType:
      description: |
        Defines the type of action associated with a communication, such as linking to a certain URL or downloading 
        some content. See dictionary `CommunicationActionType`.
      type: string
      enum:
        - CommunicationActionType.ExternalURL
        - CommunicationActionType.InternalURL
        - CommunicationActionType.DownloadExternalContent
        - CommunicationActionType.DownloadDigitalContent
    CommunicationType:
      description: A communication entity in the context.
      type: object
      required:
        - type
        - id
        - attributes
      properties:
        type:
          type: string
          default: "CommunicationType"
        id:
          type: string
          description: Unique identifier for the communication.
        attributes:
          type: object
          required:
            - descr
            - hasContentBlock
            - hasMainImage
            - bodyContentTypeId
            - maxActionCount
            - hasAudienceCondition
            - hasAttachments
          properties:
            descr:
              type: string
              description: Description of the communication.
            hasContentBlock:
              type: boolean
              description: Indicates if there is a content block.
            hasMainImage:
              type: boolean
              description: Indicates if there is a main image.
            bodyContentTypeId:
              $ref: "#/components/schemas/BodyContentType"
            maxActionCount:
              type: integer
              description: Maximum number of actions allowed.
            audienceTypeId:
              $ref: "#/components/schemas/AudienceType"
            hasAudienceCondition:
              type: boolean
              description: Indicates if there is an audience condition.
            hasAttachments:
              type: boolean
              description: Indicates if there are attachments.
    CommunicationTypeListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CommunicationType"
    CommunicationAction:
      description: Represent the call to action within a communication.
      type: object
      required:
        - type
        - id
        - attributes
      properties:
        type:
          type: string
          default: "CommunicationAction"
        id:
          type: string
          description: Unique identifier for the communication type.
        attributes:
          type: object
          required:
            - sequenceNum
            - communicationActionTypeId
            - actionValue
          properties:
            sequenceNum:
              type: integer
              description: The sequence number of the action. Determines the order of actions.
              minimum: 0
            actionTypeId:
              $ref: "#/components/schemas/CommunicationActionType"
            actionValue:
              type: string
              description: The value associated with the action (e.g., URL).
    CommunicationActionResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CommunicationAction"
    Communication:
      description: A communication instance.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "Communication"
        id:
          type: string
          description: Unique identifier for the communication type.
        attributes:
          type: object
          required:
            - descr
            - processingStatusId
            - sequenceNum
            - startDate
            - endDate
          properties:
            descr:
              type: string
              description: Description of the communication.
            processingStatusId:
              $ref: "./core.yaml#/components/schemas/ProcessingStatus"
            mainImageId:
              description: The digital content id representing the main image for this item.
              type: string
              readOnly: true
            renditionUrl:
              type: string
              description: |
                URL to access the rendition of the main image. It will be null if no rendition type provided 
                in the request (parameter `renditionTypeId`) or if the communication does not have a digital content 
                associated.
              readOnly: true
            title:
              type: string
              description: Title of the communication.
            body:
              type: string
              description: Body content of the communication.
            sequenceNum:
              type: integer
              description: Sequence number for ordering communications.
              minimum: 0
            startDate:
              type: string
              format: date
              description: Start date for the communication. Uses ISO 8601 format `YYYY-MM-DD`.
              example: "2025-11-25"
            endDate:
              type: string
              format: date
              description: End date for the communication. Uses ISO 8601 format `YYYY-MM-DD`.
              example: "2025-11-25"
            audienceCondition:
              type: string
              description: |
                Depending on the type of audience, the condition allows you to specify criteria to restrict visibility. 
                It is a JSON object stored as a string.
                For example, to target specific customer clusters.
              example: |
                ```
                {
                    "condition": {
                      "customerCluster" : ["C.1", "C.2"]
                    }
                }
                ```
            communicationContentBlockId:
              description: The content block id associated with this communication.
              type: string
            isDraft:
              description: True if this is a draft, false otherwise (published entity).
              type: boolean
              readOnly: true
            referenceEntityObjectId:
              description: |
                If the communication is published it represents its draft (if any), otherwise it represents the ID of 
                the published communication.
                It is `null` if the current entity is a new communication yet to be published.
              type: string
              readOnly: true
        relationships:
          type: object
          required:
            - marketplace
            - communicationType
          properties:
            marketplace:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            communicationType:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            actions:
              $ref: "./jsonapi.yaml#/components/schemas/relToManyReadOnly"
            currentDraftUserProfile:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneParty"
            draftOwnerUserProfile:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneParty"
    CommunicationIncluded:
      description: Related entities.
      type: array
      items:
        type: object
      uniqueItems: true
    CommunicationListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: List of Communications.
          type: array
          items:
            $ref: "#/components/schemas/Communication"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/CommunicationIncluded"
    CommunicationResponse:
      description: Response containing a single communication.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Communication"
        included:
          $ref: "#/components/schemas/CommunicationIncluded"
    CommunicationLite:
      description: |
        A lightweight version of a communication instance. Used for creating communications with minimal data.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "CommunicationLite"
        id:
          type: string
          description: Unique identifier for the communication.
        attributes:
          type: object
          required:
            - descr
            - title
          properties:
            descr:
              type: string
              description: Description of the communication.
            title:
              type: string
              description: Title of the communication.
            startDate:
              type: string
              format: date
              description: Start date for the communication. Uses ISO 8601 format `YYYY-MM-DD`.
              example: "2025-11-25"
            endDate:
              type: string
              format: date
              description: End date for the communication. Uses ISO 8601 format `YYYY-MM-DD`.
              example: "2025-11-25"
        relationships:
          type: object
          required:
            - marketplace
            - communicationType
          properties:
            marketplace:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            communicationType:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
    CommunicationLiteRequest:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/CommunicationLite"
    CommunicationUpdate:
      description: |
        A lightweight version of a communication instance for update operations. Used for updating communications with 
        editable fields.
      type: object
      required:
        - type
        - id
        - attributes
      properties:
        type:
          type: string
          default: "CommunicationUpdate"
        id:
          type: string
          description: Unique identifier for the communication.
        attributes:
          type: object
          required:
            - descr
            - title
            - body
            - sequenceNum
            - startDate
            - endDate
            - communicationContentBlockId
          properties:
            descr:
              type: string
              description: Description of the communication.
            title:
              type: string
              description: Title of the communication.
            body:
              type: string
              description: Body content of the communication.
            sequenceNum:
              type: integer
              description: Sequence number for ordering communications.
              minimum: 0
            startDate:
              type: string
              format: date
              description: Start date for the communication. Uses ISO 8601 format `YYYY-MM-DD`.
              example: "2026-01-09"
            endDate:
              type: string
              format: date
              description: End date for the communication. Uses ISO 8601 format `YYYY-MM-DD`.
              example: "2026-02-01"
            communicationContentBlockId:
              description: The content block id associated with this communication.
              type: string
            mainImageId:
              description: The digital content id representing the main image for this item.
              type: string
            audienceCondition:
              type: string
              description: |
                Depending on the type of audience, the condition allows you to specify criteria to restrict visibility. 
                It is a JSON object stored as a string.
                For example, to target specific customer clusters.
              example: |
                ```
                {
                    "condition": {
                      "customerCluster" : ["C.1", "C.2"]
                    }
                }
                ```
            actions:
              type: array
              description: |
                List of actions associated with the communication. The order of actions is determined by the order in
                this array.

                If this is null there will be no changes to the existing actions, otherwise the existing actions will 
                be replaced by the ones provided in this array.
              items:
                type: object
                required:
                  - actionTypeId
                  - actionValue
                properties:
                  actionTypeId:
                    $ref: "#/components/schemas/CommunicationActionType"
                  actionValue:
                    type: string
                    description: The value associated with the action (e.g., URL).
    CommunicationUpdateRequest:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/CommunicationUpdate"
  parameters:
    id:
      name: id
      in: path
      description: The communication id
      required: true
      schema:
        type: string
paths:
  /communications:
    parameters:
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: |
        Returns a list of communications for the given marketplace.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | listCommunications |
      operationId: listCommunications
      tags:
        - Communication
      x-authorities:
        - listCommunications
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "./jsonapi.yaml#/components/parameters/marketplace"
        - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
        - name: renditionTypeId
          in: query
          description: Rendition type requested. Provide this parameter to tell the server what type of rendition you need.
          required: false
          style: form
          schema:
            type: string
        - name: "filter"
          in: query
          description: Filter group
          required: true
          style: deepObject
          schema:
            type: object
            properties:
              s:
                description: Full text search on description and title.
                type: string
              audienceTypeId:
                description: Filter by Audience Type ID
                type: string
              communicationContentBlockId:
                description: Filter by Communication Content Block ID.
                type: string
              communicationTypeId:
                description: Filter by Communication Type ID.
                type: string
              processingStatusId:
                description: Filter by Processing Status ID.
                type: string
              customerId:
                description: |
                  Filter by Customer ID (only communications visible to the specified customer will be returned).
                type: string
              startDate:
                description: Filter the response by start date.
                type: string
              endDate:
                description: Filter the response by end date.
                type: string
              marketplaceId:
                description: |
                  Filter by Marketplace ID. This filter is evaluated only if the `marketplace` header is not provided.
                type: string
      responses:
        "200":
          description: Communication list response.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CommunicationListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    post:
      description: Create a new communication with minimal data.
      operationId: createCommunication
      tags:
        - Communication
      x-authorities:
        - createCommunication
      requestBody:
        description: Communication creation request.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/CommunicationLiteRequest"
      responses:
        "201":
          description: "[Created](https://jsonapi.org/format/#crud-creating-responses-201)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CommunicationResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /communications/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: |
        Returns a specific communication by its ID.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | listCommunications |
      operationId: getCommunication
      tags:
        - Communication
      x-authorities:
        - listCommunications
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CommunicationResponse"
        "404":
          description: "[Not found](https://jsonapi.org/format/#fetching-resources-responses-404)"
    patch:
      description: |
        Updates a specific communication by its ID. The draft version of the communication will be updated.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | createCommunication |
      operationId: updateCommunication
      tags:
        - Communication
      x-authorities:
        - createCommunication
      requestBody:
        description: Communication update request.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/CommunicationUpdateRequest"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#crud-updating-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CommunicationResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    delete:
      description: |
        Deletes a specific communication by its ID.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | deleteCommunication |
      operationId: deleteCommunication
      tags:
        - Communication
      x-authorities:
        - deleteCommunication
      responses:
        "204":
          description: "[Deleted](https://jsonapi.org/format/#crud-deleting-responses-204)."
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /communications/{id}/edit:
    parameters:
      - $ref: "#/components/parameters/id"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    post:
      description: |
        Edit an existing communication. This creates a new draft version of the communication.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | createCommunication |
      operationId: editCommunication
      tags:
        - Communication
      x-authorities:
        - createCommunication
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CommunicationResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /communications/{id}/publish:
    parameters:
      - $ref: "#/components/parameters/id"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    post:
      description: |
        Publish a draft communication. Once published, the communication becomes active and visible to the intended 
        audience.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | createCommunication |
      operationId: publishCommunication
      tags:
        - Communication
      x-authorities:
        - createCommunication
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CommunicationResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /communications/types:
    parameters:
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      - name: "filter"
        in: query
        description: Filter group
        required: true
        style: deepObject
        schema:
          type: object
          properties:
            s:
              description: Full text search on description.
              type: string
    get:
      description: |
        Returns a list of communication types.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | listCommunications |
      operationId: listCommunicationTypes
      tags:
        - Communication
      x-authorities:
        - listCommunications
      responses:
        "200":
          description: Communication type response.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CommunicationTypeListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /communications/actions:
    get:
      description: |
        **This service is not implemented. It is defined for code generation purposes only.**
      operationId: listCommunicationActions
      tags:
        - Communication
      x-authorities:
        - internalApi
      responses:
        "200":
          description: Communication action response.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CommunicationActionResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
