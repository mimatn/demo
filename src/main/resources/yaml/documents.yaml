      required:
        - commonAttributes
        - packageItemInstance
        - item
        - unitOfMeasureId
        - filter
      properties:
        commonAttributes:
          $ref: "#/components/schemas/CommonReadingDocGroupingAttributes"
        packageItemInstance:
          description: The group's package.
          allOf:
            - $ref: "./core.yaml#/components/schemas/SimpleEntity"
        item:
          $ref: "#/components/schemas/GroupItem"
        unitOfMeasureId:
          description: The group's unit of measure. It is the one defined for `item`.
          type: string
        originalCountryCode:
          description: Not `null` only if orginal country code is a matching attribute.
          type: string
        productionOrderNumber:
          description: Not `null` only if production order number is a matching attribute.
          type: string
        finishingCode:
          description: Not `null` only if finishing code is a matching attribute.
          type: string
        locationPatyId:
          description: Not `null` only if location party is a matching attribute.
          type: string
        filter:
          description: |
            A map that contains the filters to use to retrieve group's detail. The key
            is the attribute, the value is the attribute's value. Possible keys are:
            - `packageItemInstanceId`.
            - `ìtemId`.
            - `unitOfMeasureId`
            - `originalCountryCode` when specified as matching attribute.
            - `productionOrderNumber` when specified as matching attribute.
            - `finishingCode` when specified as matching attribute.
            - `locationPartyId` when specified as matching attribute.
            - `reasonId` when used as a grouping criteria.
            - `fulfilledDocHeaderId` when used as a grouping criteria.
          type: object
          default: {}
          additionalProperties:
            type: string
        operationReason:
          description: |
            The reason of an operation performed on the group's package.
          allOf:
            - $ref: "./core.yaml#/components/schemas/SimpleEntity"
    GroupByLinePackageStrategy:
      description: |
        An object to use when reading document's data is grouped based on `GroupByLinePackage` stretegy.
      type: object
      required:
        - groups
      properties:
        groups:
          description: The groups obtained by aggregating reading document's data.
          type: array
          items:
            $ref: "#/components/schemas/GroupByLinePackageGroup"
    SerialsOnlyGroup:
      description: A group for `SerialsOnly` strategy.
      type: object
      required:
        - commonAttributes
        - itemInstance
        - identificationUhfs
      properties:
        commonAttributes:
          $ref: "#/components/schemas/CommonReadingDocGroupingAttributes"
        itemInstance:
          description: The group's item instance.
          allOf:
            - $ref: "./core.yaml#/components/schemas/SimpleEntity"
        item:
          $ref: "#/components/schemas/GroupItem"
        unitOfMeasureId:
          description: The group's unit of measure. It is the one defined for `item`.
          type: string
        originalCountryCode:
          description: Not `null` only if orginal country code is a matching attribute.
          type: string
        productionOrderNumber:
          description: Not `null` only if production order number is a matching attribute.
          type: string
        finishingCode:
          description: Not `null` only if finishing code is a matching attribute.
          type: string
        locationPatyId:
          description: Not `null` only if location party is a matching attribute.
          type: string
        identificationUhfs:
          description: |
            A list of the UHF RFID tags associated with the instance.
          type: array
          items:
            type: string
        operationReason:
          description: |
            The reason of an operation performed on the group's instance.
          allOf:
            - $ref: "./core.yaml#/components/schemas/SimpleEntity"
    SerialsOnlyStrategy:
      description: |
        An object to use when reading document's data is grouped based on `SerialsOnly` stretegy.
      type: object
      required:
        - groups
      properties:
        groups:
          description: The groups obtained by aggregating reading document's data.
          type: array
          items:
            $ref: "#/components/schemas/SerialsOnlyGroup"
    ReadingDocAggregatedData:
      description: An object that contains aggregated data of a reading document.
      type: object
      required:
        - type
        - attributes
      properties:
        type:
          description: A string that describes the object.
          type: string
          default: "ReadingDocAggregatedData"
        attributes:
          description: The attributes that describes reading document aggregated data.
          type: object
          required:
            - counters
            - strategies
          properties:
            counters:
              description: The counters calculated for the aggregation.
              type: object
              properties:
                global:
                  description: |
                    The global counters. It is `null` when `includeCounters` parameter
                    is `No`. It has a value in all other cases.
                  allOf:
                    - $ref: "#/components/schemas/ReadingDocCounters"
                packages:
                  description: |
                    The package counters. It is `null` when `includePackageCounters`
                    parameter is `No`. It has a value in all other cases.
                  allOf:
                    - $ref: "#/components/schemas/ReadingDocPackageCounters"
            strategies:
              description: |
                Each attribute of this object represents a grouping stretegy. Since
                only one strategy can be used at a time, only one of these attributes
                will be different from `null`.
              type: object
              properties:
                groupByLine:
                  $ref: "#/components/schemas/GroupByLineStrategy"
                groupByPackage:
                  $ref: "#/components/schemas/GroupByPackageStrategy"
                groupByLinePackage:
                  $ref: "#/components/schemas/GroupByLinePackageStrategy"
                serialsOnly:
                  $ref: "#/components/schemas/SerialsOnlyStrategy"
    ReadingDocGetAggregatedResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/ReadingDocAggregatedData"
    UpdateReadingDocInstancesRequestData:
      description: |
        An object containing the document's instances to update. Only one of
        `itemInstanceIds`, `packageItemInstanceIds`, `itemIdPackageItemInstanceIds`
        or `itemIds` can be specified at the same time.
      type: object
      properties:
        itemInstanceIds:
          description: An array with the ids of the item instances to update.
          type: array
          items:
            type: string
        packageItemInstanceIds:
          description: An array with the ids of the package to update.
          type: array
          items:
            type: string
        itemIdPackageItemInstanceIds:
          description: |
            An array with the (item, package) pairs to update.
          type: array
          items:
            type: object
            required:
              - itemId
              - packageItemInstanceId
            properties:
              itemId:
                type: string
              packageItemInstanceId:
                type: string
        itemIds:
          description: An array with the ids of the items to update.
          type: array
          items:
            type: string
    UpdateReadingDocInstancesRequest:
      description: The request to update document's item instances.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/UpdateReadingDocInstancesRequestData"
    UpdatableItemInstancePropertyName:
      description: An enum that defines an updatable item instance property.
      type: string
      enum:
        - OperationReasonId
      x-enum-varnames:
        - OperationReason
    DocLineStatus:
      type: string
      description: |
        Indicates whether the item in the document line is part of the assortment:
          * `NotInAssortment`: The item is not part of the assortment.
          * `Valid`: The item is part of the assortment.

        See dictionary `DocLineStatus`.
      enum:
        - DocLineStatus.NotInAssortment
        - DocLineStatus.Valid
      readOnly: true
    UpdatableItemInstanceProperty:
      description: An item instance's property to update.
      type: object
      required:
        - name
        - propertyValue
      properties:
        name:
          $ref: "#/components/schemas/UpdatableItemInstancePropertyName"
        propertyValue:
          description: The value to assign to the property.
          type: string
    UpdateReadingDocInstancesPropertiesRequestData:
      description: |
        An object containing the document's instances to update and the properties'
        values to use. Only one of `itemInstanceIds`, `packageItemInstanceIds`,
        `itemIdPackageItemInstanceIds` or `itemIds` can be specified at the same time.
      type: object
      required:
        - properties
      properties:
        itemInstanceIds:
          description: An array with the ids of the item instances to update.
          type: array
          items:
            type: string
        packageItemInstanceIds:
          description: An array with the ids of the packages to update.
          type: array
          items:
            type: string
        itemIdPackageItemInstanceIds:
          description: |
            An array with the (item, package) pairs to update.
          type: array
          items:
            type: object
            required:
              - itemId
              - packageItemInstanceId
            properties:
              itemId:
                type: string
              packageItemInstanceId:
                type: string
        itemIds:
          description: An array with the ids of the items to update.
          type: array
          items:
            type: string
        properties:
          description: A list that contains the properties to update.
          type: array
          minLength: 1
          items:
            $ref: "#/components/schemas/UpdatableItemInstanceProperty"
    UpdateReadingDocInstancesPropertiesRequest:
      description: The request to update document's item instances properties.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/UpdateReadingDocInstancesPropertiesRequestData"
    ResetReadingDocRequestData:
      description: The paramters to reset a reading document.
      type: object
      properties:
        packageItemInstanceIds:
          description: |
            An array with the ids of the package item instances to reset. When not
            `null` and not empty, only readings related to the specified package item
            instances will be reset.
          type: array
          items:
            type: string
    ResetReadingDocRequest:
      description: The request to reset a reading document.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/ResetReadingDocRequestData"
  parameters:
    headerId:
      name: headerId
      in: path
      description: The doc header id.
      required: true
      schema:
        type: string
    lineId:
      name: lineId
      in: path
      description: The doc line id.
      required: true
      schema:
        type: string
    DocWithItemsHeaderFiltersParameter:
      name: filter
      description: Complex filters for a document headers that deals with items.
      in: query
      required: true
      style: deepObject
      schema:
        $ref: "#/components/schemas/DocWithItemsHeaderFilters"
    DocWithItemsLineFiltersParameter:
      name: filter
      description: Complex filters for document lines that deals with items.
      in: query
      required: true
      style: deepObject
      schema:
        $ref: "#/components/schemas/DocWithItemsLineFilters"
    filterDocCategoryRequired:
      name: "filter[docCategoryId]"
      in: query
      description: Filter the response by document category id.
      required: true
      style: form
      schema:
        type: string
    getLinkedDocsFilter:
      name: filter
      in: query
      description: Optional filters to customize which documents to retrieve.
      required: true
      style: deepObject
      schema:
        $ref: "#/components/schemas/GetLinkedDocsFilter"
    groupByFulfilledDoc:
      name: groupByFulfilledDoc
      description: |
        If `true` separates either lines or packages of different source documents.
      in: query
      required: false
      schema:
        type: boolean
        default: false
    groupByReason:
      name: groupByReason
      description: |
        If `true` it separates either lines or packages with different reasons.
      in: query
      required: false
      schema:
        type: boolean
        default: false
    groupByOperationReason:
      name: groupByOperationReason
      description: |
        If `true` it separates either lines or packages with different operation reasons.
      in: query
      required: false
      schema:
        type: boolean
        default: false
    includeCountersRequired:
      name: includeCounters
      description: |
        How to manage document's global counters.

        Options:
          * `Yes`. Reading document's counters are calculated and retrieved.
          * `YesWithFilter`. Reading document's counters are calculated and retrieved.
          considering the values used as filters.
          * `No`. Reading document's counters are completely ignored.
      in: query
      required: true
      schema:
        type: string
    includeCounters:
      name: includeCounters
      description: |
        How to manage document's global counters.

        Options:
          * `Yes`. Reading document's counters are calculated and retrieved.
          * `YesWithFilter`. Reading document's counters are calculated and retrieved.
          considering the values used as filters.
          * `No`. Reading document's counters are completely ignored.
      in: query
      required: false
      schema:
        type: string
    includePackageCountersRequired:
      name: includePackageCounters
      description: |
        How to manage document's package counters.

        Options:
          * `Yes`. Reading document's counters are calculated and retrieved.
          * `YesWithFilter`. Reading document's counters are calculated and retrieved.
          considering the values used as filters.
          * `No`. Reading document's counters are completely ignored.
      in: query
      required: true
      schema:
        type: string
    includePackageCounters:
      name: includePackageCounters
      description: |
        How to manage document's package counters.

        Options:
          * `Yes`. Reading document's counters are calculated and retrieved.
          * `YesWithFilter`. Reading document's counters are calculated and retrieved.
          considering the values used as filters.
          * `No`. Reading document's counters are completely ignored.
      in: query
      required: false
      schema:
        type: string
    groupingStrategy:
      name: groupingStrategy
      description: |
        The grouping strategy to use for the aggregation.

        Specifies how the content of a document should be grouped when retrieved.

        This strategy determines the structure of the returned data, such as whether to return raw lines, 
        group items by package, or return only serials.

        Options:
          * `NoDetail`. To use when the document's body is not meaningfull, e.g. when only totals are nedded.
          * `GroupByLine`. Returns the document's lines grouped by:
            * Item
            * Unit of measurement
            * Original country code, if specified as match attribute.
            * Production order number, if specified as match attribute.
            * Finishing code, if specified as match attribute.
            * Location party, if specified as match attribute.
            * Reason, if specified as match attribute.
            * Fulfilled document, only if fulfilled document is used as a grouping criteria.
          * `GroupByPackage`. Returns the document's packages grouped by:
            * Package serial
            * Reason, only if reason is used as a grouping criteria.
            * Fulfilled document, only if fulfilled document is used as a grouping criteria.
          * `GroupByLinePackage`. Returns the document's packages grouped by:
            * Package serial
            * All the elements considered by `GroupByLine` strategy.
          * `SerialsOnly`. Returns the serials in the document.
      in: query
      required: true
      schema:
        type: string
    GetReadingDocAggregatedDataSorting:
      name: sortingStrategy
      description: |
        Defines how data are sorted when retrieving aggregated data of a reading document.

        The possible values are:
        - `Unexpected` (default): Sort unexpected records first. If expected and unexpected records are equal, sort by descending read date, where the first record is the last one read.
        - `ReadingTs`: Sort by descending read date, where the first record is the last one read.
      in: query
      required: false
      schema:
        type: string
    GetReadingDocAggregatedDataFilters:
      name: filter
      description: Additional filters to narrow down retrieved data.
      in: query
      required: true
      schema:
        type: object
        properties:
          packageItemInstanceId:
            description: Valid only for `GroupByPackage`, `GroupByLinePackage`and `SerialsOnly` strategies.
            type: string
          itemId:
            description: Valid only for `GroupByLine`, `GroupByLinePackage`and `SerialsOnly` strategies.
            type: string
          unitOfMeasurementId:
            description: Valid only for `GroupByLine`, `GroupByLinePackage`and `SerialsOnly` strategies.
            type: string
          originalCountryCode:
            description: |
              Valid only for `GroupByLine`, `GroupByLinePackage`and `SerialsOnly` strategies and if
              specified as matching attribute.
            type: string
          productionOrderNumber:
            description: |
              Valid only for `GroupByLine`, `GroupByLinePackage`and `SerialsOnly` strategies and if
              specified as matching attribute.
            type: string
          finishingCode:
            description: |
              Valid only for `GroupByLine`, `GroupByLinePackage`and `SerialsOnly` strategies and if
              specified as matching attribute.
            type: string
          locationPartyId:
            description: |
              Valid only for `GroupByLine`, `GroupByLinePackage`and `SerialsOnly` strategies and if
              specified as matching attribute.
            type: string
          reasonId:
            description: |
              Valid only for `GroupByPackage`, `GroupByLine`, `GroupByLinePackage`and `SerialsOnly`
              strategies and if reason is used as a grouping criteria.
            type: string
          fulfilledDocHeaderId:
            description: |
              Valid only for `GroupByPackage`, `GroupByLine`, `GroupByLinePackage`and `SerialsOnly`
              strategies and if fulfilled document is used as a grouping criteria.
            type: string
          expectedQty:
            description: Filters data based on document's expected quantity.
            type: string
          readQty:
            description: Filters data based on document's read quantity.
            type: string
          missingQty:
            description: Filters data based on document's missing quantity.
            type: string
          unexpectedQty:
            description: Filters data based on document's unexpected quantity.
            type: string
paths:
  /doc-types/{id}:
    parameters:
      - name: id
        in: path
        description: The document type id
        required: true
        schema:
          type: string
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: Get a Document Type
      operationId: getDocType
      tags:
        - Document
      x-authorities:
        - apiUser
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/DocTypeResponse"
        "404":
          description: "[Not found](https://jsonapi.org/format/#fetching-resources-responses-404)"
  /doc-types:
    get:
      description: |
        Returns a collection of Document types. When invoked from a marketplace, the result is restricted to the 
        document types visible in the marketplace.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | listDocTypes |
      operationId: listDocTypes
      tags:
        - Document
      x-authorities:
        - listDocTypes
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "./jsonapi.yaml#/components/parameters/marketplace"
        - name: "filter"
          in: query
          description: Filter by generic string, organization, docCategory, docNumberRange
          required: true
          style: deepObject
          schema:
            type: object
            properties:
              s:
                type: string
              organizationId:
                description: Filter the response by Organization id. The user must also have the permission to view the organization.
                type: string
              appId:
                description: Filter the response by app.
                type: string
              docCategoryId:
                description: The document category
                type: string
              docNumberRangeId:
                description: The document number range
                type: string
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      responses:
        "200":
          description: Document Type list response
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/DocTypeListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /doc-categories:
    get:
      description: Returns a collection of Document categories.
      operationId: listDocCategories
      tags:
        - Document
      x-authorities:
        - apiUser
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - name: "filter"
          in: query
          description: Filter by generic string, organization, docCategory, docNumberRange.
          required: true
          style: deepObject
          schema:
            type: object
            properties:
              s:
                type: string
              docHeaderTypeId:
                description: Filter the response by document header type.
                type: string
              organizationId:
                description: Finds only categories linked to document types defined for the organization.
                type: string
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      responses:
        "200":
          description: Document categories list response.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/DocCategoryListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /doc-categories/{id}:
    parameters:
      - name: id
        in: path
        description: The document category id.
        required: true
        schema:
          type: string
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: Get a Document Category.
      operationId: getDocCategory
      tags:
        - Document
      x-authorities:
        - apiUser
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/DocCategoryResponse"
        "404":
          description: "[Not found](https://jsonapi.org/format/#fetching-resources-responses-404)"
  #
  # JSON:API definition for Reason services
  #
