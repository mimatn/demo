                $ref: "#/components/schemas/AccessJournalEntryResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /badges/{id}:
