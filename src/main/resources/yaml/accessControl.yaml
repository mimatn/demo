  /zones/check-out-personnel:
    parameters:
      - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    post:
      description: |
        Sets the personnel count to zero for all zones or for the specified list of zones.

        **IMPORTANT**: this operation can be performed only for zones that do not have any active emergency and they
        must be of type `ZoneType.Bunker`.
      operationId: checkOutPersonnel
      tags:
        - Zone
      x-authorities:
        - apiUser
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/CheckoutPersonnelRequest"
      responses:
        "200":
          description: Personnel count reset.
        "400":
          description: Bad request
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
