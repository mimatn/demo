      x-authorities:
        - apiUser
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/AccessGateResponse"
        "404":
          description: "[Not found](https://jsonapi.org/format/#fetching-resources-responses-404)"
    patch:
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      description: Updates the access gate identified by the id in the path.
      operationId: updateAccessGate
      tags:
        - Access Gate
      x-authorities:
        - apiUser
      requestBody:
        description: The data needed to update the access gate with the id in the path.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/AccessGateRequest"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/AccessGateResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    delete:
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      description: Deletes the access gate identified by the id in the path, if it exists.
      operationId: deleteAccessGate
      tags:
        - Access Gate
      x-authorities:
        - apiUser
      responses:
        "204":
          description: "[Deleted](https://jsonapi.org/format/#crud-deleting-responses-204)."
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /badge-holders/{id}:
    parameters:
      - name: id
        description: A badge holder's id.
        in: path
        required: true
        schema:
          type: string
    get:
      description: Returns the badge holder with the id provided in the path.
      operationId: getBadgeHolder
      tags:
