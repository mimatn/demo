        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /zones/{id}/head-count:
    parameters:
      - $ref: "#/components/parameters/ZoneId"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    post:
      description: |
        Triggers the head count procedure for the zone specified in the path to count again people in it. Calling
        this API will produce a movement with direction OUT for all badge holders currently in the target zone. 
        Moreover, a message will be sent to the zone such that it is notified of the head count request.
      operationId: doHeadCountInZone
      tags:
        - Zone
      x-authorities:
        - apiUser
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/AccessJournalEntryListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /zones/{id}/hierarchy:
