        description: The code of a badge holder.
        required: true
        schema:
          type: string
    post:
      description: |
        Creates an entry into the access journal for the badge holder identified by the code in the path. Security
        checks on the badge holders may be inhibited if an emergency situation is going on, according to configuration.
        This API updates both the access journal and, when the access outcome is positive, the badge holder's last
        movement information, too.
      operationId: grantAccessFromCode
      tags:
        - Badge Holder
      x-authorities:
        - apiUser
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      requestBody:
        description: The data needed to keep track of the badge holder's access.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/ManualAccessRequest"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
