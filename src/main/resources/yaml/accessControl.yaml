      operationId: getBadge
      tags:
        - Badge Holder
      x-authorities:
        - apiUser
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/BadgeResponse"
        "404":
          description: "[Not found](https://jsonapi.org/format/#fetching-resources-responses-404)"
  /access/entries:
    parameters:
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    post:
      description: |
        Creates an entry in the access journal for the badge holder that owns the badge provided in the request.
        Security checks on the badge holder may be inhibited if an emergency is going on, according to configuration.
        This service updates both the access journal and, when the access outcome is positive, the badge holder last
        movement information, too.
      operationId: grantAccess
      tags:
        - Access Journal
      x-authorities:
        - apiUser
      requestBody:
        description: The access journal entry to create.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/AccessJournalEntryRequest"
      responses:
        "201":
          description: "[Created](https://jsonapi.org/format/#crud-creating-responses-201)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/AccessJournalEntryResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /zones/kpis:
    parameters:
      - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: |
        Calculates a set of KPIs about zones. The defined KPIs are:
        * The number of zones with bunkers inside them;
        * The number of bunkers;
        * The total amount of people checked-in bunkers.
      operationId: listZonesKPIs
      tags:
        - Zone
      x-authorities:
        - apiUser
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./core.yaml#/components/schemas/KPIEntityListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /zones/{id}/emergencies:
    parameters:
      - $ref: "#/components/parameters/ZoneId"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    post:
      description: Starts an emergency for the zone specified in the path and all its children zones.
      operationId: startEmergencyForZone
      tags:
        - Zone
      x-authorities:
        - apiUser
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ZoneEmergencyResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /emergencies:
    parameters:
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
      - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
      - $ref: "./jsonapi.yaml#/components/parameters/sort"
      - $ref: "./jsonapi.yaml#/components/parameters/include"
    get:
      description: Returns a list of the zone emergencies that match the provided filters, if specified.
      operationId: listEmergencies
      tags:
        - Zone
      x-authorities:
        - apiUser
      parameters:
        - $ref: "#/components/parameters/ZoneEmergencyFilterParameter"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ZoneEmergencyListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /emergencies/{id}:
    parameters:
      - $ref: "#/components/parameters/ZoneEmergencyId"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    patch:
      description: Stops the emergency specified in the path. The emergency will be stopped for every zone linked to it.
      operationId: stopEmergency
      tags:
        - Zone
      x-authorities:
        - apiUser
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ZoneEmergencyResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /access/groups:
    get:
