      x-authorities:
        - apiUser
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/BadgeHolderResponse"
        "404":
          description: "[Not found](https://jsonapi.org/format/#fetching-resources-responses-404)"
  /badge-holders/by-code/{code}:
    parameters:
      - name: code
        description: A badge holder's code.
        in: path
        required: true
        schema:
          type: string
    get:
      description: Returns the badge holder that corresponds to the code in the path.
      operationId: getBadgeHolderFromCode
      tags:
