      requestBody:
        description: The data needed to create a new access gate.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/AccessGateRequest"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/AccessGateResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /access/gates/{id}:
    parameters:
