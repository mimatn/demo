openapi: 3.0.3
info:
  title: Tickets API
  version: "-"
tags:
  - name: Ticket
    description: |
      A ticket allows a report or issue to be assigned to a specific `Party`. 
      This report must then be acknowledged, managed, and resolved until it is officially closed.
components:
  parameters:
    ticketFilters:
      name: "filter"
      in: query
      description: Filter group
      style: deepObject
      required: true
      schema:
        properties:
          s:
            description: Search the given string; searches inside the `ticketCode` attribute
            type: string
          openingTs:
            description: Filter the response by the opening date of the ticket.
            type: string
          ticketPriorityId:
            description: Filter the response by the ticket priority Id. See dictionary `TicketPriority`.
            type: string
          ticketTypeId:
            description: Filter the response by the ticket type ID.
            type: string
          ticketStatusId:
            description: Filter the response by the ticket status ID.
            type: string
          assigneePartyId:
            description: Filter the response by the assignee party ID.
            type: string
          startTs:
            description: Filter the response by the start date of the ticket.
            type: string
          subjectPartyId:
            description: Filter the response by the subject party ID.
            type: string
          itemInstanceCode:
            description: Filter the response by the item instance code. An item instance may be, for example, an asset.
            type: string
  schemas:
    TicketType:
      description: Ticket type resource.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "TicketType"
        id:
          type: string
        attributes:
          type: object
          required:
            - descr
            - ticketAssigneePartyId
          properties:
            descr:
              description: General name or description.
              type: string
            ticketTypeCategoryId:
              description: The category of the ticket type. See dictionary `TicketTypeCategory`.
              type: string
            ticketAssigneePartyTypeId:
              description: Ticket assignee party type. See dictionary `ticketAssigneePartyType`.
              type: string
        relationships:
          type: object
          description: The relationships of a Ticket.
          required:
            - organization
          properties:
            organization:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            parentTicketType:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
    TicketTypeIncluded:
      description: Related entities.
      type: array
      items:
        type: object
      uniqueItems: true
    TicketTypeListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: List of TicketTypes.
          type: array
          items:
            $ref: "#/components/schemas/TicketType"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/TicketTypeIncluded"
    TicketReason:
      description: Ticket reason resource.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "TicketReason"
        id:
          type: string
        attributes:
          type: object
          required:
            - code
            - descr
            - sequenceNum
          properties:
            code:
              description: The code of the ticket reason.
              type: string
            descr:
              description: General name or description.
              type: string
            sequenceNum:
              description: The sequence number of the ticket reason.
              type: integer
              minimum: 0
        relationships:
          type: object
          description: The relationships of a Ticket.
          required:
            - organization
            - ticketType
          properties:
            organization:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            ticketType:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
    TicketReasonIncluded:
      description: Related entities.
      type: array
      items:
        type: object
      uniqueItems: true
    TicketReasonListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: List of TicketReason.
          type: array
          items:
            $ref: "#/components/schemas/TicketReason"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/TicketReasonIncluded"
    Ticket:
      description: Ticket resource.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "Ticket"
        id:
          type: string
        attributes:
          type: object
          required:
            - title
            - ticketPriorityId
            - openingTs
            - ticketStatusId
          properties:
            title:
              description: Ticket title.
              type: string
            ticketPriorityId:
              description: The priority of the ticket. See dictionary `TicketPriority`.
              type: string
            descr:
              description: General description.
              type: string
            openingTs:
              description: The date and time when the ticket was opened.
              type: string
              format: date-time
              example: "2022-02-25T14:10:00.0Z"
            startTs:
              description: The date and time when the ticket was started.
              type: string
              format: date-time
              example: "2022-02-25T14:10:00.0Z"
            closingTs:
              description: The date and time when the ticket was closed.
              type: string
              format: date-time
              example: "2022-02-25T14:10:00.0Z"
            ticketStatusId:
              description: The status of the ticket. See dictionary `TicketStatus`.
              type: string
            operatorCode:
              description: The operator code of the ticket.
              type: string
            externalRefNumber:
              description: The external reference number of the ticket.
              type: string
            resolution:
              description: The resolution of the ticket.
              type: string
            ticketCode:
              description: The code of the ticket.
              type: string
            ticketNumber:
              description: The number of the ticket.
              type: string
            totalPrice:
              description: The total price of the ticket.
              type: number
              format: double
              readOnly: true
        relationships:
          type: object
          description: The relationships of a Ticket.
          required:
            - organization
            - ticketType
            - reporterParty
            - assigneeParty
          properties:
            organization:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            ticketType:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            reporterParty:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            assigneeParty:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            subjectParty:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            customerContract:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            currency:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
            plant:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
            docNumberRange:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
            ticketReason:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
    TicketIncluded:
      description: Related entities.
      type: array
      items:
        type: object
      uniqueItems: true
    TicketListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: List of Tickets.
          type: array
          items:
            $ref: "#/components/schemas/Ticket"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/TicketIncluded"
    TicketResponse:
      description: Single Ticket response.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Ticket"
        included:
          $ref: "#/components/schemas/TicketIncluded"
paths:
  /tickets:
    get:
      description: |
        Returns a list of all tickets.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | listTickets |
      operationId: listTickets
      tags:
        - Ticket
      x-authorities:
        - listTickets
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
        - $ref: "#/components/parameters/ticketFilters"
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      responses:
        "200":
          description: Ticket list response
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/TicketListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /tickets/export:
    post:
      description: |
        Request an export of a list of tickets.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | exportTickets |
      operationId: exportTickets
      tags:
        - Ticket
      x-authorities:
        - exportTickets
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
        - $ref: "./core.yaml#/components/parameters/utcOffset"
        - $ref: "./core.yaml#/components/parameters/templateIdParamRequired"
        - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
        - $ref: "#/components/parameters/ticketFilters"
      responses:
        "202":
          description: Data export request accepted
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/info"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /tickets/types:
    get:
      description: |
        Returns a list of all ticket types.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | listTickets |
      operationId: listTicketTypes
      tags:
        - Ticket
      x-authorities:
        - listTickets
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
        - name: "filter"
          in: query
          description: Filter group
          required: true
          style: deepObject
          schema:
            type: object
            properties:
              s:
                description: Search the given string; searches inside the descr attribute.
                type: string
              ticketTypeCategoryId:
                description: Filter the response by the ticket type category Id. See dictionary `TicketTypeCategory`.
                type: string
              ticketAssigneePartyTypeId:
                description: |
                  Filter the response by the ticket assignee party type Id. See dictionary `TicketAssigneePartyType`.
                type: string
              parentTicketType:
                description: Filter the response by the parent ticket type Id.
                type: string
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      responses:
        "200":
          description: Ticket type list response
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/TicketTypeListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /tickets/reasons:
    get:
      description: |
        Returns a list of all ticket reasons.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | listTickets |
      operationId: listTicketReasons
      tags:
        - Ticket
      x-authorities:
        - listTickets
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
        - name: "filter"
          in: query
          description: Filter group
          required: true
          style: deepObject
          schema:
            type: object
            properties:
              s:
                description: Search the given string; searches inside code and descr attributes.
                type: string
              ticketType:
                description: Filter the response by the ticket type Id.
                type: string
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      responses:
        "200":
          description: Ticket reasons list response
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/TicketReasonListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
