        - TagType.Filter&Label
    Tag:
      description: Tag resource.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "Tag"
        id:
          type: string
        attributes:
          type: object
          required:
            - descr
            - text
            - tagTypeId
            - sequenceNum
          properties:
            descr:
              description: The tag name, used as the text of the tag when shown as a label, like [descr].
              type: string
            text:
              description: The tag long description, to explain what the tag means or show details.
              type: string
            textColor:
              description: |
                Text color in RGB or RGBA format. 
                Not supported (ignored) for a tag of type “category” TagType=4.
                Formats:
                * #RRGGBB, like this for a dark red #ce000a   
                * #RRGGBBAA where a is the opacity (alpha channel), like this for an opaque dark red #ce000aff, this for a 50% opaque red #ce000a77
              type: string
            backgroundColor:
              description: |
                Background color in RGB or RGBA format. 
                Not supported (ignored) for a tag of type “category” TagType=4.
                Formats:
                * #RRGGBB, like this for a dark red #ce000a   
                * #RRGGBBAA where a is the opacity (alpha channel), like this for an opaque dark red #ce000aff, this for a 50% opaque red #ce000a77
              type: string
            imageURL:
              description: Optional URL of the image to use to display the tag (only when supported by the application).
              type: string
            tagTypeId:
              $ref: "#/components/schemas/TagTypeId"
            tagGroupId:
              description: Tag group, can be used to group tags. See dictionary `TagGroup`.
              type: string
            sequenceNum:
              description: The sequence number used to sort the tags, when presenting them.
              type: integer
              example: 0
            entityName:
              description: Reference entity, i.e. Contact, DocHeader, DocLine, Customer etc.
              type: string
              example: CustomerAccount
            taggedEntitiesCount:
              description: |
                The number of entities currently associated with this tag. This attribute is populated only when a single tag is retrieved; 
                for a list of tags, this attribute will be `null`.
              type: integer
              readOnly: true
              minimum: 0
        relationships:
          type: object
          required:
            - organization
          properties:
            organization:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
