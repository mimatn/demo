    #
    # Report resources
    #
    ReportTemplateType:
      description: |
        An enum where are defined the different types (or specializations) of a report template. Available types are:
          * `ReportTemplateType.ReportEngine` that is associated to reports handled by the report engine. All
            these reports are, at the end, files (e.g. PDF, Excel, etc.)
          * `ReportTemplateType.ReportString` that is associated to reports that are string with placeholders.
      type: string
      enum:
        - ReportTemplateType.ReportEngine
        - ReportTemplateType.ReportString
      x-enum-varnames:
        - ReportEngine
        - ReportString
    ReportDataAdapterType:
      description: An enum where are defined the different adapter types for report templates.
      type: string
      enum:
        - ReportDataAdapterType.PurchaseDoc
        - ReportDataAdapterType.SalesDoc
        - ReportDataAdapterType.PurchaseDocLine
      x-enum-varnames:
        - PurchaseDoc
        - SalesDoc
        - PurchaseDocLine
    ReportFormatType:
      description: An enum where are defined the reports format types.
      type: string
      enum:
        - ReportFormatType.DirectPrint
        - ReportFormatType.PDF
        - ReportFormatType.XLSX
      x-enum-varnames:
        - DirectPrint
        - Pdf
        - Xlsx
    ReportTemplateAttributes:
      description: |
        The attributes of a generic report template. These attributes will be inherited by all report template
        specializations. Each specialization may add new attributes to better describe itself.
      type: object
      required:
        - descr
        - reportTemplateTypeId
      properties:
        descr:
          description: A string that summarizes the meaning of the report template.
          type: string
          example: "This is a report template"
        reportTemplateTypeId:
          $ref: "#/components/schemas/ReportTemplateType"
        reportDataAdapterTypeId:
          $ref: "#/components/schemas/ReportDataAdapterType"
    ReportTemplateRelationships:
      description: |
        The relationships of a generic report template. These relationships will be inherited by all report template
        specializations. Each specialization may add new relationships to better describe itself.
      type: object
      required:
        - organization
      properties:
        organization:
          $ref: "./jsonapi.yaml#/components/schemas/relToOne"
        digitalContentType:
          $ref: "./jsonapi.yaml#/components/schemas/relToOne"
    ReportStringTemplate:
      description: |
        Represents a string template, that is a string with placeholders which can be substituted with values.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          description: A string that describes the type of the object.
          type: string
          default: ReportStringTemplate
        id:
          description: A string that uniquely identifies the object.
          type: string
          example: "ST.1"
        attributes:
          description: |
            The attributes of a string template. They consist in all the attributes of a generic report template plus
            the ones specific of a string template. Indeed, a string template **is** a report template.
          allOf:
            - $ref: "#/components/schemas/ReportTemplateAttributes"
            - type: object
              required:
                - templateString
              properties:
                templateString:
                  description: A string with placeholders that can be substituted with values.
                  type: string
        relationships:
          $ref: "#/components/schemas/ReportTemplateRelationships"
    ReportStringTemplateResponse:
      description: An object that contains a single report string template resource.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/ReportStringTemplate"
    ReportEngineTemplate:
      description: Represents a report handled exclusively by the report engine and that, in output, will be a file.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          description: A string that describes the type of the object.
          type: string
          default: "ReportEngineTemplate"
        id:
          description: A string that uniquely identifies the object.
          type: string
          example: "ET.1"
        attributes:
          description: |
            The attributes of a engine template. They consist in all the attributes of a generic report template plus
            the ones specific of a engine template. Indeed, an engine template **is** a report template.
          allOf:
            - $ref: "#/components/schemas/ReportTemplateAttributes"
            - type: object
              required:
                - reportFormatType
              properties:
                templateFileName:
                  description: The name of the file needed to generate the report.
                  type: string
                reportFormatType:
                  $ref: "#/components/schemas/ReportFormatType"
        relationships:
          $ref: "#/components/schemas/ReportTemplateRelationships"
    ReportEngineTemplateResponse:
      description: An object that contains a single report engine resource.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/ReportEngineTemplate"
    ReportTemplateEntity:
      description: |
        Represents the relationship between a **generic** report template and an entity. Specific report information
        can be retrieved by including `reportTemplate` relationship.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "ReportTemplateEntity"
        id:
          type: string
        attributes:
          type: object
          required:
            - sequenceNum
          properties:
            sequenceNum:
              description: Sequence number. It determines the order of the templates.
              type: integer
              minimum: 0
        relationships:
          type: object
          description: Related report template.
          required:
            - reportTemplate
          properties:
            reportTemplate:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
    ReportTemplateEntityIncluded:
      description: Related report template.
      type: array
      items:
        type: object
      uniqueItems: true
    ReportTemplateEntityListResponse:
      type: object
      required:
        - data
      properties:
        data:
          description: List of `ReportTemplateEntity`.
          type: array
          items:
            $ref: "#/components/schemas/ReportTemplateEntity"
        included:
          $ref: "#/components/schemas/ReportTemplateEntityIncluded"
    ReportQueueEntry:
      description: Represents a report queue entry.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "ReportQueue"
        id:
          type: string
        attributes:
          type: object
          required:
            - digitalContentDescr
          properties:
            submittedTs:
              $ref: "./dataTypes.yaml#/components/schemas/apiDateTimeReadOnly"
            startTs:
