  /email-verification/start:
    parameters:
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    post:
      description: |
        Requests the start of the email verification process on an entity. Can be used by an operator to request the 
        verification process on another entity, or by the entity itself to request a new process if it couldn't complete
        the previous one on time.
        - For "verify entity email on demand", provide `entityId` and `entityObjectId`.  
        - For "link expired, send another", provide `verificationId` and `nonce`.

        To access this service you need the following permission:
        | Permission |
        |:-:|
        | emailVerification |
      operationId: startEmailVerification
      tags:
        - Email Verification
      x-authorities:
        - emailVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entityId:
                  type: string
                  description: Entity identifier
                entityObjectId:
                  type: string
                  description: Object identifier within the entity
                verificationId:
                  type: string
                  description: Verification identifier (for retry)
                nonce:
                  type: string
                  description: Nonce value (for retry)
      responses:
        "201":
          description: Created
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /email-verification:
    parameters:
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    post:
      description: |
        Verifies an email using a nonce.

        To access this service you need the following permission:
        | Permission |
        |:-:|
        | emailVerification |
      operationId: verifyEmail
      tags:
        - Email Verification
      x-authorities:
        - emailVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nonce
              properties:
                nonce:
                  type: string
                  description: Nonce value for verification.
      responses:
        "202":
          description: Accepted.
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
