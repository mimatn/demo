          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
    #
    # LinkedProfiles objects
    #
    LinkedProfile:
      description: |
        A generic profile that can be linked to a user profile. A profile can represent a customer, a supplier or a 
        sales rep.
      type: object
      required:
        - id
      properties:
        id:
          description: The id of a profile.
          type: string
          readOnly: true
        code:
          description: The code of a profile.
          type: string
          readOnly: true
        descr:
          description: The description of a profile.
          type: string
          readOnly: true
        name:
          description: The name of a profile.
          type: string
          readOnly: true
        type:
          description: The type of a profile.
          type: string
          readOnly: true
        formattedAddress:
          description: The formatted address of a profile. If the profile does not have an address, this field is null.
          type: string
          readOnly: true
        phoneNumber:
          description: The phone number of a profile. If the profile does not have a phone number, this field is null.
          type: string
          readOnly: true
        email:
          description: The email of a profile. If the profile does not have an email, this field is null.
          type: string
          readOnly: true
        taxNumber:
          description: The tax number of a profile. If the profile does not have a tax number, this field is null.
          type: string
          readOnly: true
        fiscalCode:
          description: The fiscal code of a profile. If the profile does not have a fiscal code, this field is null.
          type: string
          readOnly: true
        legalMail:
          description: The legal mail of a profile. If the profile does not have a legal mail, this field is null.
          type: string
          readOnly: true
    LinkedProfiles:
      description: Basic information of a user profile's linked profiles.
      type: object
      required:
        - type
        - id
        - attributes
      properties:
        type:
          type: string
          default: "LinkedProfiles"
        id:
          type: string
          description: User profile id.
        attributes:
          type: object
          required:
            - customers
            - suppliers
            - salesReps
          properties:
            customers:
              description: Linked customers.
              type: array
              items:
                $ref: "#/components/schemas/LinkedProfile"
              default: []
              example: |
                ```
                [
                  {
                    "id": "CUSTOMER.1",
                    "code": "CUSTOMER.1.CODE",
                    "descr": "This is a customer",
                    "name": "Customer 1",
                    "type": "CustomerType.BillTo",
                    "formattedAddress": "Via Alessandro Volta, 2, 31020 VILLORBA TV, Italia",
                    "phoneNumber": "+3904226184",
                    "email": "info@aton.com",
                    "taxNumber": "12345678901",
                    "fiscalCode": "12345678901",
                    "legalMail": "pec@aton.com"                
                  }
                ]
                ```
            suppliers:
              description: Linked suppliers.
              type: array
              items:
                $ref: "#/components/schemas/LinkedProfile"
              default: []
              example: |
                ```
                [
                  {
                    "id": "SUPPLIER.1",
                    "code": "SUPPLIER.1.CODE",
                    "descr": "This is a supplier",
                    "name": "Supplier 1",
                    "type": "SupplierType.BuyFrom",
                    "formattedAddress": "Via Alessandro Volta, 2, 31020 VILLORBA TV, Italia",
                    "phoneNumber": "+3904226184",
                    "email": "info@aton.com",
                    "taxNumber": "12345678901",
                    "fiscalCode": "12345678901",
                    "legalMail": "pec@aton.com" 
                  }
                ]
                ```
            salesReps:
              description: Linked sales reps.
              type: array
              items:
                $ref: "#/components/schemas/LinkedProfile"
              default: []
              example: |
                ```
                [
                  {
                    "id": "SALES.REP.1",
                    "code": "SALES.REP.1.CODE",
                    "descr": "This is a sales rep",
                    "name": "SalesRep 1",
                    "type": "SalesRepType.Agente",
                    "formattedAddress": "Via Alessandro Volta, 2, 31020 VILLORBA TV, Italia",
                    "phoneNumber": "+3904226184",
                    "email": "info@aton.com",
                    "taxNumber": "12345678901",
                    "fiscalCode": "12345678901",
                    "legalMail": "pec@aton.com" 
                  },
                ]
                ```
    LinkedProfilesResponse:
      description: LinkedProfile response.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/LinkedProfiles"
    UpdateLinkedProfilesRequest:
      description: An object used to update the profiles linked to a user.
      type: object
      required:
        - data
      properties:
        data:
          description: The id of the profiles to link to the user.
          type: object
          properties:
            customers:
              description: |
                The ids of the customers to link to the user. 
                If the array is empty all the associations will be deleted. 
                If the array is null, no action will be performed on this association.
              type: array
              items:
                type: string
              default: []
            suppliers:
              description: |
                The ids of the suppliers to link to the user. 
                If the array is empty all the associations will be deleted. 
                If the array is null, no action will be performed on this association.
              type: array
              items:
                type: string
              default: []
