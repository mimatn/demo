    #
    # KPIs objects
    #
    KPIEntity:
      description: |
        Key Performance Indicator entity. It represents a generic metric, financial and otherwise, used by companies to monitor and evaluate performance.
        Handy way to retrieve strategic metrics with current, target and historical results.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "KPI"
        id:
          description: |
            KPI id. Uniquely identifies a KPI entity. Each entity (sales documents, customers etc.) can define a set of managed KPIs.
          type: string
        attributes:
          type: object
          required:
            - id
            - title
            - value
          properties:
            title:
              description: The title of this KPI.
              type: string
            value:
              description: Numeric value that represents this KPI.
              type: number
            dateTime:
              $ref: "./dataTypes.yaml#/components/schemas/apiDateTime"
            percentage:
              description: Optional percentage value.
              type: number
              format: double
            descr:
              description: Optional description of this KPI.
              type: string
            reference:
              description: Optional numeric value used as the reference value for the percentage
              type: number
        relationships:
          description: There are two relationships both optional. Relationships are mutually exclusive.
          type: object
          properties:
            currency:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            unitOfMeasurement:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
          uniqueItems: true
    KPIEntityIncluded:
      description: Related Currency or UnitOfMeasurement
      type: array
      items:
        type: object
      uniqueItems: true
    KPIEntityResponse:
      description: Single KPI entity.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/KPIEntity"
        included:
          $ref: "#/components/schemas/KPIEntityIncluded"
    KPIEntityListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: The list of KPIs
          type: array
          items:
            $ref: "#/components/schemas/KPIEntity"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/KPIEntityIncluded"
    #
