          required:
            - firstName
            - lastName
            - businessRole
            - emails
            - phones
            - associatedCompaniesCount
          properties:
            code:
              description: General name/code of the contact.
              type: string
            username:
              description: |
                The user name of the contact if it is a user profile, `null` otherwise.
              type: string
            firstName:
              description: The first name of the contact.
              type: string
            lastName:
              description: The last name of the contact.
              type: string
            businessRole:
              description: Business role of the contact.
              type: string
            contactTypeId:
              description: |
                Contact type id if the type is `Contact`, `null` otherwise. See dictionary `ContactType`.
              type: string
            emails:
              description: List of emails for this contact. The main email is the one with `sequenceNum = 0`.
              type: array
              items:
                $ref: "#/components/schemas/Email"
              default: []
            phones:
              description: List of phones for this contact. The main phone is the one with `sequenceNum = 0`.
              type: array
              items:
                $ref: "#/components/schemas/Phone"
              default: []
            companyName:
              description: The name of the company associated.
              type: string
            associatedCompaniesCount:
              description: The number of companies associated with the contact or the user profile.
              type: integer
              minimum: 0
              default: 0
