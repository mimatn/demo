openapi: 3.0.3
info:
  title: onSales Next Core API
  version: "-"
  description: |-
    Core APIs for main entities used in different applications.
    Other APIs may depend on objects declared in this specification.
tags:
  # Keep the tag list sorted alphabetically, thanks.
  # Tag descriptions must be copied to openapi.yaml

  - name: Accounting Period
    description: Accounting Period.

  - name: App
    description: Applications of the onSales Next suite.

  - name: App Event
    description: |
      Log application events of an object (e.g. SFA app created document at…, contact X was created by VAN app at…).
      The table logs high-level events, it should not be thought of as a detailed application log

  - name: Country
    description: Countries of the onSales Next suite

  - name: Currency
    description: Currencies of the onSales Next suite.

  - name: Custom View
    description: |
      Represents the concept of "custom view" of a page that includes a table. The custom view represents the configuration
      of the columns to display, the order in which they should appear, and the filters applied. 
      The user can save this settings as a "custom view" and assign them a name. Custom views can be both private or shared
      with other users.

  - name: Dictionary
    description: |
      A general Dictionary is a list of code-description pairs, where the description is in a specific language.

      Dictionaries are very useful in a UI when only a list of choices has to be shown to the user 
      and the description is usually sufficient for the user to chose the desired options.

  - name: Email Verification
    description: APIs for email verification.

  - name: Entity Attribute
    description: |
      Provides APIs to manage attributes in a generic way.

      An `EntityAttribute` is a generic description of an attribute of a generic entity.
      It may refer to a real column in the database or a _virtual_ one and has a `DataType`.
      When describing a virtual attribute, it is also called a _dynamic_ attribute, since it is only known at runtime, not a compile time.

      A `Sheet` is a group of `EntityAttributes`.
      Referring to products, customers, document types, etc. it groups a set of additional attributes of an entity and provides an order.
      It is used for viewing and editing purposes.

      When an `EntityAttribute` is used in a `Sheet`, it is called a `SheetEntityAttribute` and has additional properties that describes it (like editable, mandatory, etc.),
      which are useful to show and modify the value in a user interface.

  - name: Language
    description: Language

  - name: Note
    description: Note

  - name: Organization
    description: The Organization is the higher level that groups the entities managed by the application.

  - name: Permission
    description: |
      Users are granted permissions through the roles assigned to them within the .one system.  
      Permissions control access to APIs and define the available menu items and features for each application.  
      An application permission specifies how a user can interact with a given feature.
      In particular, permissions determine:
        - whether an API service can be invoked;
        - whether a specific operation within an application feature can be performed (e.g., creating a new user in the 
      page listing the users of an organization);
        - whether a specific menu item is visible.

  - name: Privacy Agreement
    description: |
      This functionality allows users to manage privacy agreements, which are legal documents that outline how an 
      organization collects, uses, and protects personal data. It provides a centralized location for storing and 
      managing these agreements, making it easier to ensure compliance with data protection regulations.

      The functionality tracks the status of each privacy agreement, including whether it has been requested, given, 
      refused, or withdrawn. It also allows users to view the details of each agreement, including its code, description, 
      and body.

  - name: Report
    description: |
      The .one reporting engine produces reports from Jasper format templates designed using the JasperSoft Studio tool.
      A report is typically a `PDF` file that is produced and then made available to the user. In addition to the `PDF` format, 
      the engine also allows you to obtain reports in different formats, as `.xlsx`.
      Finally, the `ReportFormatType.DirectPrint` which allows you to define the format defined to printers (typically thermal bar code label and receipt printers etc...)

  - name: Role
    description: |
      User role. Every role is essentially a collection of permissions. 

      Since a user can have one or more roles, then the resulting list of associated permissions is the union of the permissions of all roles.

  - name: Sales Department
    description: Sales department

  - name: Sales Point
    description: SalesPoint

  - name: Tag
    description: |
      Tags can be used to highlight information, making specific entities (e.g. items) easily identifiable within a list or enabling 
      filtering options. They also offer a way to create custom filters when retrieving a list of entities.

  - name: Taxes
    description: Taxes

  - name: Unit Of Measurement
    description: Unit of measurement.

  - name: User Profile
    description: |
      User of the onSales Next system, i.e. a person or machine authorized to perform operations on the solution's Apps.

      Application users are defined at the instance level and therefore do not refer to a specific tenant.

      The UserProfile object defines the personal data of the user, but does not contain its authentication data. 
      The latter are defined in the systems delegated to authentication and are therefore stored externally.

      The authentication request for the user profile is then handled from time to time by the authentication system 
      which checks the credentials in its authentication system and returns the check to onSales Next 
      if the credentials provided are correct.

  - name: Warehouse
    description: Warehouses
components:
  parameters:
    filterOrganization:
      name: "filter[organizationId]"
      in: query
      description: Filter the response by Organization id. The user must also have the permission to view the organization.
      required: false
      style: form
      schema:
        type: string
    filterOrganizationRequired:
      name: "filter[organizationId]"
      in: query
      description: Filter the response by organization. The user must also have the permission to view the organization.
      required: true
      style: form
      schema:
        type: string
    functionModuleRequired:
      name: "filter[functionModuleId]"
      in: query
      description: Filter the response by function module id.
      required: true
      style: form
      schema:
        type: string
    templateIdParamRequired:
      name: "templateId"
      in: query
      description: The template module id.
      required: true
      style: form
      schema:
        type: string
    filterDynamic:
      name: "filter[dynamic]"
      in: query
      description: |
        A dynamic filter parameter used to specify filtering criteria for multiple fields.
        The parameter should be serialized as a string containing key-value pairs separated by ';'. 
        Each key-value pair should be formatted as follows: "key;value". Multiple key-value pairs can be separated by ';'.
        If a value contains the symbol ';', it should be escaped with a backslash ('\') in order not to be parsed as a separator.
      example: "languagesOnPackage;in:it-IT,en-EN;certificationBio;eq:true;"
      style: form
      schema:
        type: string
    EntityIdParameter:
      name: entityId
      description: The name of an entity.
      in: path
      required: true
      schema:
        type: string
    EntityObjectIdParameter:
      name: entityObjectId
      description: The identifier of an object defined in the entity `entityId`.
      in: path
      required: true
      schema:
        type: string
    utcOffset:
      name: "utcOffset"
      description: |
        The UTC offset (or time offset) is an amount of time subtracted from or added to Coordinated Universal Time (UTC) time 
        to specify the local solar time.
      in: query
      required: true
      schema:
        type: integer
        default: 1
    LinkedUserProfileId:
      description: |
        The id of the user profile to use to determine if a customer, supplier or a sales agent is associated with a 
        user. It is necessary because it can happen that an administrator, or in general a user with high privileges,
        modifies the information of another user.
      name: linkedUserProfileId
      in: query
      schema:
        type: string
    tagId:
      name: tagId
      in: path
      description: The identifier of a `Tag` resource.
      required: true
      schema:
        type: string
  schemas:
    #
    # Common attributes
    #
    isDraft:
      description: True if this is a draft, false otherwise (published entity).
      readOnly: true
      type: boolean
    lastChangeTs:
      description: |
        A date-time representing the last time a resource has been modified. This attribute is managed by the server.
        If the client passes a value in un update operation, it is ignored. Instead the server will set it as "now".

        _Format_: A date-time value in ISO format, in UTC timezone, formatted like YYYY-MM-DDThh:mm:ss.sZ; 
        see [Specification > DataTypes](https://swagger.io/specification/#data-types)
      readOnly: true
      type: string
      format: date-time
      example: "2022-02-25T14:10:00.0Z"
    IsActiveFilter:
      description: Filter the response by the active status. If not present, only active reps are returned.
      type: string
    #
    # Resources
    #
    SimpleEntity:
      description: |
        This object provide a short and common representation of an entity when all you need is code and description,
        usually used for a complex attribute referencing a Dictionary, to directly expose the description.

        In this case, the "code" and "descr" properties must be only considered when reading the resource (in GET methods); 
        the operations that modify the main resource (POST/PATCH) will assume that the entity pointed by the provided id already exists
        and ignore the other attributes.
      type: object
      required:
        - entityName
        - id
      properties:
        entityName:
          description: Entity id.
          type: string
          example: "CustomerType"
        id:
          description: Entity object id.
          type: string
          example: "CustomerType.BillTo"
        code:
          description: Entity object code.
          readOnly: true
          type: string
        descr:
          description: Entity object description.
          readOnly: true
          type: string
          example: "'Bill to' customer"
    SimpleEntityListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: List of SimpleEntity.
          type: array
          items:
            $ref: "#/components/schemas/SimpleEntity"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
    IdCodePair:
      description: |
        This object provide a short and common representation of a denormalized entity when all you need is id and code.
        Usually used for operations where the id of some foreign keys is stored along with the correspondent code.
        Id-code match is delegated to the client and cannot be guaranteed by the server.
      type: object
      required:
        - id
        - code
      properties:
        id:
          description: Entity object id
          type: string
          example: "CustomerType.BillTo"
        code:
          description: Entity object code
          type: string
    RecurrenceType:
      description: Recurrence type i.e. of an event, an inspection etc. See dictionary `RecurrenceType`.
      type: string
      enum:
        - RecurrenceType.None
        - RecurrenceType.Daily
        - RecurrenceType.Weekly
        - RecurrenceType.Monthly
        - RecurrenceType.Yearly
      default: RecurrenceType.None
    TagsOperation:
      description: |
        An enum that describes the possible operation that can be used when managing tags.
        A set of tags can be:
        * Added - the set of tags is added to the existing ones (if not present);
        * Replaced - the set of tags replace existing ones. Equivalent to remove all tags and add tags;
        * Removed - the tags contained in the set are removed (if present);
        * Removed all - All the tags are removed.
      type: string
      enum:
        - ADD
        - REPLACE
        - REMOVE
        - REMOVE_ALL
    ExternalService:
      description: |
        Specifies an external service that the system can interact with, such as third-party integrations or 
        external APIs.
      type: string
      enum:
        - ExternalService.Qlik
    Tags:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
            description: Tag id to link to the entity.
          uniqueItems: true
    SimpleEntityReadOnly:
      description: A special SimpleEntity type which is read-only.
      type: object
      readOnly: true
      required:
        - entityName
        - id
        - descr
      properties:
        entityName:
          description: Entity id
          type: string
          example: "CustomerType"
          readOnly: true
        id:
          description: Entity object id
          type: string
          example: "CustomerType.BillTo"
          readOnly: true
        code:
          description: Entity object code
          type: string
          readOnly: true
        descr:
          description: Entity object description
          type: string
          example: "'Bill to' customer"
          readOnly: true
    UserProfileSimple:
      description: |
        This object provide a short and common representation of UserProfile table when all you need are main attributes like:
        id, username, firstname and lastname.

        Used in Hierarchy API to represent the node accountable user.
      type: object
      required:
        - id
        - userName
        - firstName
        - lastName
      properties:
        id:
          description: User Profile id.
          type: string
        userName:
          description: User Profile username.
          type: string
        firstName:
          description: User Profile first name.
          type: string
        lastName:
          description: User Profile last name.
          type: string
    UserProfileSignUp:
      description: UserProfileSignUp resource.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "UserProfileSignUp"
        id:
          type: string
        attributes:
          type: object
          required:
            - firstName
            - lastName
            - username
            - emailAddress
            - code
            - taxNumber
            - privacyAgreements
          properties:
            firstName:
              type: string
              description: The first name of the user.
            lastName:
              type: string
              description: The last name of the user.
            descr:
              type: string
              description: Additional description about the user.
            username:
              type: string
              description: The username to be assigned to the user.
            emailAddress:
              type: string
              description: The email address of the user.
              example: "mario.rossi@domain.it"
            phoneNumber:
              description: The phone number of the user.
              type: string
              example: "+3904226184"
            code:
              type: string
              description: A unique customer code associated with the user registration.
            taxNumber:
              type: string
              description: The tax number of the user.
            requestTs:
              description: Timestamp of the user registration request.
              type: string
              format: date-time
              readOnly: true
              example: "2026-02-20T10:00:00.0Z"
            registrationModeId:
              $ref: "#/components/schemas/UserRegistrationMode"
            registrationStatusId:
              $ref: "#/components/schemas/UserRegistrationStatus"
            registrationStatusTs:
              description: Timestamp of the last update to the registration status.
              type: string
              format: date-time
              readOnly: true
              example: "2026-02-25T14:10:00.0Z"
            authProfileCode:
              type: string
              description: Identity provider profile code used for authentication.
              readOnly: true
            privacyAgreements:
              type: array
              items:
                type: object
                required:
                  - privacyAgreementId
                  - status
                properties:
                  privacyAgreementId:
                    type: string
                    description: The privacy agreement id.
                  status:
                    $ref: "#/components/schemas/PrivacyPurposeStatus"
        relationships:
          type: object
          description: Relationships to other entities.
          required:
            - marketplace
            - app
          properties:
            marketplace:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            app:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            preferredLanguage:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            linkedUserProfile:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneReadOnly"
            linkedParty:
              $ref: "./jsonapi.yaml#/components/schemas/relToOnePartyReadOnly"
    UserProfileSignUpIncluded:
      description: Related entities.
      type: array
      items:
        type: object
      uniqueItems: true
    UserProfileSignUpRequest:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/UserProfileSignUp"
    UserProfileSignUpResponse:
      description: Single UserProfileSignUp response.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/UserProfileSignUp"
        included:
          $ref: "#/components/schemas/UserProfileSignUpIncluded"
    UserProfileSignUpListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: List of UserRegistration requests.
          type: array
          items:
            $ref: "#/components/schemas/UserProfileSignUp"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/UserProfileSignUpIncluded"
    Action:
      description: The action that can be done on the entity to perform the operations.
      type: string
      enum:
        - View
        - Modify
        - Delete
        - Edit
        - Publish
      example: "Delete"
    Operation:
      type: object
      required:
        - action
      properties:
        action:
          $ref: "#/components/schemas/Action"
        url:
          description: The url to be called to perform the operation.
          type: string
    UserRegistrationMode:
      description: |
        Possible modes for user registration. This is set by the marketplace configuration.

        Accepted values:
        - `UserRegistrationMode.Direct`: Users are registered directly without approval.
        - `UserRegistrationMode.Approve`: Users require approval before being registered.
      type: string
      readOnly: true
      enum:
        - UserRegistrationMode.Direct
        - UserRegistrationMode.Approve
    UserRegistrationStatus:
      description: |
        Possible statuses for user registration. See dictionary `UserRegistrationStatus`.

        Accepted values:
        - `UserRegistrationStatus.UserRegistrationStatusSubmitted`: The registration request has been submitted successfully.
        - `UserRegistrationStatus.EmailVerificationRequired`: The user needs to verify their email address.
        - `UserRegistrationStatus.EmailVerified`: The user's email address has been verified.
        - `UserRegistrationStatus.PendingApproval`: The registration request is pending approval.
        - `UserRegistrationStatus.Approved`: The registration request has been approved.
        - `UserRegistrationStatus.Rejected`: The registration request has been rejected.
      type: string
      readOnly: true
      enum:
        - UserRegistrationStatus.Submitted
        - UserRegistrationStatus.EmailVerificationRequired
        - UserRegistrationStatus.EmailVerified
        - UserRegistrationStatus.PendingApproval
        - UserRegistrationStatus.Approved
        - UserRegistrationStatus.Rejected
    Operations:
      description: Operations that can be done on the entity.
      type: array
      items:
        $ref: "#/components/schemas/Operation"
    Address:
      description: Address resource.
      type: object
      required:
        - id
        - sequenceNum
        - addressTypeId
        - address
        - postalCode
        - city
        - countryId
      properties:
        id:
          type: string
        code:
          description: An optional code for this address (can be an ERP assigned code).
          type: string
        descr:
          description: An optional description for this address.
          type: string
        sequenceNum:
          description: The sequence number in a list of addresses. The one with sequenceNum=0 is the default one.
          type: integer
        addressTypeId:
          description: The type of the address. See dictionary "AddressType".
          type: string
          example: "BillTo"
        address:
          description: The address.
          type: string
          example: "Via Alessandro Volta"
        streetNumber:
          description: The street number.
          type: string
          example: "2/3"
        postalCode:
          description: The postal code.
          type: string
          example: "31020"
        city:
          description: The city.
          type: string
          example: "Villorba"
        provinceId:
          description: The id of the province. See dictionary `Province`.
          type: string
          example: "TV"
        regionId:
          description: The id of the region. See dictionary `Region`.
          type: string
          example: "Veneto"
        countryId:
          description: The id of the country. See dictionary `Country`.
          type: string
          example: "IT"
        latitude:
          description: The latitude of this address in decimal degrees.
          type: number
          format: double
          example: 45.7261575
        longitude:
          description: The longitude of this address in decimal degrees.
          type: number
          format: double
          example: 12.2529376
        placeId:
          description: PlaceID code returned from the Google geocoding API.
          type: string
          example: "GhIJHFpkO9_cRkARPQrXo3CBKEA"
        formattedAddress:
          description: |
            (readonly) The address formatted for the country, for the supported layouts. 
            Map key=AddressLayoutType value=formattedAddress.
            Default value for key: "AddressLayoutType.Default".
            See dictionary "AddressLayoutType" for other possible values.
          type: object
          additionalProperties:
            type: string
          example:
            AddressLayoutType.Default: "Via Alessandro Volta, 2, 31020 VILLORBA TV, Italia"
    Email:
      description: Email resource
      type: object
      required:
        - id
        - emailTypeId
        - emailAddress
        - sequenceNum
      properties:
        id:
          type: string
        emailTypeId:
          description: The type of the email. See dictionary "EmailType".
          type: string
          example: "Work"
        code:
          description: An optional code for this email address (can be an ERP assigned code).
          type: string
        emailAddress:
          description: The email address.
          type: string
          example: "mario.rossi@domain.it"
          #pattern: "^[\\w-.]+@([\\w-]+\\.)+[\\w-]{2,}$"
        sequenceNum:
          description: The sequence number in a list of email addresses. The one with sequenceNum=0 is the default one.
          type: integer
        emailAuthStatusId:
          description: Used when there is a process to prove that the email is correct (e.g. user must click on a link to confirm it).
          type: string
          pattern: "^(None|AuthenticationRequest)$"
          example: "None"
          readOnly: true
        emailAuthenticationTs:
          description: Date and time when the email has been confirmed by the user.
          allOf:
            - $ref: "./dataTypes.yaml#/components/schemas/apiDateTime"
    Phone:
      description: Phone resource.
      required:
        - type
        - id
        - phoneTypeId
        - phoneNumber
        - sequenceNum
      properties:
        id:
          type: string
        phoneTypeId:
          description: The type of the phone. See dictionary PhoneType.
          type: string
          example: "Mobile"
        sequenceNum:
          description: The sequence number in a list of phone numbers. The one with sequenceNum=0 is the default one.
          type: integer
        code:
          description: An optional code for this phone number (can be an ERP assigned code).
          type: string
        phoneNumber:
          description: The phone number
          type: string
          example: "+3904226184"
    #
    # NoteType objects
    #
    NoteType:
      description: Note type
      type: object
      required:
        - type
        - id
        - attributes
      properties:
        type:
          type: string
          default: "NoteType"
        id:
          type: string
        attributes:
          type: object
          required:
            - descr
            - editable
            - entityName
          properties:
            descr:
              description: Description of the note.
              type: string
            defaultText:
              description: The default text of this note or null if it doesn't have it.
              type: string
            editable:
              description: if the note can be changed by the user or not.
              type: boolean
            entityName:
              description: Entity id.
              type: string
              example: "Customer"
    NoteTypeResponse:
      description: Single NoteType.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/NoteType"
    NoteTypeListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: The list of NoteTypes.
          type: array
          items:
            $ref: "#/components/schemas/NoteType"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
    NoteTypeRequest:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/NoteType"
    #
    # Note objects
    #
    Note:
      description: Note resource.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "Note"
        id:
          type: string
        attributes:
          type: object
          required:
            - sequenceNum
            - text
          properties:
            sequenceNum:
              description: |
                The sequence number in a list of addresses. The one with sequenceNum=0 is the default one.
                In a create operation, if the `sequenceNum` is set to `-1` then it is calculated by the server.
              type: integer
              minimum: -1
            text:
              description: The text of the note
              type: string
            editable:
              description: (readonly) If the note is editable or not, based on the the same attribute of NoteType.
        relationships:
          type: object
          required:
            - noteType
          properties:
            noteType:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
          uniqueItems: true
    NoteIncluded:
      description: Related NoteType.
      type: array
      items:
        $ref: "#/components/schemas/NoteType"
      uniqueItems: true
    NoteResponse:
      description: Single Note
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Note"
        included:
          $ref: "#/components/schemas/NoteIncluded"
    NoteListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: The list of Notes.
          type: array
          items:
            $ref: "#/components/schemas/Note"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/NoteIncluded"
    NoteRequest:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Note"
    #
    # Permission objects
    #
    Permission:
      description: Permission resource.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "Permission"
        id:
          type: string
        attributes:
          type: object
          required:
            - permissionTypeId
            - permissionGroupId
            - permissionObject
            - descr
            - sequenceNum
            - standardPermission
          properties:
            permissionTypeId:
              description: |
                The type of the permission. Can be one of:
                * `PermissionType.API`;
                * `PermissionType.Menu`.
                For more details see dictionary `PermissionType`.
              type: string
              pattern: "^(PermissionType.API|PermissionType.Menu)$"
            permissionGroupId:
              description: |
                Belonging group. When the permission type is `API` it refers to the service or group of services of a given resource. Otherwise, when the permission type
                is `Menu`, it indicates the menu or group of menus of a given App. See dictionary `PermissionGroup`
              type: string
            permissionObject:
              description: |
                The object to which the permission refers. When the permission type is `API` it is the service's name (e.g. `getApp`), while when the permission type is
                `Menu` it refers to the menu item.
              type: string
            descr:
              description: Permission description.
              type: string
            sequenceNum:
              description: Sequence number. Used to sort the lists of permissions.
              type: integer
            standardPermission:
              description: True if the permission is standard and it can not be edited, false if the permission refers to a custom service or menu item.
              type: boolean
              default: true
        relationships:
          type: object
          description: A Permission can refer to an application.
          properties:
            app:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
    PermissionIncluded:
      description: Related application.
      type: array
      items:
        $ref: "./core.yaml#/components/schemas/App"
      uniqueItems: true
