            completionTs:
              $ref: "./dataTypes.yaml#/components/schemas/apiDateTimeReadOnly"
            jobStatusId:
              $ref: "./jobs.yaml#/components/schemas/JobStatus"
              readOnly: true
            resultMessage:
              description: Result message.
              type: string
              readOnly: true
            reportData:
              description: Report data in JSON format.
              type: string
            outputPath:
              description: Report output path.
              type: string
              format: uri-reference
              readOnly: true
            confirmationUrl:
              description: Confirmation URL.
              type: string
              format: uri-reference
              readOnly: true
            confirmationTs:
              $ref: "./dataTypes.yaml#/components/schemas/apiDateTimeReadOnly"
            digitalContentDescr:
              description: Digital content description.
              type: string
        relationships:
          type: object
          description: Relationship of a report queue entry.
          required:
            - organization
            - reportTemplate
          properties:
            userProfile:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneReadOnly"
            organization:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            digitalContent:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneReadOnly"
            reportTemplate:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
    ReportQueueEntryIncluded:
      description: Related user profile, organization, digital content and report template.
      type: array
      items:
        type: object
      uniqueItems: true
    ReportQueueEntryResponse:
      description: Single Report Queue response.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/ReportQueueEntry"
        included:
          $ref: "#/components/schemas/ReportQueueEntryIncluded"
    ReportQueueEntryRequest:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/ReportQueueEntry"
    ReportTemplateLite:
      description: Represents a report template with basic information only.
      type: object
