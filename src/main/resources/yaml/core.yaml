    #
    # CustomView resource
    #
    CustomViewAttributes:
      description: |
        Custom View attributes. This model does not include configuration data. To obtain the configuration detail
        retrieve the specific custom view.
      type: object
      required:
        - descr
        - public
      properties:
        descr:
          description: The name/description assigned to the custom view.
          type: string
        public:
          description: |
            True if the custom view is shared with other users, false if it is private and therefore usable 
            by the owner only.
          type: boolean
          default: false
    CustomViewRelationships:
      description: The relationships of the CustomView.
      type: object
      required:
        - organization
        - functionModule
        - ownerUserProfile
      properties:
        organization:
          $ref: "./jsonapi.yaml#/components/schemas/relToOne"
        functionModule:
          $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
        ownerUserProfile:
          $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
      uniqueItems: true
    CustomView:
      description: |
        Custom view of a page including a table. Users can save in a custom view the columns to display, their order and 
        the filters to apply in order to display desired data. This model does not include configuration details.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "CustomView"
        id:
          description: CustomView id. Uniquely identifies user's customization settings for a view.
          type: string
        attributes:
          $ref: "#/components/schemas/CustomViewAttributes"
        relationships:
          $ref: "#/components/schemas/CustomViewRelationships"
    CustomViewDetailed:
      description: |
        Custom view of a page including a table. Users can save in a custom view the columns to display, their order and 
        the filters to apply in order to display desired data. This model includes configuration details.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "CustomViewDetailed"
        id:
          description: CustomView id. Uniquely identifies user's customization settings for a view.
          type: string
        attributes:
          allOf:
            - $ref: "#/components/schemas/CustomViewAttributes"
            - description: Configuration data
              type: object
              required:
                - data
              properties:
                data:
                  description: Configuration details in JSON format.
                  type: string
        relationships:
          $ref: "#/components/schemas/CustomViewRelationships"
    CustomViewIncluded:
      description: Related organization, function module and owner user profile.
      type: array
      items:
        type: object
      uniqueItems: true
    CustomViewDetailedResponse:
      description: Single custom view response including configuration details.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/CustomViewDetailed"
        included:
          $ref: "#/components/schemas/CustomViewIncluded"
    CustomViewListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: List of CustomViews (without configuration details).
          type: array
          items:
            $ref: "#/components/schemas/CustomView"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/CustomViewIncluded"
    CustomViewRequest:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/CustomViewDetailed"
