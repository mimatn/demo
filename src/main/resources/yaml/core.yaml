  /user-profile-stats:
    parameters:
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: Returns the statistics configured for the current user profile.
      operationId: listUserProfileStats
      tags:
        - User Profile
      x-authorities:
        - apiUser
      parameters:
        - name: "filter"
          in: query
          description: Filter group.
          required: true
          style: deepObject
          schema:
            type: object
            properties:
              statsTargetLocationId:
                description: Filter by the target location of the statistic.
                type: string
              appId:
                description: Filter the response by app id.
                type: string
      responses:
        "200":
          description: Statistics configurations list response.
          content:
            application/vnd.api+json:
              schema:
                description: A list of statistics configurations set up by the current user.
                type: object
                required:
                  - data
                properties:
                  data:
                    description: A list of statistics ids.
                    type: array
                    items:
                      type: object
                      properties:
                        statId:
                          description: The ID of the statistic.
                          type: string
                        appId:
                          description: The ID of the app.
                          type: string
                        showAsTable:
                          description: True if the statistic is shown in a table; False if show in graph.
                          type: boolean
                          default: false
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    patch:
      description: |
        Manage statistics configurations for the current user. Existing configuration 
        will be entirely replaced with the new one. The order of the statistics in the list will be used to
        determine the sequence number of the statistics and so the order in which they will be displayed. 

        An empty list will result in the removal of all statistics from the user profile.

        Only the subset of statistics filtered by `statTargetLocationId` will be updated by this operation.

      operationId: configureStatsForUserProfile
      tags:
        - User Profile
      x-authorities:
        - apiUser
      requestBody:
        description: Statistics to configure for the current user profile.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/UserProfileStatsConfigRequest"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#crud-updating-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/UserProfileStatsConfigResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /user-profile-stats/{statId}:
    parameters:
      - name: statId
        in: path
        description: The id of the statistic to remove from the user profile.
        required: true
        schema:
          type: string
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    patch:
      description: |
        Update the view mode of a specific statistic configured for the current user profile.
      operationId: updateStatViewMode
      tags:
        - User Profile
      requestBody:
        description: View mode to set for the statistic.
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: object
                  required:
                    - statTargetLocationId
                    - showAsTable
                  properties:
                    statTargetLocationId:
                      $ref: "./stats.yaml#/components/schemas/StatTargetLocation"
                    showAsTable:
                      description: If true the statistic will be shown as table, otherwise as chart.
                      type: boolean
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#crud-updating-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/UserProfileStatsConfigResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
