          properties:
            code:
              description: General code/name of the sales department.
              type: string
            descr:
              description: Sales department description.
              type: string
        relationships:
          type: object
          description: The relationships of a Sales department.
          properties:
            tax:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            supplier:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
    SalesDepartmentIncluded:
      description: Related tax and supplier.
      type: array
      items:
        type: object
      uniqueItems: true
    SalesDepartmentListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: List of SalesDepartment.
          type: array
          items:
            $ref: "#/components/schemas/SalesDepartment"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/SalesDepartmentIncluded"
    #
    # ChangeDraftItemOwnershipRequest
    #
    ChangeDraftEntityOwnershipRequest:
      description: The new owner to assign to the current entity draft.
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - userProfileId
            - propagateToDraftOwner
          properties:
            userProfileId:
              description: New current draft user profile id.
              type: string
            propagateToDraftOwner:
              description: |
                If true the user identified by `userProfileId` also becomes `draftOwnerUserProfile`, 
                otherwise only `currentDraftUserProfile` is updated.
              type: boolean
              default: false
    BulkUpdateDataRequest:
      description: Request that contains the attributes mapped by the user.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/BulkUpdateData"
    BulkUpdateData:
      description: Attributes mapped by the user.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "BulkUpdateData"
        id:
          type: string
          default: ""
        attributes:
          type: object
          required:
            - entityAttributes
          properties:
            entityAttributes:
              description: |
                Ordered list according to the columns provided in the excel.
                The list contains the entity attributes ids chosen by the user during the mapping phase.
                If the user ignored a column and therefore ignored a mapping, then the corresponding element in the array will be an empty string.
              type: array
              items:
                type: string
    BulkUpdateDataImportInfo:
      description: An object that summarizes the data upload operation for a bulk update.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "BulkUpdateDataImportInfo"
        id:
          type: string
          default: ""
        attributes:
          type: object
          required:
            - digitalContentId
            - columns
            - eligibleEntityAttributes
          properties:
            digitalContentId:
              description: The digital content id of the Excel provided by the user.
              type: string
            columns:
              description: The columns of the Excel file
              type: array
              items:
                type: object
                properties:
                  label:
                    description: The label automatically assigned to the column in the Excel file.
                    type: string
                    example: "A"
                  mappedAttribute:
                    description: The entity attribute corresponding to the column.
                    type: string
            eligibleEntityAttributes:
              description: Eligible attributes to be updated based on the user's role and the customer type.
              type: array
              items:
                $ref: "#/components/schemas/SimpleEntity"
    BulkUpdateDataImportInfoResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/BulkUpdateDataImportInfo"
    PrivacyPurposeStatus:
      description: Privacy agreement status. See dictionary `PrivacyPurposeStatus`.
      type: string
      enum:
        - PrivacyPurposeStatus.NotRequested
        - PrivacyPurposeStatus.Requested
        - PrivacyPurposeStatus.Given
        - PrivacyPurposeStatus.Refused
        - PrivacyPurposeStatus.Withdrawn
      default: PrivacyPurposeStatus.NotRequested
    PrivacyAgreement:
      description: Privacy agreement resource.
      type: object
      properties:
        type:
          type: string
          default: "PrivacyAgreement"
        id:
          type: string
        attributes:
          type: object
          properties:
            code:
              description: Privacy agreement code.
              type: string
              readOnly: true
            descr:
              description: Privacy agreement description.
              type: string
              readOnly: true
            body:
              description: Privacy agreement body.
              type: string
              readOnly: true
            isMandatory:
              description: Indicates if the privacy agreement is mandatory.
              type: boolean
              default: false
              readOnly: true
            status:
              $ref: "#/components/schemas/PrivacyPurposeStatus"
            lastChangeTs:
              description: Last change timestamp of the privacy agreement.
              readOnly: true
              type: string
              format: date-time
    PrivacyAgreementListResponse:
      type: object
      properties:
        data:
          description: List of privacy agreements.
          type: array
          items:
            $ref: "#/components/schemas/PrivacyAgreement"
    PrivacyAgreementUpdateData:
      description: Privacy agreement resource.
      type: object
      required:
        - type
        - id
        - attributes
      properties:
        type:
          type: string
          default: "PrivacyAgreementUpdateData"
        id:
          type: string
        attributes:
          type: object
          required:
            - privacyAgreementId
            - status
          properties:
            privacyAgreementId:
              type: string
              description: The privacy agreement id.
            status:
              $ref: "#/components/schemas/PrivacyPurposeStatus"
    PrivacyAgreementsStatusRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PrivacyAgreementUpdateData"
    PartyTask:
      description: Party task resource.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "Task"
        id:
          type: string
        attributes:
          $ref: "./tasks.yaml#/components/schemas/TaskAttributes"
        relationships:
          $ref: "./tasks.yaml#/components/schemas/TaskRelationships"
    PartyTaskListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: List of Tasks
          type: array
          items:
            $ref: "./core.yaml#/components/schemas/PartyTask"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "./tasks.yaml#/components/schemas/TaskIncluded"
    DictEntityData:
      type: object
      required:
        - entityId
        - entityDescr
        - values
      properties:
        entityId:
          type: string
          description: Entity id
        entityDescr:
          type: string
          description: Entity description
        values:
          type: array
          description: List of values for the entity
          items:
            # Define the structure of a value here
            type: object
            properties:
              # Example properties
              code:
                type: string
              descr:
                type: string
    DictEntityDataResponse:
      description: Single DictEntityData response.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/DictEntityData"
    DictEntityDataRequest:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/DictEntityData"
paths:
  #
  # JSON:API definition for UserProfile services
  #
  /user-profiles/{id}/permissions:
    get:
      description: |
        Returns a list of permissions related to this user profile.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | listUserProfilePermissions |
      operationId: listUserProfilePermissions
      tags:
        - User Profile
      x-authorities: ["listUserProfilePermissions"]
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
        - name: "filter"
          in: query
          description: Filter group.
          required: true
          style: deepObject
          schema:
            type: object
            properties:
              s:
                description: Search the given string; searches inside some attributes, as specified in the API documentation, e.g. descr, code, etc.
                type: string
              permissionTypeId:
                description: Filter the response by permission type.
                type: string
              appId:
                description: Filter the response by app.
                type: string
              permissionGroupId:
                description: Filter the response by permission group id.
                type: string
              permissionObject:
                description: Filter the response by permission object.
                type: string
      responses:
        "200":
          description: User profile permissions list response
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/PermissionListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /user-profiles/{id}:
    parameters:
      - name: id
        in: path
        description: The UserProfile id
        required: true
        schema:
          type: string
    get:
      description: |
        Get a UserProfile.
         
        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | getUserProfile |
      operationId: getUserProfile
      tags:
        - User Profile
      x-authorities: ["getUserProfile"]
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "404":
          description: "[Not found](https://jsonapi.org/format/#fetching-resources-responses-404)."
    patch:
      description: |
        [Update](https://jsonapi.org/format/#crud-updating) a UserProfile.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | updateUserProfile |
      operationId: updateUserProfile
      tags:
        - User Profile
      x-authorities: ["updateUserProfile"]
      requestBody:
        description: UserProfile to patch.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/UserProfileRequest"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#crud-updating-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    delete:
      description: |
        [Delete](https://jsonapi.org/format/#crud-deleting) a UserProfile.
         
        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | deleteUserProfile |
      operationId: deleteUserProfile
      tags:
        - User Profile
      x-authorities: ["deleteUserProfile"]
      responses:
        "204":
          description: "[Deleted](https://jsonapi.org/format/#crud-deleting-responses-204)."
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /user-profiles/{id}/contacts:
    get:
      description: |
        Retrieves a list of all contacts and users associated with the clients linked to the authenticated user.
        Each client may have one or more associated contacts or users. The response consolidates these into a single 
        collection for the requesting user.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | getUserProfile |
      operationId: listUserProfileRelatedContacts
      tags:
        - User Profile
      x-authorities:
        - getUserProfile
      parameters:
        - name: id
          in: path
          description: The UserProfile id
          required: true
          schema:
            type: string
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "#/components/parameters/filterOrganizationRequired"
        - name: "filter"
          in: query
          description: Filter group
          required: true
          style: deepObject
          schema:
            type: object
            properties:
              s:
                description: Search the given string; searches inside firstName or lastName attributes.
                type: string
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/UserProfileRelatedContactListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /user-profiles/who-am-i:
    get:
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/marketplace"
      description: Get currently logged UserProfile.
      operationId: whoAmI
      tags:
        - User Profile
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
  /user-profiles:
    get:
      description: |
        Returns a collection of UserProfiles. Supports *include* parameter for relationship "roles"
         
        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | listUserProfiles |
      operationId: listUserProfiles
      tags:
        - User Profile
      x-authorities: ["listUserProfiles"]
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - name: includePrivacyConsents
          in: query
          description: |
            If set to `true`, the response will include the privacy agreement statuses for each user profile.
            Possible values are:
              - `true`
              - `false`
          required: false
          style: form
          schema:
            type: boolean
        - name: "filter[privacyAgreements]"
          in: query
          description: |
            A dynamic filter parameter used to specify filtering criteria for privacy agreements.
            The parameter should be serialized as a string containing key-value pairs separated by ';'. 
            Each key-value pair should be formatted as follows: "key;value". Multiple key-value pairs can be separated 
            by ';'.
            If a value contains the symbol ';', it should be escaped with a backslash ('\') in order not to be parsed 
            as a separator.
          example: |
            PA.1;in:PrivacyPurposeStatus.Refused,PrivacyPurposeStatus.Withdrawn;PA.2;eq:PrivacyPurposeStatus.NotRequested;
          style: form
          schema:
            type: string
        - name: "filter"
          in: query
          description: Filter group
          required: true
          style: deepObject
          schema:
            type: object
            properties:
              s:
                description: Filter the response by `userName`, `firstName`, `lastName`, `descr` attributes.
                type: string
              organizationId:
                description: Filter the response by organization id.
                type: string
              userName:
                description: Filter the response by user name.
                type: string
              appId:
                description: Filter the response by app id.
                type: string
              permissionId:
                description: Filter the response based on the user's permissions.
                type: string
              roleId:
                description: Filter the response based on the user's roles.
                type: string
              lastChange:
                description: Filter the response by when users have been changed the last time.
                type: string
              languageId:
                description: Filter the response by language id.
                type: string
              locked:
                description: Filter the response according to users' locked status.
                type: string
              isLinkedToCustomer:
                description: Filter the response considering if users are associated to a customer.
                type: string
              isLinkedToSupplier:
                description: Filter the response considering if users are associated to a supplier.
                type: string
              isLinkedToSalesRep:
                description: Filter the response considering if users are associated to a sales rep.
                type: string
              identityManagement:
                description: |
                  Including this filter causes the username to be searched in the specified integrated 
                  Identity Management system, not among current users.

                  The sole purpose of this filter is to determine whether the username already exists in the 
                  Identity Management system: the service response will contain a non-empty list if the user 
                  exists (and therefore can't be used for a new user), or an empty list if the user does not exist.

                  If the username is found in the Identity Management system, the element in the list will 
                  have only the mandatory attributes and relationships populated, mostly with synthetic and 
                  not usable data.
                type: string
      responses:
        "200":
          description: UserProfile list response
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/UserProfileListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    post:
      description: |
        Create a UserProfile.
         
        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | createUserProfile |
      operationId: createUserProfile
      tags:
        - User Profile
      x-authorities: ["createUserProfile"]
      requestBody:
        description: UserProfile to post
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/UserProfileRequest"
      responses:
        "201":
          description: "[Created](https://jsonapi.org/format/#crud-creating-responses-201)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /user-profiles/sign-up:
    parameters:
      - $ref: "./jsonapi.yaml#/components/parameters/marketplaceRequired"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    post:
      description: |
        This functionality allows existing customers, who have already placed orders through other channels, to request 
        authenticated access to the B2B portal.
        The request is submitted by providing the core company information required by .one B2B platform owner to 
        uniquely identify the customer within the system.

        To use this functionality, the customer must:

        * be registered in the .one customer master data
        * be published with status ProcessingStatus.Released
        * be enabled for the marketplace the request is placed in

        User authentication may be managed through an available identity management system (e.g. Keycloak).

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | requestUserProfileSignUp |
      operationId: requestUserProfileSignUp
      tags:
        - User Profile
      x-authorities:
        - requestUserProfileSignUp
      requestBody:
        description: UserProfile sign up request
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/UserProfileSignUpRequest"
      responses:
        "201":
          description: "[Created](https://jsonapi.org/format/#crud-creating-responses-201)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/UserProfileSignUpResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /user-registration-requests:
    get:
      description: |
        Returns a list of all user registration requests in the marketplace.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | listUserRegistrationRequests |
      operationId: listUserRegistrationRequests
      tags:
        - User Profile
      x-authorities:
        - listUserRegistrationRequests
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "#/components/parameters/filterOrganizationRequired"
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
        - name: "filter"
          in: query
          description: Filter group
          required: true
          style: deepObject
          schema:
            type: object
            properties:
              s:
                description: Search the given string in firstName, lastName and emailAddress.
                type: string
              requestTs:
                description: Filter the response by requestTs.
                type: string
              registrationStatusId:
                description: Filter by registrationStatusId.
                type: string
              marketplaceId:
                description: Filter by marketplace ID.
                type: string
              linkedPartyId:
                description: Filter the response by linkedPartyId (e.g., customer ID).
                type: string
              registrationModeId:
                description: Filter by registrationModeId.
                type: string
              appId:
                description: Filter by app ID.
                type: string
      responses:
        "200":
          description: User registration requests list.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/UserProfileSignUpListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /user-registration-requests/{id}:
    parameters:
      - name: id
        in: path
        description: The user registration request id.
        required: true
        schema:
          type: string
    get:
      description: |
        Get a user registration request by ID.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | listUserRegistrationRequests |
      operationId: getUserRegistrationRequest
      tags:
        - User Profile
      x-authorities:
        - listUserRegistrationRequests
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/UserProfileSignUpResponse"
        "404":
          description: "[Not found](https://jsonapi.org/format/#fetching-resources-responses-404)"
    patch:
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      description: |
        Approve or reject a user registration request.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | updateUserRegistrationRequestStatus |
      operationId: updateUserRegistrationRequestStatus
      tags:
        - User Profile
      x-authorities:
        - updateUserRegistrationRequestStatus
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  description: Action to perform on the user registration request.
                  enum:
                    - Approve
                    - Reject
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#crud-updating-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/UserProfileSignUpResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /user-profiles/remote-access:
    get:
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      description: |
        Retrieves an impersonation token that can be used with an external resource, configured to collaborate with 
        the system.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | getRemoteAccessToken |
      operationId: getRemoteAccessToken
      tags:
        - User Profile
      x-authorities:
        - getRemoteAccessToken
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  serviceId:
                    $ref: "#/components/schemas/ExternalService"
                  token:
                    type: string
                  creationTs:
                    type: string
                    description: Timestamp of token creation.
                    format: date-time
                    example: "2022-02-25T14:10:00.0Z"
        "404":
          description: Service unknown or not enabled or configured for the user.
  /user-profiles/{id}/reset-password:
    parameters:
      - name: id
        in: path
        description: The userProfile id.
        required: true
        schema:
          type: string
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    patch:
      description: |
        An operator can call this API to request the starting of the process of password reset on the remote 
        authentication service that manages user profile id's authentication.
         
        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | resetUserProfilePassword |
      operationId: resetUserProfilePassword
      tags:
        - User Profile
      x-authorities:
        - resetUserProfilePassword
      responses:
        "202":
          description: Reset password request accepted for processing.
