      - name: id
        in: path
        description: The sheet id
        required: true
        schema:
          type: string
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: |
        Get a Sheet
      operationId: getSheet
      tags:
        - Entity Attribute
      x-authorities:
        - apiUser
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/SheetResponse"
        "404":
          description: "[Not found](https://jsonapi.org/format/#fetching-resources-responses-404)"
    patch:
      description: |
        Updates the sheet specified in the path. This operation assumes that `sheetId` is the id of a cloned sheet.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | updateSheet |
      operationId: updateSheet
      tags:
        - Entity Attribute
      x-authorities:
        - updateSheet
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      requestBody:
        description: An object that contains the data to use to update the specified sheet.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "./entityAttributes.yaml#/components/schemas/UpdateSheetRequest"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#crud-updating-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/SheetResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    delete:
      description: |
        Deletes the sheet specified in the path. This operation will succeed only if the sheet is deletable. When
        `sheetId` refers to a published sheet the sheet and all the ongoing changes on it will be deleted. On the
        other hand, when `sheetId` refers to a cloned sheet only the cloned sheet will be deleted.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | deleteSheet |
      operationId: deleteSheet
      tags:
        - Entity Attribute
      x-authorities:
        - deleteSheet
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      responses:
        "204":
          description: "[Deleted](https://jsonapi.org/format/#crud-deleting-responses-204)"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /sheets:
    get:
      description: |
        Returns a collection of Sheet

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | listSheets |
      operationId: listSheets
      tags:
        - Entity Attribute
      x-authorities:
        - listSheets
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - name: "filter"
          in: query
          description: Filter group
          required: true
          style: deepObject
          schema:
            type: object
            properties:
              s:
                type: string
              entityName:
                description: Name of the referred entity
                type: string
                example: CustomerAccount
              entityAttribute:
                description: |
                  Filters the response considering sheets for which entity attributes are defined. For example, if this
                  filter was `in:Attr.1,Attr.2` only sheets for which `Attr.1` and `Attr.2` are defined would be
                  returned.
                type: string
              organization:
                description: |
                  Filters the response considering sheets linked to the specified organizations. For example, if this
                  filter was `eq:Org.1`, only sheets linked to `Org.1` would be returned.
                type: string
              application:
                description: |
                  Filters the response considering sheets linked to the specified applications. For example, if this
                  filter was `eq:App.1`, only sheets linked to `App.1` would be returned.
                type: string
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      responses:
        "200":
          description: Sheet list response
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/SheetListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    post:
      description: |
        Creates a new sheet.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | createSheet |
      operationId: createSheet
      tags:
        - Entity Attribute
      x-authorities:
        - createSheet
      requestBody:
        description: An object that contains a new sheet.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "./entityAttributes.yaml#/components/schemas/CreateSheetRequest"
      responses:
        "201":
          description: "[Created](https://jsonapi.org/format/#crud-creating-responses-201)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./entityAttributes.yaml#/components/schemas/SheetResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
