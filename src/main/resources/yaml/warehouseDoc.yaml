        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "./documents.yaml#/components/parameters/includeCounters"
        - $ref: "./documents.yaml#/components/parameters/includePackageCounters"
        - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
        - $ref: "#/components/parameters/WarehouseDocHeaderFiltersParameter"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/WarehouseDocHeaderListResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /warehouse-docs/headers-export:
    post:
      description: Requests an export of warehouse document headers.
      operationId: exportWarehouseDocHeaders
      tags:
        - Warehouse Document
      x-authorities:
        - apiUser
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "./core.yaml#/components/parameters/utcOffset"
        - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
        - $ref: "#/components/parameters/WarehouseDocHeaderFiltersParameter"
      responses:
        "202":
          description: Data export request accepted.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/info"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /warehouse-docs/headers/{headerId}/lines:
    parameters:
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      - $ref: "./documents.yaml#/components/parameters/headerId"
    post:
      description: Creates a warehouse document line.
      operationId: createWarehouseDocLines
      tags:
        - Warehouse Document
      x-authorities:
        - apiUser
      requestBody:
        description: The warehouse document line to post.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/WarehouseDocLineRequest"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/WarehouseDocLineListResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    get:
      description: Returns a list of warehouse document lines.
      operationId: listWarehouseDocLine
      tags:
        - Warehouse Document
      x-authorities:
        - apiUser
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "#/components/parameters/WarehouseDocLineFiltersParameter"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/WarehouseDocLineListResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    delete:
      description: Deletes all the lines and line instances of a warehouse document. The header is maintained.
      operationId: deleteWarehouseDocHeaderLines
      tags:
        - Warehouse Document
      x-authorities:
        - apiUser
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /warehouse-docs/headers/{headerId}/line-instances:
    parameters:
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      - $ref: "./documents.yaml#/components/parameters/headerId"
    post:
      description: |
        Creates a list of warehouse document line instances delegating the server the responsibility to create the 
        corresponding warehouse document lines. In particular, the server creates a warehouse document line for 
        each item referred by the line instances.
      operationId: createWarehouseDocLineInstances
      tags:
        - Warehouse Document
      x-authorities:
        - apiUser
      requestBody:
        description: The list of warehouse document line instances to create.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/MultipleWarehouseDocLineInstanceRequest"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/WarehouseDocLineInstanceListResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /warehouse-docs/headers/{headerId}/release:
    parameters:
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      - $ref: "./documents.yaml#/components/parameters/headerId"
    post:
      description: |
        Releases a warehouse document. In particular, it changes its status to `Released` and it generates logistics handling lines.
      operationId: releaseWarehouseDoc
      tags:
        - Warehouse Document
      x-authorities:
        - apiUser
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /warehouse-docs/headers/{headerId}/lines/{lineId}/instances:
    parameters:
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      - $ref: "./documents.yaml#/components/parameters/headerId"
      - name: lineId
        in: path
        description: The warehouse doc line id.
        required: true
        schema:
          $ref: "./jsonapi.yaml#/components/schemas/id"
    post:
      description: Creates a list of warehouse document line instances for an existing line.
      operationId: createWarehouseDocLineInstancesForLine
      tags:
        - Warehouse Document
      x-authorities:
        - apiUser
      requestBody:
        description: The list of warehouse document line instances to create.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/MultipleWarehouseDocLineInstanceRequest"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/WarehouseDocLineInstanceListResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /warehouse-docs/lines:
    parameters:
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: |
        Returns a list of warehouse document lines with their header info included. Lines
        can reference different warehouse document headers.
      operationId: listWarehouseDocLines
      tags:
        - Warehouse Document
      x-authorities:
        - apiUser
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
        - $ref: "#/components/parameters/WarehouseDocLineWithHeaderFiltersParameter"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/WarehouseDocLineWithHeaderListResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    post:
      description: |
        Requests an export of warehouse document lines with their header info included. Lines
        can reference different warehouse document headers.
      operationId: exportWarehouseDocLines
      tags:
        - Warehouse Document
      x-authorities:
        - apiUser
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "./core.yaml#/components/parameters/utcOffset"
        - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
        - $ref: "#/components/parameters/WarehouseDocLineWithHeaderFiltersParameter"
      responses:
        "202":
          description: Data export request accepted.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/info"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /warehouse-docs/headers/{headerId}/inbound:
    parameters:
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      - $ref: "./documents.yaml#/components/parameters/headerId"
    get:
      description: Returns the inbound data for the warehouse document specified in the path.
      operationId: getInboundDataForDocument
      tags:
        - Warehouse Document
      x-authorities:
        - apiUser
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/WarehouseDocHeaderInboundResponse"
        "404":
          description: "[Not found](https://jsonapi.org/format/#fetching-resources-responses-404)."
  /warehouse-docs/draft-skipped/headers/{headerId}/lines/{lineId}:
    parameters:
      - name: headerId
        in: path
        description: A warehouse doc header id.
        required: true
        schema:
          type: string
      - name: lineId
        in: path
        description: A warehouse doc line id.
        required: true
        schema:
          type: string
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    patch:
      description: Updates a warehouse doc line.
      operationId: updateWarehouseDocLineSkipDraft
      tags:
        - Warehouse Document
      x-authorities:
        - apiUser
      requestBody:
        description: The warehouse doc line to patch.
        required: true
        content:
          application/vnd.api+json:
            schema:
              description: The updated warehouse doc line.
              type: object
              required:
                - reason
              properties:
                reason:
                  description: The reason for the update.
                  type: string
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/WarehouseDocLineResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /warehouse-docs/reading/headers/{headerId}/compile:
    parameters:
      - name: headerId
        in: path
        description: A warehouse doc header id.
        required: true
        schema:
          type: string
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    post:
      description: |
        The service updates the reading document with the data present in the reading queue.

        If a package is read, it retrieves the serials of the items or the quantities present in the packages.
        It checks if the serials or item quantities read match the expected documents and updates the quantity values if there is a match.
        If there is no match, new rows are created to identify the unexpected readings.
      operationId: compileWarehouseDocReading
      tags:
        - Warehouse Document
      x-authorities:
        - apiUser
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "./documents.yaml#/components/schemas/CompileReadingDocRequest"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /warehouse-docs/reading/headers:
    parameters:
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    post:
      description: |
        The service is used to create the working document, referred to as the reading document,
        where items, quantities, packages, and serials acquired during the reading will be recorded.

        If the calling identity:
        - If it is a `Checkpoint`: the `UserProfile` is mandatory and the `Checkpoint` is ignored
        - If it is a `Device`: the `UserProfile` is mandatory and the `Device` is ignored
        - If it is a `UserProfile`: the `Checkpoint` or the `Device` is mandatory and the `UserProfile` is ignored
      operationId: createWarehouseDocReading
      tags:
        - Warehouse Document
      x-authorities:
        - apiUser
      requestBody:
        description: The warehouse document to post.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/WarehouseDocReadingRequest"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/WarehouseDocResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /warehouse-docs/draft-skipped/headers/{headerId}/instances:
    parameters:
      - name: headerId
        in: path
        description: A warehouse doc header id.
        required: true
        schema:
          type: string
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    delete:
      description: |
        Deletes all the line instances of the warehouse document specified in the path. This operation will affect
        the quantity of the lines the instances are linked to and those of the lines fulfilled by them.
      operationId: deleteWarehouseDocLineInstancesSkipDraft
      tags:
        - Warehouse Document
      x-authorities:
        - apiUser
      responses:
        "204":
          description: "[Deleted](https://jsonapi.org/format/#crud-deleting-responses-204)."
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /warehouse-docs/reading/headers/{headerId}/release:
    parameters:
      - $ref: "#/components/parameters/WarehouseDocHeaderId"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    post:
      description: |
        This API releases the warehouse document specified in the path when it is used as a reading document.

        Releasing a warehouse reading document consists on these actions:
        * Deletion of all the unexpected lines, serials and packages.
        * Deletion of all the unknown RFID tags.
        * Update of the fulfillment status of the source documents linked to the one provided in the path.
        * Update of the fulfillment status of the source documents' lines linked to the one provided in the path.
        * Change the document's processing status to `Released`.
      operationId: releaseWarehouseDocReading
      tags:
        - Warehouse Document
      x-authorities:
        - apiUser
      requestBody:
        description: An object containing the parameters to consider to release a reading document.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "./documents.yaml#/components/schemas/ReleaseReadingDocRequest"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /warehouse-docs/reading/headers/{headerId}/aggregated-data:
    parameters:
      - $ref: "#/components/parameters/WarehouseDocHeaderId"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: |
        This API retrieves the data of the document identified by `headerId` (reading doc)
        grouped accordingly with the aggregation strategy provided as a parameter. In
        particular, data can be aggregated by: line, package, line and package, serials.

        It is possible to specify filters to narrow down data based on the consumer's
        needs. For each element in the resulting list will be specified a map containing
        the values of the filters needed to consult its detail. For example: each group
        obtained with the `GroupByPackage` aggregation startegy, will have the filtering
        attributes to retrieve the items in a package and the serials in it.
      operationId: getWarehouseDocAggregatedData
      tags:
        - Warehouse Document
      x-authorities:
        - apiUser
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "./documents.yaml#/components/parameters/groupByFulfilledDoc"
        - $ref: "./documents.yaml#/components/parameters/groupByReason"
        - $ref: "./documents.yaml#/components/parameters/groupByOperationReason"
        - $ref: "./documents.yaml#/components/parameters/includeCountersRequired"
        - $ref: "./documents.yaml#/components/parameters/includePackageCountersRequired"
        - $ref: "./documents.yaml#/components/parameters/groupingStrategy"
        - $ref: "./documents.yaml#/components/parameters/GetReadingDocAggregatedDataSorting"
        - $ref: "./documents.yaml#/components/parameters/GetReadingDocAggregatedDataFilters"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "./documents.yaml#/components/schemas/ReadingDocGetAggregatedResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /warehouse-docs/reading/headers/{headerId}/reset:
    parameters:
      - $ref: "#/components/parameters/WarehouseDocHeaderId"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    post:
      description: |
        This API resets the reading document specified in the path. Resetting a document means
        to delete all document's data such that it status is like the one after creation.
      operationId: resetWarehouseDocReading
      tags:
        - Warehouse Document
      x-authorities:
        - apiUser
      requestBody:
        description: An object containing the parameters to reset a reading document.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "./documents.yaml#/components/schemas/ResetReadingDocRequest"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/WarehouseDocResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /warehouse-docs/reading/headers/{headerId}/unexpected-instances:
    parameters:
      - $ref: "#/components/parameters/WarehouseDocHeaderId"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    patch:
      description: |
        This API allows to set document's instances provided in the body from _unexpected_
        to _expected_. Instances in the body can be both packages and serials.
      operationId: setWarehouseDocInstancesAsExpected
      tags:
        - Warehouse Document
      x-authorities:
        - apiUser
      requestBody:
        description: An object containing the document's instances to update.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "./documents.yaml#/components/schemas/UpdateReadingDocInstancesRequest"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /warehouse-docs/reading/headers/{headerId}/expected-instances:
    parameters:
      - $ref: "#/components/parameters/WarehouseDocHeaderId"
