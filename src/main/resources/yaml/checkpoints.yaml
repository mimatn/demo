openapi: 3.0.3
info:
  title: Checkpoints API
  version: "-"
  description: API for Checkpoints (mainly used in onTag applications).
tags:
  - name: Checkpoint
    description: |
      The set of APIs related to checkpoints. A checkpoint is a RFID point of read which is used to detect RFID tags.
      Concretely, it can be a gate or a fixed station.

      In general, several Device-Port pairs correspond to a Checkpoint while, a Device-Port pair uniquely identifies a Checkpoint.
components:
  parameters:
    filterIdUHFReadingStatus:
      name: "filter[processingStatus]"
      in: query
      description: |
        Filter the response by ProcessingStatus. If `ProcessingStatus.All` all the readings are considered.
      required: true
      style: form
      schema:
        type: string
    filterTagAssociationCount:
      name: filter[count]
      in: query
      description: The number of tag association to return.
      required: false
      style: form
      schema:
        type: integer
        default: 30
    filterPeriodStart:
      name: filter[periodStart]
      in: query
      description: A timestamp that represents the lower bound of the period to consider.
      required: true
      style: form
      schema:
        $ref: "./dataTypes.yaml#/components/schemas/apiDateTime"
    filterPeriodEnd:
      name: filter[periodEnd]
      in: query
      description: A timestamp that represents the upper bound of the period to consider.
      required: true
      style: form
      schema:
        $ref: "./dataTypes.yaml#/components/schemas/apiDateTime"
  schemas:
    CheckpointType:
      description: Describes the type of the checkpoint. See `CheckpointType` dictionary for additional information.
      type: string
      enum:
        - CheckpointType.Gate
        - CheckpointType.PDA
    Checkpoint:
      description: A tag reading station composed by a reader and one or more antennas.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          description: A string that describes the type of the object
          type: string
          example: "Checkpoint"
        id:
          description: A string that uniquely identifies a `Checkpoint`.
          type: string
          example: "1"
        attributes:
          $ref: "#/components/schemas/CheckpointAttributes"
        relationships:
          description: An object with all the `Checkpoint`'s relationships.
          type: object
          required:
            - organization
          properties:
            warehouseIn:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            warehouseOut:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            userProfile:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            organization:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
    CheckpointAttributes:
      description: An object with the attributes that describe a `Checkpoint`
      type: object
      required:
        - code
        - descr
        - checkpointTypeId
        - disabled
      properties:
        code:
          description: A code to distinguish the `Checkpoint`
          type: string
          example: "CK-1234"
        descr:
          description: Description of the `Checkpoint`
          type: string
          example: "Receving goods"
        checkpointTypeId:
          $ref: "#/components/schemas/CheckpointType"
        disabled:
          description: A flag that defines whether the `Checkpoint` is usable or not. When `false` the `Checkpoint` can be used.
          type: boolean
          example: false
        latitude:
          description: The latitute coordinate of the `Checkpoint`.
          type: number
          format: double
          example: 45.72555
        longitude:
          description: The longitude coordinate of the `Checkpoint`.
          type: number
          format: double
          example: 12.25285
        tokenExpirationTs:
          $ref: "./dataTypes.yaml#/components/schemas/apiDateTime"
    CheckpointIncluded:
      description: Related entities data of a `Checkpoint`
      type: array
      items:
        type: object
      uniqueItems: true
    UpsertCheckpoint:
      description: An object used to create or update a Checkpoint.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          description: A string that describes the type of the object
          type: string
          default: "UpsertCheckpoint"
        id:
          description: A string that uniquely identify a Checkpoint.
          type: string
          example: "1"
        attributes:
          type: object
          required:
            - code
            - descr
            - checkpointTypeId
            - disabled
          properties:
            code:
              description: The checkpoint's code.
              type: string
              example: "CK-1234"
            descr:
              description: The checkpoint's description.
              type: string
              example: "A checkpoint"
            checkpointTypeId:
              $ref: "#/components/schemas/CheckpointType"
            disabled:
              description: A flag that determines if the checkpoint will be disabled or not
              type: boolean
              example: false
            latitude:
              description: The checkpoint's latitude
              type: number
              format: double
              example: 45.72555
            longitude:
              description: The checkpoint's longitude
              type: number
              format: double
              example: 12.25285
        relationships:
          description: The checkpoint's related entities.
          type: object
          required:
            - organization
          properties:
            organization:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            warehouseIn:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            warehouseOut:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            userProfile:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
    IdentificationUHFReading:
      description: An object that describes a `IdentificationUHFReading`
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          description: A string that describes the type of the object
          type: string
          example: "IdentificationUHFReadings"
        id:
          description: A string that uniquely identifies a `IdentificationUHFReading`.
          type: string
          example: "1"
        attributes:
          $ref: "#/components/schemas/IdentificationUHFReadingAttributes"
        relationships:
          $ref: "#/components/schemas/IdentificationUHFReadingRelationships"
    IdentificationUHFReadingAttributes:
      description: An object with the attributes that describe a `IdentificationUHFReading`
      type: object
      required:
        - epc
        - readingTs
        - networkAddress
        - port
        - rssi
        - processingStatusId
      properties:
        epc:
          description: The EPC code of the RFID tag that was read.
          type: string
          example: "0002 001C 0011 B27A 5138 5A18"
        readingTs:
          $ref: "./dataTypes.yaml#/components/schemas/apiDateTime"
        networkAddress:
          description: The IP of the RFID reader responsible of the reading.
          type: string
          example: "192.168.1.10"
        port:
          description: The port of the antenna connected to the reader.
          type: number
          example: 1
        rssi:
          description: A number that represents the strength of radio frequency signal. The higher the more precise the stronger the signal is.
          type: number
          format: double
          example: -100
        processingStatusId:
          $ref: "./core.yaml#/components/schemas/ProcessingStatus"
        warningMessage:
          description: |
            A message that describes the reason why a tag is not valid. If `null`, then there are no errors.
          type: string
          example: "Tag non presente in anagrafica"
    #
    # IdentificationUHFReadingRelationships
    #
    IdentificationUHFReadingRelationships:
      description: Relationships of an `IdentificationUHFReading`.
      type: object
      properties:
        itemInstance:
          $ref: "./jsonapi.yaml#/components/schemas/relToOne"
        itemStatus:
          $ref: "./jsonapi.yaml#/components/schemas/relToOne"
    IdentificationUHFReadingIncluded:
      description: Related entities data of an `IdentificationUHFReading`
      type: array
      items:
        type: object
      uniqueItems: true
    Power:
      type: string
      enum:
        - HIGH
        - MID
        - LOW
    InIdRequest:
      description: It represents an identification request sent to the system.
      type: object
      required:
        - type
        - id
        - attributes
      properties:
        id:
          description: A string that uniquely identifies an identification request.
          type: string
          example: "1"
        type:
          description: A string that describes the type of the object.
          type: string
          example: "InIdRequest"
        attributes:
          $ref: "#/components/schemas/InIdRequestAttributes"
    InIdRequestAttributes:
      description: The attributes of `InIdRequest`
      type: object
      required:
        - shownCode
      properties:
        shownCode:
          description: An alphanumeric code.
          type: string
          maxLength: 6
          example: "7422K1"
    #
    # Responses
    #
    IdentificationUHFReadingListResponse:
      description: A list of `IdentificationUHFReading` objects
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/IdentificationUHFReading"
        included:
          $ref: "#/components/schemas/IdentificationUHFReadingIncluded"
    CheckpointListResponse:
      description: A list of `Checkpoint` objects
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Checkpoint"
        include:
          $ref: "#/components/schemas/CheckpointIncluded"
    PowerResponse:
      type: object
      required:
        - power
      properties:
        power:
          $ref: "#/components/schemas/Power"
    CheckpointIdentificationResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/InIdRequest"
    #
    # Requests
    #
    IdentificationUHFReadingListRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/IdentificationUHFReading"
    CheckpointRequest:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/UpsertCheckpoint"
    CheckpointResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Checkpoint"
        included:
          $ref: "#/components/schemas/CheckpointIncluded"
paths:
  /checkpoints:
    get:
      description: Retruns a list of `Checkpoint`s.
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - name: "filter"
          in: query
          description: Filter group
          required: true
          style: deepObject
          schema:
            type: object
            properties:
              s:
                type: string
                description: Generic query string applied on the `code` and `descr` attributes.
              disabled:
                description: |
                  - When `true` only **disabled** checkpoints are considered;
                  - When `false` only **enabled** checkpoints are considered; 
                  - If the filter is not provided **both** enabled and disabled checkpoints are considered.
                type: string
                example: false
              userProfileId:
                description: The id of a user who is working on the checkpoint.
                type: string
                example: "1"
              identified:
                description: |
                  - When `true` only **identified** checkpoints are considered;
                  - If `false` only **not registered** checkpoints are considered;
                  - If `null` the filter has no effect.
                type: string
                example: "true"
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      operationId: listCheckpoints
      tags:
        - Checkpoint
      x-authorities:
        - apiUser
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CheckpointListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    post:
      description: Creates a `Checkpoint`.
      operationId: createCheckpoint
      tags:
        - Checkpoint
      x-authorities:
        - apiUser
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/CheckpointRequest"
      responses:
        "201":
          description: "[Created](https://jsonapi.org/format/#crud-creating-responses-201)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CheckpointResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /checkpoints/{id}:
    parameters:
      - name: id
        in: path
        description: The `Checkpoint` id
        required: true
        schema:
          $ref: "./jsonapi.yaml#/components/schemas/id"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: Returns a single `Checkpoint`.
      operationId: getCheckpoint
      tags:
        - Checkpoint
      x-authorities:
        - apiUser
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CheckpointResponse"
        "404":
          description: "[Not found](https://jsonapi.org/format/#fetching-resources-responses-404)"
    patch:
      description: Updates a `Checkpoint`.
      operationId: updateCheckpoint
      tags:
        - Checkpoint
      x-authorities:
        - apiUser
      parameters:
        - name: activationCode
          in: query
          description: An alphanumeric code used to activate the checkpoint.
          schema:
            type: string
            maxLength: 6
            example: "7422K1"
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/CheckpointRequest"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#crud-updating-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CheckpointResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    delete:
      description: Deletes a `Checkpoint`.
      operationId: deleteCheckpoint
      tags:
        - Checkpoint
      x-authorities:
        - apiUser
      responses:
        "204":
          description: "[Deleted](https://jsonapi.org/format/#crud-deleting-responses-204)."
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /checkpoints/{id}/tag-associations:
    parameters:
      - name: id
        in: path
        description: The `Checkpoint` id
        required: true
        schema:
          $ref: "./jsonapi.yaml#/components/schemas/id"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: |
        Returns the last `count` tag associations between `periodStart` and `periodEnd` executed at the given checkpoint.
      operationId: listCheckpointTagAssociations
      tags:
        - Checkpoint
      x-authorities:
        - apiUser
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "#/components/parameters/filterPeriodStart"
        - $ref: "#/components/parameters/filterPeriodEnd"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./items.yaml#/components/schemas/ListItemInstanceResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /checkpoints/{id}/power:
    parameters:
      - name: id
        in: path
        description: The `Checkpoint` id
        required: true
        schema:
          $ref: "./jsonapi.yaml#/components/schemas/id"
    get:
      description: |
        Returns the power of the `Checkpoint`'s read point(s). The power level will be consistent
        across all the read points of the `Checkpoint`.
      operationId: getCheckpointPower
      tags:
        - Checkpoint
      x-authorities:
        - apiUser
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/PowerResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    post:
      description: Sets the read point(s) power level. All the read points will be set with the same power level.
      operationId: setCheckpointPower
      tags:
        - Checkpoint
      x-authorities:
        - apiUser
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/PowerResponse"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /checkpoints/{id}/readings:
    parameters:
      - name: id
        in: path
        description: The `Checkpoint` id
        required: true
        schema:
          $ref: "./jsonapi.yaml#/components/schemas/id"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    post:
      parameters:
        - name: readingsLimit
          description: A value used to limit the readings returned by this API. If no value is issued, the default one is used.
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 0
        - name: filter
          description: Optional parameters that can be used to filter checkpoint's readings.
          in: query
          required: true
          style: deepObject
          schema:
            type: object
            properties:
              processingStatus:
                description: Filters checkpoint's readings by processing status.
                type: string
      description: |
        This API can be used both to consume new checkpoint's readings and to delete them. Consuming new readings is the default behaviour
        of this service; while deleting is triggered whenever a non-empty list of readings ids is issued in the request's body.
        In order to delete without consuming new readings, call this API with a non-empty list in the body and with `readingsLimit = 0`.
      operationId: listAndConsumeCheckpointReadings
      tags:
        - Checkpoint
      x-authorities:
        - apiUser
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              description: A list with the ids of the readings to delete.
              type: array
              items:
                description: The id of a reading to delete.
                type: string
                example: "READING.1"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/IdentificationUHFReadingListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    patch:
      description: Updates the readings of a `Checkpoint` provided in the request body.
      operationId: updateCheckpointReadings
      tags:
        - Checkpoint
      x-authorities:
        - apiUser
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/IdentificationUHFReadingListRequest"
      responses:
        "201":
          description: "[Created](https://jsonapi.org/format/#crud-creating-responses-201)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/IdentificationUHFReadingListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    delete:
      description: Deletes permanently the readings of a `Checkpoint` provided in the request body.
      operationId: deleteCheckpointReadings
      tags:
        - Checkpoint
      x-authorities:
        - apiUser
      requestBody:
        description: The list of the readings' ids to delete.
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: array
              items:
                type: string
              example: ["2", "10"]
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /checkpoints/{id}/reset:
    parameters:
      - name: id
        in: path
        description: The `Checkpoint` id
        required: true
        schema:
          type: string
    delete:
      description: Deletes all the readings of the `Checkpoint` with the provided id.
      operationId: resetCheckpoint
      tags:
        - Checkpoint
      x-authorities:
        - apiUser
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
        "404":
          description: "[Not found](https://jsonapi.org/format/#fetching-resources-responses-404)"
  /checkpoint-identifications:
    post:
      description: Creates an identification request for a checkpoint.
      operationId: createCheckpointIdentification
      tags:
        - Checkpoint
      x-authorities:
        - apiUser
      responses:
        "201":
          description: "[Created](https://jsonapi.org/format/#crud-creating-responses-201)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CheckpointIdentificationResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /checkpoint-identifications/{id}:
    parameters:
      - name: id
        in: path
        description: The identification request id
        required: true
        schema:
          type: string
    get:
      description: Return the status of the identiication request with the provided id.
      operationId: getCheckpointIdentification
      tags:
        - Checkpoint
      x-authorities:
        - apiUser
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          headers:
            X-auth-renewed:
              description: A JWT token returned by the backend once the identification request has been satisfied.
              schema:
                type: string
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CheckpointIdentificationResponse"
        "404":
          description: "[Not found](https://jsonapi.org/format/#fetching-resources-responses-404)"
  /checkpoints/{id}/doc-headers/{headerId}/inbound:
    parameters:
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      - name: id
        in: path
        description: The `Checkpoint` id.
        required: true
        schema:
          type: string
      - name: headerId
        in: path
        description: The id of the inbound's destination document.
        required: true
        schema:
          type: string
    post:
      description: |
        This API does an inbound operation for a checkpoint. In particular:
        1. It consumes a set of RFID readings;
        2. It compiles a destination document based on the items inferred from the readings.

        The response of the API **only** contains inbound data referred to the last acquired readings.
      operationId: doInboundForCheckpointAndDocument
      tags:
        - Checkpoint
      x-authorities:
        - apiUser
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./warehouseDoc.yaml#/components/schemas/WarehouseDocHeaderInboundResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
