    SalesDocLineDiscount:
      description: |
        Cross-entity table that contains the detail of the discounts of the document line. 
        A line can be generated from PriceListDetailDiscount or from DiscountListDetailDiscount.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "SalesDocLineDiscount"
        id:
          description: SalesDocLineDiscount id. Uniquely identifies a discount line.
          type: string
        attributes:
          type: object
          required:
            - entity
            - sequenceNum
            - editable
            - discountAmount
          properties:
            detailDiscountEntity:
              $ref: "./core.yaml#/components/schemas/SimpleEntity"
              description: Related entity. One of PriceListDetailDiscount or DiscountListDetailDiscount.
            discountList:
              $ref: "./core.yaml#/components/schemas/SimpleEntity"
            discountListDetail:
              $ref: "./core.yaml#/components/schemas/SimpleEntity"
            sequenceNum:
              description: Sequence number.
              type: integer
              minimum: 0
            detailDiscountCode:
              description: Optional code or name.
              type: string
            percentageDiscount:
              description: Percentage discount.
              type: number
              format: double
            valueDiscount:
              description: Value discount.
              type: number
              format: double
            editable:
              description: True if editable, false otherwise.
              type: boolean
              default: false
            discountAmount:
              description: Discount amount applied to the line on a percentage basis or unit value.
              type: number
              format: double
            detailDiscountNetPrice:
              description: |
                Net price with the discount applied. Computed as DocLineGrossPrice - ValueDiscount. 
                ValueDiscount is DocLineGrossPrice * PercentageDiscount.
              type: number
              format: double
            discountPriceMin:
              description: Minimum discount price applicable if editable.
              type: number
              format: double
            discountPriceMax:
              description: Maximum discount price applicable if editable.
              type: number
              format: double
            percentageDiscountMin:
              description: Minimum discount price applicable if editable, in percentage.
              type: number
              format: double
            percentageDiscountMax:
              description: Maximum discount price applicable if editable, in percentage.
              type: number
              format: double
        relationships:
          description: |
            The relationships of the SalesDocLineDiscount. 
            A SalesDocLineDiscount refers to sales document line.
          type: object
          required:
            - salesDocLine
          properties:
            salesDocLine:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
          uniqueItems: true
    SalesDocLineDiscountIncluded:
      description: Related sales document line.
      type: array
      items:
        $ref: "#/components/schemas/SalesDocLine"
      uniqueItems: true
