openapi: 3.0.3
info:
  title: Sales Documents API
  version: "-"
  description: APIs for Sales Document.
tags:
  - name: Sales Document
    description: Sales Document.
components:
  schemas:
    #
    # SalesDocHeaderAttributes (extends ./core.yaml#/components/schemas/DocHeaderAttributes)
    #
    SalesDocHeaderAttributes:
      description: |
        Attributes specific of a sales document.
        Properties common in all type of documents are stored in the `DocHeaderAttributes` object.
      type: object
      required:
        - priceListByDeliveryDate
        - billToCustomerAccount
        - billToAddress
        - sellToCustomerAccount
        - sellToAddress
        - deliveryAddress
        - docPaymentCondition
        - customerPaymentCondition
        - taxRegime
        - listGrossAmount
        - listNetAmount
        - netAmount
        - giftAmount
        - taxAmount
        - totalAmount
        - salesCostAmount
        - paymentDiscountAmount
      properties:
        salesRep:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Document customer's agent.
        priceListByDeliveryDate:
          description: True if the reference date to determine the validity of the price list is the delivery date, false otherwise.
          type: boolean
        billToCustomerAccount:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Bill to customer account.
        billToAddress:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Bill to address.
        sellToCustomerAccount:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Sell to customer account.
        sellToAddress:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Sell to address.
        sellToEmail:
          $ref: "./core.yaml#/components/schemas/Email"
        deliveryAddress:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Delivery address.
        warehouse:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Warehouse.
        priceList:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Header Price List (only if price list most is "Header").
        docPaymentCondition:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Document's payment condition.
        customerPaymentCondition:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Customer's payment condition.
        preferredDeliveryDate:
          description: |
            Preferred delivery date. 
            It is a non-binding indication of the customer's preferred delivery date.

            Formatted like `YYYY-MM-DD`; see [Specification > DataTypes](https://swagger.io/specification/#data-types)
          type: string
          format: date
          example: "2022-02-25"
        expectedDeliveryDate:
          description: |
            Expected delivery date.
            It is the date on which the delivery is expected to be made.

            Formatted like `YYYY-MM-DD`; see [Specification > DataTypes](https://swagger.io/specification/#data-types)
          type: string
          format: date
          example: "2022-02-25"
        actualDeliveryDate:
          description: |
            Actual delivery date.
            It is the date on which the delivery was actually made.

            Formatted like `YYYY-MM-DD`; see [Specification > DataTypes](https://swagger.io/specification/#data-types)
          type: string
          format: date
          example: "2022-02-25"
        shippingMode:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Shipping mode. See dictionary `ShippingMode`.
        deliveryMode:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Delivery mode. See dictionary `DeliveryMode`.
        deliveryReason:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Delivery reason. See dictionary `DeliveryReason`.
        customerRefNumber:
          description: Customer's external rif.
          type: string
        customerRefDate:
          $ref: "./dataTypes.yaml#/components/schemas/apiDate"
        courier:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: See dictionary `CourierMode`.
        taxRegime:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Tax regime
        listGrossAmount:
          description: Document amount based on the price list without discounts.
          type: number
        listNetAmount:
          description: Document amount based on the price list net of discounts.
          type: number
        minDocAmount:
          description: Document's min amount to compare to net amount.
          type: number
        netAmount:
          description: Net amount.
          type: number
        giftAmount:
          description: Gift amount.
          type: number
        taxAmount:
          description: Tax amount.
          type: number
        totalAmount:
          description: Total amount.
          type: number
        salesCostAmount:
          description: Sales cost amount.
          type: number
        paymentDiscountAmount:
          description: Payment discount amount.
          type: number
        shippingCostAmount:
          description: Shipping cost amount of the document.
          type: number
          readOnly: true
        fulfillmentStatusId:
          $ref: "./documents.yaml#/components/schemas/FulfillmentStatus"
        deliveryStatusId:
          description: Document delivery status. See dictionary `DeliveryStatus`.
          type: string
        linesCount:
          description: The number of lines the document has.
          type: integer
          minimum: 0
          default: 0
        itemsCount:
          description: |
            The number of items the document has. Even if there is an item for each document's line, this number may
            be different from `linesCount` since duplicates are removed. How to handle duplicates is defined in the
            business logic.
          readOnly: true
          type: integer
          minimum: 0
          default: 0
        variableWeightItemsCount:
          description: The number of items in the current document that have variable weight.
          readOnly: true
          type: integer
          minimum: 0
          default: 0
        netAmountByItemShippingCostGroup:
          description: |
            Net amount grouped by item shipping cost group. 
            The key `withoutShippingCostGroup` is used for items without shipping cost group.
          type: object
          readOnly: true
          additionalProperties:
            type: number
            format: double
          example: |
            ```
              {
                "withoutShippingCostGroup": 3.0,
                "ItemShippingCostGroup.0001": 1.5,
                "ItemShippingCostGroup.0002": 4.5,
                "ItemShippingCostGroup.0003": 1.5
              }
            ```
        totalAmountWithShippingCost:
          description: Total amount with shipping cost.
          type: number
          readOnly: true
    SalesDocHeaderAttributesWithDocHeader:
      allOf:
        - $ref: "#/components/schemas/SalesDocHeaderAttributes"
        - description: DocHeader attributes.
          type: object
          properties:
            docHeaderAttributes:
              $ref: "./documents.yaml#/components/schemas/DocHeaderAttributes"
    SalesDocHeaderAttributesWithDocHeaderLite:
      allOf:
        - $ref: "#/components/schemas/SalesDocHeaderAttributesLite"
        - description: SalesDocHeaderAttributesLite attributes.
          type: object
          required:
            - docHeaderAttributesLite
          properties:
            docHeaderAttributesLite:
              $ref: "./documents.yaml#/components/schemas/DocHeaderAttributesLite"
    #
    # SalesDocHeaderAttributesLite attributes
    #
    SalesDocHeaderAttributesLite:
      description: Subset of the specific attributes of a sales document. Includes all the attributes that can be updated.
      type: object
      required:
        - deliveryAddress
        - docPaymentCondition
      properties:
        deliveryAddress:
          description: Delivery address.
          $ref: "./core.yaml#/components/schemas/IdCodePair"
        warehouse:
          description: Warehouse.
          $ref: "./core.yaml#/components/schemas/IdCodePair"
        docPaymentCondition:
          description: Document's payment condition.
          $ref: "./core.yaml#/components/schemas/IdCodePair"
        preferredDeliveryDate:
          description: |
            Preferred delivery date. 
            It is a non-binding indication of the customer's preferred delivery date.

            Formatted like `YYYY-MM-DD`; see [Specification > DataTypes](https://swagger.io/specification/#data-types)
          type: string
          format: date
          example: "2022-02-25"
        expectedDeliveryDate:
          description: |
            Expected delivery date.
            It is the date on which the delivery is expected to be made.

            Formatted like `YYYY-MM-DD`; see [Specification > DataTypes](https://swagger.io/specification/#data-types)
          type: string
          format: date
          example: "2022-02-25"
        actualDeliveryDate:
          description: |
            Actual delivery date.
            It is the date on which the delivery was actually made.

            Formatted like `YYYY-MM-DD`; see [Specification > DataTypes](https://swagger.io/specification/#data-types)
          type: string
          format: date
          example: "2022-02-25"
        shippingModeId:
          description: Shipping mode. See dictionary `ShippingMode`.
          type: string
        deliveryModeId:
          description: Delivery mode. See dictionary `DeliveryMode`.
          type: string
        customerRefNumber:
          description: Customer's external rif.
          type: string
        customerRefDate:
          $ref: "./dataTypes.yaml#/components/schemas/apiDate"
        courierId:
          description: See dictionary `CourierMode`.
          type: string
        fulfillmentStatusId:
          $ref: "./documents.yaml#/components/schemas/FulfillmentStatus"
        deliveryStatusId:
          description: Document delivery status. See dictionary `DeliveryStatus`
          type: string
    SalesDocHeaderRelationships:
      description: Sales doc header extends DocHeader.
      type: object
      required:
        - docHeader
        - currency
      properties:
        docHeader:
          $ref: "./jsonapi.yaml#/components/schemas/relToOne"
        salesDocHeaderTax:
          $ref: "./jsonapi.yaml#/components/schemas/relToMany"
        currency:
          $ref: "./jsonapi.yaml#/components/schemas/relToOne"
        shippingCosts:
          $ref: "./jsonapi.yaml#/components/schemas/relToManyReadOnly"
    SalesDocHeader:
      description: SalesDocHeader resource, contains information present in a header of a sales document.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "SalesDocHeader"
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/SalesDocHeaderAttributesWithDocHeader"
        relationships:
          description: Attributes of a sales document
          allOf:
            - $ref: "./documents.yaml#/components/schemas/DocHeaderRelationships"
            - $ref: "#/components/schemas/SalesDocHeaderRelationships"
    SalesDocHeaderLite:
      description: SalesDocHeaderLite resource, contains information present in a header of a sales document.
      type: object
      required:
        - type
        - id
        - attributes
      properties:
        type:
          type: string
          default: "SalesDocHeaderLite"
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/SalesDocHeaderAttributesWithDocHeaderLite"
    SalesDocHeaderIncluded:
      description: Related document header and common document header relationships.
      type: array
      items:
        type: object
      uniqueItems: true
    SalesDocHeaderRequest:
      description: Object to use to create a new sales document header.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/SalesDocHeader"
    SalesDocHeaderResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/SalesDocHeader"
        included:
          $ref: "#/components/schemas/SalesDocHeaderIncluded"
    SalesDocHeaderListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: The collection of Sales documents headers.
          type: array
          items:
            $ref: "#/components/schemas/SalesDocHeader"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/SalesDocHeaderIncluded"
    SalesDocHeaderLiteRequest:
      description: Object to use to create a new sales document header.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/SalesDocHeaderLite"
    SalesDocHeaderTax:
      description: SalesDocHeaderTax resource.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "SalesDocHeaderTax"
        id:
          type: string
        attributes:
          type: object
          required:
            - taxRateId
            - taxRate
            - taxableBasePct
            - taxableBase
            - taxAmount
          properties:
            taxRateId:
              $ref: "./core.yaml#/components/schemas/SimpleEntity"
              description: Tax rate id.
            taxRate:
              description: Tax rate.
              type: number
            taxableBasePct:
              description: Taxable base pct.
              type: string
            taxableBase:
              description: Taxable base.
              type: number
            taxAmount:
              description: Tax amount.
              type: string
        relationships:
          description: Sales doc header tax relates to a sales doc header.
          type: object
          required:
            - salesDocHeader
          properties:
            salesDocHeader:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
    SalesDocHeaderTaxResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/SalesDocHeaderTax"
    SalesDocLineAttributes:
      description: The attributes of a single sales document line.
      type: object
      required:
        - lineNumber
        - reason
        - taxableBaseVariation
        - taxCalculation
        - item
        - sign
        - docQuantity
        - docUnitOfMeasurement
        - stockQuantity
        - stockItemUnitOfMeasurement
        - priceQuantity
        - priceItemUnitOfMeasurement
        - priceListPrice
        - priceListEditable
        - priceListModeId
        - docLineGrossPrice
        - taxRateGroup
        - listGrossAmount
        - listNetAmount
        - netAmount
        - giftAmount
        - taxIncluded
        - salesCostAmount
        - docFulfilledQuantity
        - docLineNetPrice
        - fulfillmentStatusId
        - headerTotalNetAmount
        - variableWeight
      properties:
        lineStatusId:
          $ref: "./documents.yaml#/components/schemas/DocLineStatus"
        lineNumber:
          description: Document's line number. Starts from 1.
          type: string
          example: 1
        reason:
          allOf:
            - $ref: "./core.yaml#/components/schemas/SimpleEntity"
            - description: Sequence number of the reason based on the document type.
              type: object
              readOnly: true
              properties:
                sequenceNum:
                  description: |
                    Sequence number. If `0` it means that this is the main reason for the document.
                    If `null` there is no reason associated to the document.
                  type: integer
                  minimum: 0
        warehouse:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Warehouse.
        taxableBaseVariation:
          description: |
            Taxable base variation. 
            * `1` = increases the taxable amount of the document;
            * `0` = does not affect the taxable amount of the document;
            * `-1` = the line is subtracted from the taxable amount of the document.
          type: integer
          minimum: -1
          maximum: 1
        taxCalculation:
          description: True if the line's VAT contributes to the total VAT, false otherwise.
          type: boolean
        item:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Item.
        sign:
          description: 1 = Line's amount is positive, -1 = Line's amount is negative.
          type: integer
          multipleOf: 1
          minimum: -1
          maximum: 1
        docQuantity:
          description: Quantity moved in the unit of measure of the document (`docUnitOfMeasurement`).
          type: number
          format: double
        docUnitOfMeasurement:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Handled quantity unit of measurement.
        stockQuantity:
          description: Quantity moved in the stock unit of measure (`stockItemUnitOfMeasurement`).
          type: number
          format: double
        stockItemUnitOfMeasurement:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Handled quantity unit of measurement.
        priceQuantity:
          description: Quantity moved in the unit of measure of the price list (`priceItemUnitOfMeasurement`).
          type: number
          format: double
        priceItemUnitOfMeasurement:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Price quantity unit of measurement.
        convFactorPriceToDoc:
          description: |
            Numerator for the conversion calculation from the price unit of measurement to the document unit of measurement.
            Calculated as: PriceConvFactor * DocConvFactorDenom.

            Example: If the document unit is PK (package) with ConvFactor=12 and ConvFactorDenom=1, 
            and the price unit is PC (pieces) with ConvFactor=1 and ConvFactorDenom=1, 
            then convFactorPriceToDoc = 1 * 1 = 1.
            This means 1 PC in price terms equals 1/12 PK in document terms.
          type: number
          format: double
          readOnly: true
        convFactorDenomPriceToDoc:
          description: |
            Denominator for the conversion calculation from the price unit of measurement to the document unit of measurement.
            Calculated as: DocConvFactor * PriceConvFactorDenom.

            Example: If the document unit is PK (package) with ConvFactor=12 and ConvFactorDenom=1, 
            and the price unit is PC (pieces) with ConvFactor=1 and ConvFactorDenom=1, 
            then convFactorDenomPriceToDoc = 12 * 1 = 12.
            Combined with convFactorPriceToDoc, the conversion ratio is 1/12, meaning 1 PC = 1/12 PK.
          type: number
          format: double
          readOnly: true
        convFactorStockToDoc:
          description: |
            Numerator for the conversion calculation from the stock unit of measurement to the document unit of measurement.
            Calculated as: StockConvFactor * DocConvFactorDenom.

            Example: If the document unit is PK (package) with ConvFactor=12 and ConvFactorDenom=1, 
            and the stock unit is PC (pieces) with ConvFactor=1 and ConvFactorDenom=1, 
            then convFactorStockToDoc = 1 * 1 = 1.
            This means 1 PC in stock terms equals 1/12 PK in document terms.
          type: number
          format: double
          readOnly: true
        convFactorDenomStockToDoc:
          description: |
            Denominator for the conversion calculation from the stock unit of measurement to the document unit of measurement.
            Calculated as: DocConvFactor * StockConvFactorDenom.

            Example: If the document unit is PK (package) with ConvFactor=12 and ConvFactorDenom=1, 
            and the stock unit is PC (pieces) with ConvFactor=1 and ConvFactorDenom=1, 
            then convFactorDenomStockToDoc = 12 * 1 = 12.
            Combined with convFactorStockToDoc, the conversion ratio is 1/12, meaning 1 PC = 1/12 PK.
          type: number
          format: double
          readOnly: true
        convFactorDocToPrice:
          description: |
            Calculated conversion factor from the document unit of measurement to the price unit of measurement.
            Calculated as: convFactorDenomPriceToDoc / convFactorPriceToDoc.

            Example: If the document unit is PK (package) with ConvFactor=12 and ConvFactorDenom=1, 
            and the price unit is PZ (pieces) with ConvFactor=1 and ConvFactorDenom=1, 
            then convFactorDocToPrice = 12 / 1 = 12.
            This means 1 PK in document terms equals 12 PC in price terms (1 package = 12 pieces).
          type: number
          format: double
          readOnly: true
        convFactorDocToStock:
          description: |
            Calculated conversion factor from the document unit of measurement to the stock unit of measurement.
            Calculated as: convFactorDenomStockToDoc / convFactorStockToDoc.

            Example: If the document unit is PK (package) with ConvFactor=12 and ConvFactorDenom=1, 
            and the stock unit is PC (pieces) with ConvFactor=1 and ConvFactorDenom=1, 
            then convFactorDocToStock = 12 / 1 = 12.
            This means 1 PK in document terms equals 12 PC in stock terms (1 package = 12 pieces).
          type: number
          format: double
          readOnly: true
        priceListDetail:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Line's price list detail.
        priceList:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Line's price list.
        priceListPrice:
          description: |
            Gross price resulting from the application of the commercial condition (`PriceListDetail` or 
            `PriceCondition`).
          type: number
          format: double
        priceListEditable:
          description: If `true` the price list detail is editable, `false` otherwise.
          type: boolean
        priceListPriceMin:
          description: |
            If not `null`, then it represents the minimum assignable price during the application of the condition 
            (only if Editable is `true`).
          type: number
          format: double
        priceListPriceMax:
          description: |
            If not `null`, then it represents the maximum assignable price during the application of the condition 
            (only if Editable is `true`).
          type: number
          format: double
        priceListDiscountMin:
          description: |
            If not `null`, and if `PriceMax` is `null`, then it represents the discount percentage to be applied to 
            `Price` to determine the maximum assignable price during the application of the condition; 
            if the value is negative, it represents the maximum applicable markup (only if Editable is `true`).
          type: number
          format: double
        priceListDiscountMax:
          description: |
            If not `null`, and if `PriceMax` is `null`, then it represents the discount percentage to be applied to 
            `Price` to determine the maximum assignable price during the application of the condition; 
            if the value is negative, it represents the maximum applicable markup (only if Editable is `true`).
          type: number
          format: double
        priceListDiscountModeId:
          description: |
            See dictionary `DiscountMode`.

            * `Overwrite` = the discounts in `PriceList` are optionally replaced by those in `DiscountList`;
            * `Add` = the discounts in `PriceList` are added to those in `DiscountList`;
            * `Ignore` = the discounts possibly present in `DiscountList` are not considered.
          type: string
        docLineGrossPrice:
          description: |
            Line price before discounts that determines the gross line amount; if `PriceListEditable` is `false`, 
            it corresponds to `PriceListPrice`, whereas if `PriceListEditable` is `true`, it corresponds to the price 
            possibly modified by the user; the price is expressed in `priceItemUnitOfMeasurement`.
          type: number
          format: double
        printableDiscounts:
          description: A string that concatenate all the discount (both percentage and value discounts).
          type: string
          example: "10€+5€+8%"
        taxRateGroup:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Tax Rate Group.
        listGrossAmount:
          description: Line amount obtained by applying the list price (`PriceListPrice`) to the `PriceQuantity`.
          type: number
          format: double
        listNetAmount:
          description: Line value based on list prices net of discounts.
          type: number
          format: double
        netAmount:
          description: |
            Line value net of all discounts, including those granted by the user during document entry; 
            corresponds to `PriceQuantity * DocLineNetPrice`.
          type: number
          format: double
        giftAmount:
          description: |
            Value of free-of-charge lines; it does not affect the net amount, allows discounts to be valued, 
            and influences the margin of the sales line.
          type: number
          format: double
        taxIncluded:
          description: True if tax is included, false otherwise.
          type: boolean
        salesCostAmount:
          description: Cost of goods sold for the line, used for margin calculation.
          type: number
          format: double
        deliveryDate:
          $ref: "./dataTypes.yaml#/components/schemas/apiDate"
        itemBarcode:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Bar code.
        commissionPct:
          description: |
            Commission percentage obtained from the price list or from the commission calculation by applying the matrix; 
            it is not affected by the possible application of the cut-off.
          type: number
          format: double
        commissionAmount:
          description: |
            Commission amount obtained by applying the `CommissionPct`; it is not affected by the possible application 
            of the cut-off and is populated only after the commission calculation is applied.
          type: number
          format: double
        clusterGroup:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Product's belonging cluster group. See dictionary "ClusterGroup".
        deliveryStatusId:
          description: Document delivery status. See dictionary `DeliveryStatus`.
          type: string
        docFulfilledQuantity:
          description: |
            Fulfilled quantity expressed in docItemUnitOfMeasurement, i.e. the quantity that has been delivered to 
            the customer.
          type: number
          format: double
        fulfilledDocLineId:
          description: Optional reference to the document line fulfilled by the current one.
          type: string
        docLineNetPrice:
          description: Document line net price.
          type: number
          format: double
        fulfillmentStatusId:
          $ref: "./documents.yaml#/components/schemas/FulfillmentStatus"
        printableTaxRates:
          description: Vat rates applied concatenated in a single string.
          type: string
          example: 4%+1.5%
        headerTotalNetAmount:
          description: Total amount net of taxes (relevant to the header).
          type: number
          format: double
        docLineGrossAmount:
          description: Gross amount equal to DocLineGrossPrice * PriceQuantity.
          type: number
          format: double
        batches:
          description: Related batches codes.
          type: array
          items:
            type: string
          uniqueItems: true
        serialNumbers:
          description: Related serial numbers codes.
          type: array
          items:
            type: string
          uniqueItems: true
        docPendingQuantity:
          description: |
            Handled pending quantity in the document unit of measurement.
            It's the difference between `docQuantity` and `docFulfilledQuantity`.
          type: number
          format: double
          readOnly: true
        itemRenditionUrl:
          description: |
            Refers to the item linked to the sales doc line.
            URL of the requested rendition of the digital content with the sequence number 0. 
            You need to provide the `renditionTypeId` parameter in order to get the correspondent picture's link.
          type: string
          format: uri-reference
          readOnly: true
        variableWeight:
          description: Variable Weight Item.
          type: boolean
          default: false
        inAssortment:
          description: True if the item is in an assortment, false otherwise.
          type: boolean
          default: false
          readOnly: true
        availableStockQuantity:
          description: Available stock quantity.
          type: number
          format: double
        availabilityLevelId:
          $ref: "./items.yaml#/components/schemas/AvailabilityLevelId"
        warnings:
          $ref: "#/components/schemas/Warnings"
        minQty:
          description: |
            Minimum quantity for the item, expressed in docUnitOfMeasurement.
            The highest quantity between the minimum expressed in docUnitOfMeasurement and the minimum present in 
            the price list.
          type: number
          readOnly: true
          format: double
          minimum: 0
        maxQty:
          description: |
            Maximum quantity for the item.
            The highest quantity present in the tiers of the price list.
          type: number
          readOnly: true
          format: double
          minimum: 0
        itemShippingCostGroupId:
          description: Item shipping cost group id. See dictionary `ItemShippingCostGroup`.
          type: string
          readOnly: true
    SalesDocLineAttributesLite:
