  /sales-docs/{id}/reorder:
    parameters:
      - $ref: "#/components/parameters/id"
      - $ref: "./jsonapi.yaml#/components/parameters/marketplace"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    post:
      description: |
        Request to create a new sales document by reordering from a previous sales document.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | createSalesOrder |
      operationId: reorderSalesDoc
      tags:
        - Sales Document
      x-authorities:
        - createSalesOrder
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              description: A request to create a new sales document by reordering from a previous sales document.
              type: object
              required:
                - data
              properties:
                data:
                  type: object
                  required:
                    - draftHeaderId
                    - operation
                  properties:
                    draftHeaderId:
                      type: string
                      description: The id of the draft sales document header to base the reorder on.
                    operation:
                      type: string
                      description: |
                        The reorder operation to perform on the draft sales document.
                        * `ADD`: Adds the items of the source document to the existing items of the draft document.
                        * `REPLACE`: Replaces the items of the draft document with the items of the source
                      enum:
                        - ADD
                        - REPLACE
      responses:
        "202":
          description: Request accepted.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/info"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
