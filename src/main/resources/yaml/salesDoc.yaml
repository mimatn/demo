  /sales-docs/{id}/draft-ownership:
    parameters:
      - name: id
        in: path
        description: Sales document header Id.
        required: true
        schema:
          type: string
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: |
        Invoke this service to find out if you can change the draft owner.

        To access the service you need at least one of the following permissions:
        | Permission (one of) | 
        |:-:|
        | changeDraftSalesDocOwnership |
        | changeDraftSalesOrderOwnership |
      operationId: canDraftSalesDocOwnershipChange
      tags:
        - Sales Document
      x-authorities:
        - changeDraftSalesDocOwnership
        - changeDraftSalesOrderOwnership
      responses:
        "200":
          description: Means that the owner of the draft can be changed at the moment.
        "400":
          description: |
            Ownership change is not possible because the current draft owner is still active.  
            The error message will indicate the minimum number of minutes to wait before attempting to change the draft 
            owner again.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    patch:
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/marketplace"
      description: |
        The draft of a sales document relates to two user profiles:
        1. The user that originally created the draft: `draftOwnerUserProfile`;
        2. The user that is currently editing the draft: `currentDraftUserProfile`.
        This service changes the `currentDraftUserProfile`. The sales doc header id must refer to a draft item. 
        If the caller is `currentDraftUserProfile` the change of ownership takes place immediately. Otherwise
        a configurable amount of time must have passed since the last modification of the draft.

        To access the service you need at least one of the following permissions:
        | Permission (one of) | 
        |:-:|
        | changeDraftSalesDocOwnership |
        | changeDraftSalesOrderOwnership |
      operationId: changeDraftSalesDocOwnership
      tags:
        - Sales Document
      x-authorities:
        - changeDraftSalesDocOwnership
        - changeDraftSalesOrderOwnership
      requestBody:
        description: The change draft ownership request.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "./core.yaml#/components/schemas/ChangeDraftEntityOwnershipRequest"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
