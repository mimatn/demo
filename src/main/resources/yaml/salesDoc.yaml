            docLineGrossPrice:
              description: The new gross price of the line.
              type: number
              format: double
              example: 10.0
            deliveryDate:
              description: The new delivery date of the line.
              $ref: "./dataTypes.yaml#/components/schemas/apiDate"
            externalRefNumber:
              description: The new external reference number of the line.
              type: string
              example: "L-0001"
        relationships:
          description: |
            Related entities relationships needed to update a sales doc line.

            In particular, `docUnitOfMeasurement` represents the id of the relationship between an item and a unit
            of measurement (in this case, the one to use as the document unit of measurement).
          type: object
          properties:
            reason:
              description: The reason of the line.
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            warehouse:
              description: The warehouse of the line.
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            docUnitOfMeasurement:
              description: The unit of measurement of the line.
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            priceList:
              description: The price list of the line.
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
    SalesDocLineUpdateRequest:
      description: An object containing the data needed to update a sales document line.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/SalesDocLineUpdateData"
    EligibleItem:
      description: An item that can be added to a sales document.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          description: Describes the type of the object.
          type: string
          default: "EligibleItem"
        id:
          description: Uniquely identify the item.
          type: string
        attributes:
          description: The attributes of an eligible item.
          type: object
          properties:
            code:
              description: The code of the item.
              type: string
            descr:
              description: The description of the item.
              type: string
            isAvailable:
              description: True if the item is available, false otherwise.
              type: boolean
        relationships:
          type: object
          description: Related items.
          properties:
            relatedItems:
              $ref: "./jsonapi.yaml#/components/schemas/relToManyWithMeta"
    EligibleItemIncluded:
      description: Related items.
      type: array
      items:
        $ref: "./items.yaml#/components/schemas/Item"
      uniqueItems: true
    EligibleItemsListResponse:
      description: An object containing a list of eligible items for a sales document.
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: The list of eligible items.
          type: array
          items:
            $ref: "#/components/schemas/EligibleItem"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/EligibleItemIncluded"
    SalesDocWidgetListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          description: List of widgets. Contains the data for the widgets selected by the user.
          properties:
            tallyWidgets:
              description: Set of tally widgets.
              type: array
              items:
                $ref: "./widgets.yaml#/components/schemas/TallyWidget"
    ExceededBudgetLimit:
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          description: Describes the type of the object.
          type: string
          default: "ExceededBudgetLimit"
        id:
          description: The sales document line id.
          type: string
        attributes:
          type: object
          properties:
            targetLimitQuantity:
              type: number
              description: Maximum allowed quantity for the target.
              minimum: 0
            targetConsumedQuantity:
              type: number
              description: Item quantity already consumed for the target.
              minimum: 0
            itemCountInCluster:
              type: integer
              description: Number of items in the target cluster.
              minimum: 0
            docQuantity:
              type: number
              description: |
                Document quantity referred to the line id if set.
                Expressed in the document unit of measurement, i.e. relationship `docUnitOfMeasurement`.
              minimum: 0
            docTargetLimitQuantity:
              type: number
              description: |
                Maximum allowed quantity for document quantity.
                Expressed in the document unit of measurement, i.e. relationship `docUnitOfMeasurement`.
              minimum: 0
        relationships:
          type: object
          description: |
            Related:
              * Target
              * Item
              * Target unit of measurement
              * Item cluster
          properties:
            target:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
            item:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
            targetUnitOfMeasurement:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
            itemCluster:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
            docUnitOfMeasurement:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
    ExceededBudgetLimitsIncluded:
      description: Related entities.
      type: array
      items:
        type: object
      uniqueItems: true
    ExceededBudgetLimitsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ExceededBudgetLimit"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/ExceededBudgetLimitsIncluded"
    SalesDocLineWarning:
      description: Warning for a sales document line.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          description: |
            The type of warning. Possible values: BudgetWarning, AvailabilityWarning.
          type: string
          pattern: "^(BudgetWarning|AvailabilityWarning)$"
        id:
          description: The sales document line id.
          type: string
        attributes:
          type: object
          properties:
            budgetDiscrepancy:
              description: Details for budget warning (present if type is BudgetWarning).
              type: object
              properties:
                maxBudget:
                  type: number
                  description: Maximum allowed budget.
                targetDescr:
                  type: string
                  description: Target description.
            availabilityDiscrepancy:
              description: True if there is an availability Warning (present if type is AvailabilityWarning).
              type: boolean
        relationships:
          type: object
          description: Related entities.
          properties:
            targetUnitOfMeasurement:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
            item:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
            itemCluster:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
    SalesDocLineWarningIncluded:
      description: Related entities.
      type: array
      items:
        type: object
      uniqueItems: true
    SalesDocLineWarningsListResponse:
      description: Contains the warnings for a sales document line.
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: List of warnings for the sales document line.
          type: array
          items:
            $ref: "#/components/schemas/SalesDocLineWarning"
        included:
          $ref: "#/components/schemas/SalesDocLineWarningIncluded"
    Warnings:
      description: |
        List of warnings related to this document line. 
        Warnings can refer to workflow anomalies, stock or budget unavailability.
      type: object
      readOnly: true
      properties:
        hasWorkflowAnomalies:
          description: |
            True if there are anomalies based on the definition of the workflow for this document line, 
            false otherwise.
          type: boolean
          readOnly: true
        stockUnavailable:
          description: |
            True if the required quantity is not available in stock for the line's item, false otherwise.
          type: boolean
          default: false
        budgetUnavailable:
          description: |
            True if the required quantity is not available in budget for the line's item, false otherwise.
            The budget check is done based on the document's user and sell customer account.
          type: boolean
          default: false
        hasRestrictions:
          description: |
            True if this line is subject to budget restrictions or limitations.
            It is informative only, the line can be created even if this flag is true.
          type: boolean
          default: false
        hasDuplicates:
          description: |
            True if this line (item) is a duplicate of another line in the same document, `false` otherwise.
          type: object
          properties:
            isDuplicate:
              description: |
                True if this line is a duplicate of another line in the same document, `false` otherwise.
              type: boolean
            originalLineId:
              description: |
                If isDuplicate is true, contains the id of the original line (only if `count = 1`), `false` otherwise.
              type: string
            count:
              description: |
                If `isDuplicate` is `true`, contains the number of duplicates found for this item.
              type: integer
    PricingCondition:
      description: |
        Details about the pricing condition applied to determine the price of the sales document line based on a 
        unit of measurements, including discounts.
      type: object
      properties:
        quantityMin:
          description: |
            Minimum quantity for the item, expressed in docUnitOfMeasurement.
            The highest quantity between the minimum expressed in docUnitOfMeasurement and the minimum present in 
            the price list.
          type: number
          format: double
        quantityMax:
          description: |
            Maximum quantity for the item.
            The highest quantity present in the tiers of the price list.
          type: number
          format: double
        grossPrice:
          description: Gross price expressed in the unit of measurement of the related price list.
          type: number
          format: double
        printableDiscounts:
          description: A string that concatenates all applied discounts in a human-readable format.
          type: string
          example: "10€+5€+8%"
        totalDiscountPercentage:
          description: |
            Total percentage discount. GrossPrice-netPrice/grossPrice*100
          type: number
          format: double
        netPrice:
          description: Net price expressed in the unit of measurement of the related price list.
          type: number
          format: double
        priceUnitOfMeasurementId:
          description: The unit of measurement of the related price list.
          type: string
    ConstraintWarningLevel:
      type: string
      description: |
        Indicates the severity of a constraint warning for a sales document line:
          * `Warning`: The order can be placed, but attention is required.
          * `Blocking`: The order cannot be placed due to a blocking constraint.
          * `AuthorizationRequired`: The order can be placed only if authorized.
      enum:
        - Warning
        - Blocking
        - AuthorizationRequired
    ConstraintType:
      type: string
      description: |
        Indicates the type of constraint that triggered the warning:
          * `ORDER_MIN_AMOUNT`: The total order amount is below the minimum required.
          * `CATEGORY_MIN_AMOUNT`: The total amount for a specific category is below the minimum required.
      enum:
        - ORDER_MIN_AMOUNT
        - CATEGORY_MIN_AMOUNT
    SalesDocConstraintWarning:
      type: object
      required:
        - type
        - id
        - attributes
      properties:
        type:
          type: string
          default: "SalesDocConstraintWarning"
        id:
          $ref: "#/components/schemas/ConstraintType"
        attributes:
          type: object
          properties:
            # verrà introdotto in un prossimo rilascio
            #severityLevel:
            #  $ref: "#/components/schemas/ConstraintWarningLevel"
            params:
              type: object
              additionalProperties:
                type: object
    SalesDocConstraintWarningsResponse:
      type: object
      required:
        - data
      properties:
        data:
          description: |
            A warning related to sales document constraints, such as minimum order amount or minimum category amount.
            In the attributes, the `params` object contains the parameters related to the warning, and the keys depend
            on the warning id:

            | Parameter (map key) | Constraint ID | Description | Type |
            |-|-|-|-|
            | `minAmount` | `ORDER_MIN_AMOUNT`, `SHIPPING_COST_GROUP_MIN_AMOUNT` | The minimum order amount required | number |
            | `shippingCostGroupId` | `SHIPPING_COST_GROUP_MIN_AMOUNT` | The shipping cost group id (see dictionary `ShippingCostGroup`) | string |
          #
          #These warnings help inform users about constraints that may prevent the order from being placed or require
          #additional authorization.
          #The severity of the warning is indicated by the `severityLevel` property:
          #  * `Warning`
          #  * `Blocking`
          #  * `AuthorizationRequired`
          type: array
          items:
            $ref: "#/components/schemas/SalesDocConstraintWarning"
          example: |
            ```
            {
              "data": [
                {
                  "type": "SalesDocConstraintWarning",
                  "id": "ORDER_MIN_AMOUNT",
                  "attributes": {
                    "params": {
                      "minAmount": 150
                    }
                  }
                },
                {
                  "type": "SalesDocConstraintWarning",
                  "id": "SHIPPING_COST_GROUP_MIN_AMOUNT",
                  "attributes": {
                    "params": {
                      "ShippingCostGroup" : "ItemShippingCostGroup.Frozen",
                      "minAmount": 200
                    }
                  }
                },
                {
                  "type": "SalesDocConstraintWarning",
                  "id": "SHIPPING_COST_GROUP_MIN_AMOUNT",
                  "attributes": {
                    "params": {
                      "ShippingCostGroup" : "ItemShippingCostGroup.Fresh",
                      "minAmount": 100
                    }
                  }
                }
              ]
            }
            ```
    ShippingCost:
      description: Shipping Cost resource.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "ShippingCost"
        id:
          type: string
        attributes:
          type: object
          required:
            - descr
            - budgetTypeId
            - budgetTargetAmountTypeId
            - docTypeShippingCostGroupId
            - minNetAmount
            - maxNetAmount
            - shippingCostAmount
            - shippingCostActionId
          properties:
            code:
              description: Code of the shipping cost.
              type: string
            descr:
              description: General description/name of the shipping cost.
              type: string
            shippingZoneId:
              description: Shipping zone. See dictionary `ShippingZone`.
              type: string
            itemShippingCostGroupId:
              description: |
                Item shipping cost group. See dictionary `ItemShippingCostGroup`.
                If present the shipping cost applies only to items in the specified shipping cost group.
                If null the shipping cost applies to all items.
              type: string
            docTypeShippingCostGroupId:
              description: |
                Document type shipping cost group. See dictionary `DocTypeShippingCostGroup`.
                Cost applies only to documents of the specified document type shipping cost group.
              type: string
            minNetAmount:
              description: Minimum net amount for the shipping cost to be applied.
              type: number
              format: double
            maxNetAmount:
              description: Maximum net amount for the shipping cost to be applied.
              type: number
              format: double
            shippingCostAmount:
              description: Amount of the shipping cost.
              type: number
              format: double
              default: 0.0
            shippingCostActionId:
              description: |
                Action to perform in the App when the shipping cost is applied.
                See dictionary `ShippingCostAction`.
              type: string
        relationships:
          type: object
          required:
            - organization
            - currency
          properties:
            organization:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            currency:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
            shippingCostItem:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
            shippingCostReason:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
    ShippingCostIncluded:
      description: Related entities.
      type: array
      items:
        type: object
      uniqueItems: true
    ShippingCostListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: List of ShippingCosts
          type: array
          items:
            $ref: "#/components/schemas/ShippingCost"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/ShippingCostIncluded"
    UpsertSalesDocLine:
