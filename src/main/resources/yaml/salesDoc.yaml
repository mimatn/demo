    SalesDocHeaderCreationData:
      description: An object containing the data needed to create a new sales document header.
      type: object
      required:
        - type
        - attributes
        - relationships
      properties:
        type:
          description: Describes the type of the object.
          type: string
          default: "SalesDocHeaderCreationData"
        attributes:
          description: The attributes needed to create a new sales document header.
          type: object
          required:
            - docCode
            - creationDate
          properties:
            docCode:
              description: A formatted version of the sales document number.
              type: string
            creationDate:
              $ref: "./dataTypes.yaml#/components/schemas/apiDate"
              description: |
                Generally the date when the document is created. It may be predated or postdated based on document
                type's configuration.
            preferredDeliveryDate:
              description: |
                Preferred delivery date.  If specified, this date will affect the price conditions used for the document.
                It is a non-binding indication of the customer's preferred delivery date.

                Formatted like `YYYY-MM-DD`; see [Specification > DataTypes](https://swagger.io/specification/#data-types)
              type: string
              format: date
              example: "2022-02-25"
            expectedDeliveryDate:
              description: |
                Expected delivery date.
                It is the date on which the delivery is expected to be made.

                Formatted like `YYYY-MM-DD`; see [Specification > DataTypes](https://swagger.io/specification/#data-types)
              type: string
              format: date
              example: "2022-02-25"
            actualDeliveryDate:
              description: |
                Actual delivery date.
                It is the date on which the delivery was actually made.

                Formatted like `YYYY-MM-DD`; see [Specification > DataTypes](https://swagger.io/specification/#data-types)
              type: string
              format: date
              example: "2022-02-25"
            deliveryModeId:
              description: |
                Document's delivery mode. See dictionary `DeliveryMode`. If `null` the customer's delivery mode will be
                 used.
              type: string
            coordinates:
              description: Location information about the sales document.
              type: object
              properties:
                latitude:
                  description: The latitude where the document is created.
                  type: number
                  format: double
                longitude:
                  description: The longitude where the document is created.
                  type: number
                  format: double
                coordinateAccuracy:
                  description: The accuracy of the coordinates.
                  type: number
                  format: double
        relationships:
          description: Related entities relationships needed to create a new sales doc header.
          type: object
          required:
            - sellToCustomerAccount
            - billToCustomerAccount
            - docType
            - creatorUserProfile
            - organization
          properties:
            sellToCustomerAccount:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
              description: The customer account that will receive the goods.
            billToCustomerAccount:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
              description: The customer account that will pay for the goods.
            docType:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
              description: The type of the document. It determines several aspects of the document.
            creatorUserProfile:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
              description: The user profile that created the document.
            organization:
