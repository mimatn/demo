  /sales-docs/headers/{id}/bulk-deletion:
    patch:
      description: |
        Delete multiple sales document lines at once. The sales document must be in draft status.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | createSalesOrder |
        | updateSalesOrder |
        | createSalesDoc |
        | updateSalesDoc |
      operationId: bulkDeleteSalesDocLines
      tags:
        - Sales Document
      x-authorities:
        - createSalesOrder
        - updateSalesOrder
        - createSalesDoc
        - updateSalesDoc
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - deleteAll
                - notInAssortmentOnly
                - linesIdsToDelete
              properties:
                deleteAll:
                  type: boolean
                  description: |
                    * If `true`, `notInAssortmentOnly` and `linesIdsToDelete` will be ignored and all lines of the sales 
                    document will be deleted.
                    * If `false`, the lines to delete will be determined according to the other two attributes.
                  default: false
                notInAssortmentOnly:
                  type: boolean
                  description: |
                    * If `true`, only lines with items not in assortment will be deleted and `linesIdsToDelete` 
                    will be ignored.
                    * If `false`, this attribute will be ignored.
                  default: false
                linesIdsToDelete:
                  type: array
                  description: |
                    The list of sales document lines ids to delete. 
                    * If `deleteAll` or `notInAssortmentOnly` are `true`, this attribute will be ignored.
                    * If `deleteAll` and `notInAssortmentOnly` are `false` and this list is not empty, only the lines 
                    with ids in this list will be deleted.
                  items:
                    type: string
                  uniqueItems: true
                  default: []
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#crud-updating-responses-200)"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
