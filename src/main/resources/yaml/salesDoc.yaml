paths:
  /sales-docs/headers/{id}/transfer-statuses:
    parameters:
      - $ref: "#/components/parameters/id"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: |
        Return the list of possible valid transfer statuses from the current transfer status of the sales document.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | updateSalesOrderTransferStatus |
        | updateSalesDocTransferStatus |
      operationId: listSalesDocTransferStatuses
      tags:
        - Sales Document
      x-authorities:
        - updateSalesOrderTransferStatus
        - updateSalesDocTransferStatus
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "./documents.yaml#/components/schemas/DocTransferStatusListResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    patch:
      description: |
        Updates the transfer status of a sales document.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | updateSalesOrderTransferStatus |
        | updateSalesDocTransferStatus |

      operationId: updateSalesDocTransferStatus
      tags:
        - Sales Document
      x-authorities:
        - updateSalesOrderTransferStatus
        - updateSalesDocTransferStatus
      requestBody:
        description: Desired transfer status.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "./documents.yaml#/components/schemas/TransferStatusRequest"
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/SalesDocHeaderResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /sales-docs/headers/{headerId}/lines/{lineId}:
    parameters:
      - $ref: "#/components/parameters/headerId"
      - $ref: "#/components/parameters/lineId"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: |
        Return a single line of a sales document.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | getSalesOrder |
        | createSalesOrder |
        | updateSalesOrder |
        | getSalesDoc |
        | createSalesDoc |
        | updateSalesDoc |
      operationId: getSalesDocLine
      tags:
        - Sales Document
      x-authorities:
        - getSalesOrder
        - createSalesOrder
        - updateSalesOrder
        - getSalesDoc
        - createSalesDoc
        - updateSalesDoc
      responses:
        "200":
          description: "[OK](https://jsonapi.org/format/#fetching-resources-responses-200)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/SalesDocLineResponse"
        "404":
          description: "[Not found](https://jsonapi.org/format/#fetching-resources-responses-404)."
    patch:
      description: |
        Updates a single line of a sales document. This operation is implemented such that nullable attributes or
        relationships are ignored and, therefore, won't change line's values.

        Among the updatable attributes and relationships, there are some that when updated will trigger automatic
        recalculation of other line's information. In particular, changing:
        * Line's reason may trigger taxes recalculation.
        * Line's warehouse may affect items availability.
        * Line's unit of measurement implies all quantities recalculation.
        * Line's quantity affects stock price.
        * Line's gross price affects its net price based on line's discounts (if any).

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | createSalesOrder |
        | updateSalesOrder |
        | createSalesDoc |
        | updateSalesDoc |
      operationId: updateSalesDocLine
      tags:
        - Sales Document
      x-authorities:
        - createSalesOrder
        - updateSalesOrder
        - createSalesDoc
        - updateSalesDoc
      requestBody:
        description: The line of the sales document to patch.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/SalesDocLineUpdateRequest"
      responses:
        "200":
