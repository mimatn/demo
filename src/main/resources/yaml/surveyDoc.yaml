              schema:
                $ref: "#/components/schemas/SurveyDocTemplateClusterListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    post:
      description: |
        Add one or more clusters to the given survey document template.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | createSurveyDocTemplate |
        | updateSurveyDocTemplate |
      operationId: addSurveyDocTemplateClusters
      tags:
        - Survey Document Template
      x-authorities: ["createSurveyDocTemplate", "updateSurveyDocTemplate"]
      requestBody:
        description: Survey document template cluster to create.
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  description: Cluster ids to add to the survey document template.
                  type: array
                  items:
                    type: string
                  uniqueItems: true
      responses:
        "201":
          description: "[Created](https://jsonapi.org/format/#crud-creating-responses-201)."
          content:
            application/vnd.api+json:
              schema:
                $ref: "./clusters.yaml#/components/schemas/ClusterListResponse"
        "400":
          description: Bad request.
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /survey-docs/templates/{templateId}/clusters/{clusterId}:
