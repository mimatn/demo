        required: true
        schema:
          type: string
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      summary: listSurveyDocTemplateClusters
      description: |
        Returns a list of SurveyDocTemplateCluster, 
