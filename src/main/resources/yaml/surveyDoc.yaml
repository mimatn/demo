      - $ref: "#/components/parameters/lineId"
      - $ref: "#/components/parameters/attachmentId"
      - $ref: "#/components/parameters/RenditionTypeParam"
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: |
        Downloads the attachment identified by `attachmentId` and linked to `lineId`. The attachment
        rendition is determined by `renditionType` parameter.
