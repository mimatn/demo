openapi: 3.0.3
info:
  title: Survey Documents API
  version: "-"
  description: APIs for Survey Document
tags:
  - name: Survey Document
    description: |
      Survey documents are used to collect information through the completion of questionnaires. These questionnaires can contain a series of questions, 
      ranging from customer qualification to specific surveys, such as the arrangement of items in a supermarket. 
      A Survey document may consist of multiple parts, called "sections," each of which is used to gather various types of data. For example, in a supermarket survey, 
      there might be sections for store information, for counter items, and for items displayed on shelves, each with their own specific questions.
      To specify how the Survey document should be structured, a "template" is used, consisting of a header and several section templates, of which at least one must be defined.
  - name: Survey Document Section
    description: |
      A Survey document section is a part of a Survey document that contains a set of questions. Each section is based on a template section, 
      which defines the questions that will be asked.

  - name: Survey Document Template
    description: |
      A Survey document template is a model that defines the structure of a Survey document. It consists of a header and several section templates, 
      each of which defines the questions that will be asked in a section of the Survey document.
components:
  schemas:
    SurveyDocSectionTypeId:
      description: The survey document section type. See dictionary `SurveyDocSectionType`
      type: string
      enum:
        - SurveyDocSectionType.ItemCollection
        - SurveyDocSectionType.ObjectCollection
        - SurveyDocSectionType.SingleInstance
        - SurveyDocSectionType.AssetCollection
    #
    # SurveyDocHeaderAttributes (extends ./core.yaml#/components/schemas/DocHeaderAttributes)
    #
    SurveyDocHeaderAttributes:
      description: Attributes specific of a Survey document. Properties common in all type of documents are stored in the `DocHeaderAttributes` object.
      type: object
      required:
        - code
      properties:
        salesRep:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Document customer's agent.
        customerRefNumber:
          description: Customer's document ref. number
          type: string
        customerRefDate:
          $ref: "./dataTypes.yaml#/components/schemas/apiDate"
          description: Customer's document ref. date
        hasAnomalies:
          description: |
            True if the survey contains at least one anomaly. Anomalies are answers that do not respect conditions
            defined in the template the survey is based on.
          readOnly: true
          type: boolean
          default: false
          example: false
    SurveyDocHeaderAttributesWithDocHeader:
      allOf:
        - $ref: "#/components/schemas/SurveyDocHeaderAttributes"
        - description: DocHeader attributes
          type: object
          properties:
            docHeaderAttributes:
              $ref: "./documents.yaml#/components/schemas/DocHeaderAttributes"
    SurveyDocHeaderRelationships:
      description: Survey doc header extends DocHeader.
      type: object
      required:
        - docHeader
        - surveyDocTemplate
      properties:
        docHeader:
          $ref: "./jsonapi.yaml#/components/schemas/relToOne"
        surveyDocTemplate:
          $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMetaReadOnly"
        customerAccount:
          $ref: "./jsonapi.yaml#/components/schemas/relToOneReadOnly"
    SurveyDocHeader:
      description: SurveyDocHeader resource, contains information present in an header of a survey document.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "SurveyDocHeader"
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/SurveyDocHeaderAttributesWithDocHeader"
        relationships:
          description: Attributes of a survey document
          allOf:
            - $ref: "./documents.yaml#/components/schemas/DocHeaderRelationships"
            - $ref: "#/components/schemas/SurveyDocHeaderRelationships"
    SurveyDocHeaderIncluded:
      description: Related document header and common document header relationships
      type: array
      items:
        type: object
      uniqueItems: true
    SurveyDocHeaderResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/SurveyDocHeader"
        included:
          $ref: "#/components/schemas/SurveyDocHeaderIncluded"
    SurveyDocHeaderListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: The collection of Survey documents headers.
          type: array
          items:
            $ref: "#/components/schemas/SurveyDocHeader"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/SurveyDocHeaderIncluded"
    SurveyDocHeaderCreation:
      description: An object containing the data needed to create a new sales document header.
      type: object
      required:
        - type
        - attributes
        - relationships
      properties:
        type:
          description: Describes the type of the object.
          type: string
          default: "SalesDocHeaderCreationData"
        attributes:
          description: The attributes needed to create a new sales document header.
          type: object
          required:
            - docDate
            - docCode
          properties:
            docDate:
              $ref: "./dataTypes.yaml#/components/schemas/apiDate"
              description: |
                Generally the date when the document is created. It may be predated or postdated based on document
                type's configuration.
            docCode:
              description: A formatted version of the sales document number.
              type: string
        relationships:
          description: Related entities relationships needed to create a new sales doc header.
          type: object
          required:
            - docType
            - surveyDocTemplate
            - organization
          properties:
            customAccount:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            docType:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
              description: The type of the document. It determines several aspects of the document.
            surveyDocTemplate:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            organization:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
              description: The organization that the document belongs to.
    SurveyDocSectionAttributes:
      description: The attributes of a survey document section.
      type: object
      required:
        - surveyDocTemplateSection
        - sectionNumber
        - surveyDocSectionTypeId
        - sequenceNumber
        - visible
      properties:
        surveyDocTemplateSection:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Survey document template section.
        sectionNumber:
          description: Section instance sequence number for a given SurveyDocTemplateSessionId; 1 indicates the first instance of the section.
          type: integer
        entityObject:
          $ref: "./core.yaml#/components/schemas/SimpleEntity"
          description: Identifier of the object generated by the iteration condition, `null` if SingleInstance type section (e.g. ItemId).
        surveyDocSectionTypeId:
          $ref: "#/components/schemas/SurveyDocSectionTypeId"
        sequenceNumber:
          description: Line sequence number.
          type: integer
          minimum: 0
        visible:
          description: True if visible, false otherwise.
          type: boolean
          default: true
        hasAnomalies:
          description: |
            True if the section contains at least one anomaly. Anomalies are answers that do not respect conditions
            defined in the survey's template the section is based on.
          readOnly: true
          type: boolean
          default: false
          example: false
    SurveyDocSectionRelationships:
      description: Relationships of a survey document section.
      type: object
      required:
        - surveyDocHeader
        - sheet
      properties:
        surveyDocHeader:
          $ref: "./jsonapi.yaml#/components/schemas/relToOne"
        sheet:
          $ref: "./jsonapi.yaml#/components/schemas/relToOne"
        cluster:
          $ref: "./jsonapi.yaml#/components/schemas/relToOne"
    SurveyDocSection:
      description: SurveyDocSection resource.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "SurveyDocSection"
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/SurveyDocSectionAttributes"
        relationships:
          $ref: "#/components/schemas/SurveyDocSectionRelationships"
    SurveyDocSectionIncluded:
      description: Related survey document header and sheet.
      type: array
      items:
        type: object
      uniqueItems: true
    SurveyDocSectionResponse:
      description: Single Survey Document Section response.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/SurveyDocSection"
        included:
          $ref: "#/components/schemas/SurveyDocSectionIncluded"
    SurveyDocSectionListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: The list of Survey documents sections.
          type: array
          items:
            $ref: "#/components/schemas/SurveyDocSection"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/SurveyDocSectionIncluded"
    SurveyAttachment:
      description: A survey answer with an attachment.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          description: A string that describes the type of the resource.
          type: string
          default: "SurveyAttachment"
        id:
          description: |
            A string that uniquely identify the resource. The id refers to the `DigitalContent` that represents the
            attachment.
          type: string
          example: "SLI.1"
        attributes:
          description: The attributes of a survey attachment answer.
          type: object
          required:
            - surveyDate
            - surveyNumber
            - question
            - attachmentUrl
          properties:
            dataTypeId:
              description: The answer's data type. See dictionary `DataType`.
              type: string
              example: "DataType.Boolean"
            surveyDate:
              description: The date of the survey the attachment is related to.
              $ref: "./dataTypes.yaml#/components/schemas/apiDate"
            surveyNumber:
              description: The number of the survey the attachment is related to.
              type: string
              example: "SURV-001"
            question:
              description: |
                Each attachment refers to a survey line which represents an answer to a survey question. This attribute
                is the question itself.
              type: string
              example: "What is the item's price?"
            answerTs:
              description: The timestamp of the answer.
              $ref: "./dataTypes.yaml#/components/schemas/apiDateTime"
            attachmentUrl:
              description: The URL to retrieve the attachment.
              type: string
              format: uri-reference
        relationships:
          description: The relationships of a survey image answer.
          type: object
          required:
            - surveyDocHeader
            - surveyDocLine
            - surveyTemplate
            - surveyCollector
            - tags
          properties:
            surveyDocHeader:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            surveyDocLine:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            surveyTemplate:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
            surveyCollector:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            tags:
              $ref: "./jsonapi.yaml#/components/schemas/relToMany"
    SurveyAttachmentIncluded:
      description: Resources related to a survey attachment.
      type: array
      items:
        type: object
      uniqueItems: true
    SurveyAttachmentListResponse:
      description: An object that contains a list of survey attachments.
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: The list of survey attachments.
          type: array
          items:
            $ref: "#/components/schemas/SurveyAttachment"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/SurveyAttachmentIncluded"
    SurveyAttachmentResponse:
      description: A response with a single SurveyAttachment.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/SurveyAttachment"
        included:
          $ref: "#/components/schemas/SurveyAttachmentIncluded"
    SurveyDocHeaderRequest:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/SurveyDocHeader"
    SurveyDocHeaderCreationRequest:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/SurveyDocHeaderCreation"
    SurveyDocSectionQuestionAndAnswersResponse:
      description: Single Survey document section questions and answers response.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/SurveyDocSectionQuestionAndAnswer"
    SurveyDocSectionQuestionAndAnswer:
      description: A list of questions and their answer for a survey document section.
      type: object
      required:
        - type
        - id
        - attributes
      properties:
        type:
          type: string
          default: "SurveyDocSectionQuestionAndAnswer"
        id:
          description: The id of the sheet the questions refer to.
          type: string
        attributes:
          $ref: "#/components/schemas/SurveyDocSectionQuestionAndAnswersAttributes"
    SurveyDocSectionQuestionAndAnswersAttributes:
      description: The list of questions and their answers for a survey document section.
      type: object
      required:
        - surveyAnswers
      properties:
        surveyAnswers:
          description: List of answers to questions provided by the template for this entity.
          type: array
          items:
            $ref: "#/components/schemas/SurveyAnswer"
    SurveyAnswer:
      allOf:
        - type: object
          properties:
            lineId:
              description: The id of the survey document line the answer refers to.
              type: string
        - $ref: "./entityAttributes.yaml#/components/schemas/SheetExEntityAttributeValue"
      required:
        - lineId
    SurveyClusterEntityAnswer:
      type: object
      required:
        - sheetEntityAttributeId
        - attributeValue
      properties:
        sequenceNum:
          description: Determine the order of the answers.
          type: integer
          minimum: 0
          readOnly: true
        sheetEntityAttributeId:
          description: Represents the id of the question.
          type: string
        attributeValue:
          description: Represents the answer to the question.
        hasAnomalies:
          description: True if the answer has some anomalies. Anomalies are answers that do not respect conditions defined in the survey's template.
          readOnly: true
          type: boolean
          default: false
          example: false
    SurveyTemplateSectionEntity:
      description: SurveyTemplateSectionEntity resource. Groups answers for a template section.
      type: object
      required:
        - type
        - id
        - attributes
      properties:
        type:
          type: string
          default: "SurveyTemplateSectionEntity"
        id:
          type: string
        attributes:
          description: The attributes of a SurveyTemplateSectionEntity.
          type: object
          required:
            - surveyAnswers
          properties:
            surveyAnswers:
              description: List of answers to questions provided by the template for this entity.
              type: array
              items:
                $ref: "#/components/schemas/SurveyClusterEntityAnswer"
              default: []
            itemRenditionUrl:
              description: |
                URL of the requested rendition of the digital content with the sequence number 0.
                You need to provide the `renditionTypeId` parameter in order to get the correspondent picture's link.
                Used only if the template section is of type `ItemCollection` or `AssetCollection`.
              type: string
              format: uri-reference
              readOnly: true
        relationships:
          description: |
            The relationship entityObject can be:
            - Asset
            - Item
            - ItemInstance
          type: object
          properties:
            entityObject:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
    SurveyTemplateSectionEntityListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: The list of Survey documents lines.
          type: array
          items:
            $ref: "#/components/schemas/SurveyTemplateSectionEntity"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/SurveyTemplateSectionEntityIncluded"
    SurveyTemplateSectionEntityIncluded:
      type: array
      items:
        type: object
      uniqueItems: true
    SurveyDocTemplate:
      description: SurveyDocTemplate resource.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "SurveyDocTemplate"
        id:
          type: string
        attributes:
          description: The attributes of a SurveyDocTemplate.
          type: object
          required:
            - descr
            - startDate
            - endDate
            - processingStatusId
          properties:
            code:
              description: Generic code/name.
              type: string
            descr:
              description: Generic description.
              type: string
            startDate:
              $ref: "./dataTypes.yaml#/components/schemas/apiDate"
            endDate:
              $ref: "./dataTypes.yaml#/components/schemas/apiDate"
            processingStatusId:
              $ref: "./core.yaml#/components/schemas/ProcessingStatus"
              description: The processing status of the template.
              default: ProcessingStatus.Released
            numberOfDocuments:
              description: The number of documents based on this template.
              type: integer
              minimum: 0
              readOnly: true
            isDraft:
              description: True if the template is a draft, false otherwise.
              type: boolean
              readOnly: true
            lastChangeTs:
              $ref: "./dataTypes.yaml#/components/schemas/apiDateTimeReadOnly"
            referenceEntityObjectId:
              description: |
                If the template is published it represents its draft (if any), otherwise it represents the ID of the published template.
                It is `null` if the current entity is a new template yet to be published.
              type: string
              readOnly: true
        relationships:
          type: object
          description: Related document type and template sections.
          required:
            - docType
          properties:
            docType:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
            templateSections:
              $ref: "./jsonapi.yaml#/components/schemas/relToManyReadOnly"
            currentDraftUserProfile:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            draftOwnerUserProfile:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
    SurveyDocTemplateIncluded:
      description: Related document type.
      type: array
      items:
        type: object
      uniqueItems: true
    SurveyDocTemplateResponse:
      description: Single SurveyDocTemplate response.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/SurveyDocTemplate"
        included:
          $ref: "#/components/schemas/SurveyDocTemplateIncluded"
    SurveyDocTemplateListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: The collection of survey doc templates.
          type: array
          items:
            $ref: "#/components/schemas/SurveyDocTemplate"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/SurveyDocTemplateIncluded"
    SurveyDocTemplateRequest:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/SurveyDocTemplate"
    SurveyDocTemplateSection:
      description: SurveyDocTemplateSection resource.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "SurveyDocTemplateSection"
        id:
          type: string
        attributes:
          type: object
          required:
            - descr
            - surveyDocSectionTypeId
            - sequenceNum
          properties:
            code:
              description: Generic code/name.
              type: string
            descr:
              description: Generic description.
              type: string
            surveyDocSectionTypeId:
              $ref: "#/components/schemas/SurveyDocSectionTypeId"
            sequenceNumber:
              description: Line sequence number.
              type: integer
              minimum: 0
            iterationCondition:
              description: Configuration indicating the type of iteration (JSON format).
              type: string
            visibleCondition:
              description: |
                JSON that defines a constant or an expression that produces a boolean value, if true then the section is visible; 
                if false or null the section is not visible.
              type: string
        relationships:
          type: object
          description: |
            The relationships of a Budget.
          required:
            - surveyDocTemplate
            - sheet
          properties:
            surveyDocTemplate:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            sheet:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            cluster:
              $ref: "./jsonapi.yaml#/components/schemas/relToOneWithMeta"
    SurveyDocTemplateSectionIncluded:
      description: SurveyDocTemplateSection relationships.
      type: array
      items:
        type: object
      uniqueItems: true
    SurveyDocTemplateSectionListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: List of SurveyDocTemplateSections
          type: array
          items:
            $ref: "#/components/schemas/SurveyDocTemplateSection"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/SurveyDocTemplateSectionIncluded"
    SurveyDocTemplateSectionResponse:
      description: Single Survey document template section response.
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/SurveyDocTemplateSection"
        included:
          $ref: "#/components/schemas/SurveyDocTemplateSectionIncluded"
    SurveyDocTemplateSectionRequest:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/SurveyDocTemplateSection"
    SurveyDocTemplateCluster:
      description: |
        SurveyDocTemplateCluster resource. Represents the relationship between a survey template and a cluster.
      type: object
      required:
        - type
        - id
        - attributes
        - relationships
      properties:
        type:
          type: string
          default: "SurveyDocTemplateCluster"
        id:
          type: string
        attributes:
          type: object
          required:
            - sequenceNum
          properties:
            sequenceNumber:
              description: Determine the order of the clusters.
              type: integer
              minimum: 0
        relationships:
          type: object
          description: |
            The relationships of a SurveyDocTemplateCluster.
          required:
            - surveyDocTemplate
            - cluster
          properties:
            surveyDocTemplate:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
            cluster:
              $ref: "./jsonapi.yaml#/components/schemas/relToOne"
    SurveyDocTemplateClusterIncluded:
      description: SurveyDocTemplateCluster relationships.
      type: array
      items:
        type: object
      uniqueItems: true
    SurveyDocTemplateClusterListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: List of SurveyDocTemplateClusters
          type: array
          items:
            $ref: "#/components/schemas/SurveyDocTemplateCluster"
        meta:
          $ref: "./jsonapi.yaml#/components/schemas/PaginationMeta"
        links:
          $ref: "./jsonapi.yaml#/components/schemas/pagination"
        included:
          $ref: "#/components/schemas/SurveyDocTemplateClusterIncluded"
    SurveyClusterEntityAnswerListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          description: |
            List of answers to questions of a survey document section.
            Already given answers will be updated, while new answers will be added.
            Empty list of answers will result in a bad request.
          type: array
          items:
            $ref: "#/components/schemas/SurveyClusterEntityAnswer"
    SurveyClusterEntityAnswerRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SurveyClusterEntityAnswer"
  parameters:
    id:
      name: id
      in: path
      description: The survey doc header id
      required: true
      schema:
        type: string
    headerId:
      name: headerId
      in: path
      description: The survey doc header id
      required: true
      schema:
        type: string
    sectionId:
      name: sectionId
      in: path
      description: The survey doc section id
      required: true
      schema:
        type: string
    templateSectionId:
      name: templateSectionId
      in: path
      description: The survey doc template section id
      required: true
      schema:
        type: string
    clusterId:
      name: clusterId
      in: path
      description: The cluster id
      required: true
      schema:
        type: string
    lineId:
      name: lineId
      in: path
      description: The survey doc line id
      required: true
      schema:
        type: string
    attachmentId:
      name: attachmentId
      in: path
      description: The id of a survey attachment (i.e. a `DigitalContent`).
      required: true
      schema:
        type: string
    filters:
      name: "filter"
      in: query
      description: Filter group.
      required: true
      style: deepObject
      schema:
        properties:
          s:
            description: Search the given string inside docType and docNumber attributes.
            type: string
          docDate:
            description: Filter the response by document date.
            type: string
          creatorUserProfile:
            description: Filter the response by creator user profile.
            type: string
          processingStatusId:
            description: Filter the response by document's processing status.
            type: string
          transferStatusId:
            description: Filter the response by document's transfer status.
            type: string
          customerAccount:
            description: Filter the response by customer account.
            type: string
          docType:
            description: Filter the response by Doc Type Id.
            type: string
          salesRepId:
            description: Filter the response by document customer's agent.
            type: string
          surveyDocTemplate:
            description: Filter the response by template.
            type: string
          withAnomalies:
            description: |
              Filters the response considering if the document has anomalies or not. In
              particular, if `eq:true` only abnormal surveys are returned; while if `eq:false` only surveys without 
              anomalies are considered.
            type: string
    SurveyAttachmentFilters:
      name: "filter"
      in: query
      description: Filter group.
      required: true
      style: deepObject
      schema:
        type: object
        properties:
          s:
            description: A free search string applied on survey header's code and survey line's question.
            type: string
