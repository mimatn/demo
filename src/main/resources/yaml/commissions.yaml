        "404":
          description: "Not found"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    delete:
      description: |
        Deletes the commission identified by `id` and all its details.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | deleteCommission |
      operationId: deleteCommission
      summary: deleteCommission
      tags:
        - Commission
      x-authorities: ["deleteCommission"]
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      responses:
        "204":
          description: Commission deleted
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    patch:
      description: |
        Updates the commission identified by `id`. To update a commission its data and those about its details must be
        provided. Calling this API passing no commission details is equivalent to delete all the commission details.
        Similarly, details not in the list will be deleted.

        Any update to the either commission range or the algorithm **won't have** any effect: once they're set during
        creation they cannot be changed anymore.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | updateCommission |
      operationId: updateCommission
      summary: updateCommission
      tags:
        - Commission
      x-authorities: ["updateCommission"]
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
      requestBody:
        description: Commission data to be updated.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/UpsertCommissionRequest"
      responses:
        "200":
          description: Commission updated
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CommissionResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
