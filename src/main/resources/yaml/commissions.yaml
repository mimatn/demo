  /commissions:
    parameters:
      - $ref: "./jsonapi.yaml#/components/parameters/acceptLanguage"
    get:
      description: |
        Returns a list of commissions for the given organization.

        Commissions returned by this API are ordered by `startDate` ascending and `endDate` descending if either 
        no sorting is specified or if in the sort specification `startDate` or `endDate` are missing. On the other hand,
        if they're provided by the client, they will override their defaults.

        Here below some examples:
        1. `sort = null`. Then commissions are ordered by `startDate` ascending and `endDate` descending.
        2. `sort = otherColumn`. Then commission are ordered by `otherColumn` **and** by `startDate` ascending and 
        `endDate` descending.
        3. `sort = -startDate`. Then commissions are ordered by `startDate` descending and `endDate` descending.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | listCommission |
      operationId: listCommissions
      summary: listCommissions
      tags:
        - Commission
      x-authorities: ["listCommission"]
      parameters:
        - $ref: "./jsonapi.yaml#/components/parameters/pageSize"
        - $ref: "./jsonapi.yaml#/components/parameters/pageNumber"
        - $ref: "./jsonapi.yaml#/components/parameters/sort"
        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - $ref: "./core.yaml#/components/parameters/filterOrganizationRequired"
        - $ref: "#/components/parameters/CommissionFilters"
      responses:
        "200":
          description: Commission list response
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CommissionListResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
    post:
      description: |
        Creates a new commission and its details.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | createCommission |
      operationId: createCommission
      summary: createCommission
      tags:
        - Commission
      x-authorities: ["createCommission"]
      requestBody:
        description: Commission data to be created.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/UpsertCommissionRequest"
      responses:
        "201":
          description: Commission created
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/CommissionResponse"
        "400":
          description: "Bad request"
          content:
            application/vnd.api+json:
              schema:
                $ref: "./jsonapi.yaml#/components/schemas/failure"
  /commissions/{id}:
    parameters:
      - $ref: "#/components/parameters/commissionId"
    get:
      description: |
        Returns the commission identified by `id`.

        To access the service you need at least one of the following permissions:
        | Permission (one of) |
        |:-:|
        | getCommission |
      operationId: getCommission
      summary: getCommission
      tags:
