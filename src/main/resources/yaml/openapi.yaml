  - name: App Event
    description: |
      Log application events of an object (e.g. SFA app created document at…, contact X was created by VAN app at…).
      The table logs high-level events, it should not be thought of as a detailed application log.

  - name: Asset
    description: Asset

  - name: Authorization Workflow
    description: Authorization Workflow.

  - name: Badge Holder
    description: A person who owns a badge.

  - name: Budget
    description: Budget

  - name: Business Hours
    description: |
      Endpoints related to retrieving business operating hours by weekday.
      Each day can contain multiple time slots, with support for indicating whether the business is open on holidays.

  - name: Calendar
    description: Calendar

  - name: Cash Deposit Document
    description: Cash deposit document

  - name: Certificate
    description: APIs for Certificate resources

  - name: Checkpoint
    description: |
      The set of APIs related to checkpoints. A checkpoint is a RFID point of read which is used to detect RFID tags.
      Concretely, it can be a gate or a fixed station.

      In general, several Device-Port pairs correspond to a Checkpoint while, a Device-Port pair uniquely identifies a 
      Checkpoint.

  - name: Cluster
    description: |
      A user can create and edit product groups and assign them to customers or customer groups (nodes of the hierarchy) 
      and optionally to a document type.

  - name: Collection Document
    description: Collection document

  - name: Comment
    description: APIs for Comments

  - name: Commission
    description: Commission

  - name: Country
    description: Countries of the onSales Next suite

  - name: Currency
    description: Currencies of the onSales Next suite.

  - name: Customer
    description: |
      A Customer has a representation independent from the organization, called 'Customer' and one which depends on the 
      organization, which is called 'CustomerAccount' and can be thought as an extension of the Customer.
      Some attributes are defined only for the Customer resource, which can exist by its own, 
      while a CustomerAccount always refers to a Customer and includes its attributes and its relationships.

      A customer has a 'customer type', like 'sell to', 'bill to', 'deliver to' and may have a hierarchical structure 
      (see relationship parentCustomer). 
      For example two 'sell to' customers can have the same 'bill to' parent, which models the use case when the invoice 
      for the goods ordered by the 'sell to' customer is payed by the 'bill to' parent customer.

  - name: Customer Contact
    description: |
      This functionality allows users to manage a client's contacts, specifically the individuals associated with a 
      client. It centralizes all contact information, collecting and storing it in a single, accessible location to 
      make management and reference easier. It also enhances communication by enabling more effective and personalized 
      interactions with clients through emails, phone calls, messages, and other channels.

      The functionality tracks all interactions with clients, including meetings, calls, emails, and notes, providing a 
      complete overview of the relationship. 

      Additionally, it records the consents given by each contact regarding data processing purposes and tracks any 
      consents provided.

  - name: Customer Contract
    description: Commodatum customer contracts that imply an asset assignment.

  - name: Custom View
    description: |
      Represents the concept of "custom view" of a page that includes a table. The custom view represents the configuration
      of the columns to display, the order in which they should appear, and the filters applied. 
      The user can save this settings as a "custom view" and assign them a name. Custom views can be both private or shared
      with other users.

  - name: Device
    description: |
      The Device object represents an electronic device where one or more apps can typically be installed 
      and where each of these can be run by a user.

      The Device object has the attributes defined in the Device table 
      to which a read-only property is added that indicates the number of Apps installed on the device.

      It has no intrinsic relationships: the links with the Apps installed on the device and the users 
      who use the Apps of the device can be obtained by calling respectively the listDeviceApps services 
      belonging to this API listUserProfileDevices of the UserProfile API.

      The object does not support draft mode, the creation or modification operations are therefore applied directly to 
      the public object.

  - name: Dictionary
    description: |
      A general Dictionary is a list of code-description pairs, where the description is in a specific language.

      Dictionaries are very useful in a UI when only a list of choices has to be shown to the user 
      and the description is usually sufficient for the user to chose the desired options.

  - name: Digital Content
    description: |
      Digital Content is a collection of unstructured data that constitutes multimedia content used to illustrate or 
      enhance the description of a product, a customer, or a document.

      Examples of Digital Content include product photos, a promotional video, a PDF representing the print of a sales 
      document.

      The distinctive characteristics of Digital Content are:
      * Having a considerable size in bytes, not limited beforehand: a video size can be several gigabytes, and a 
      high-resolution image can easily reach tens of megabytes. Therefore, a Digital Asset needs to be stored and 
      handled with specific methods;
      * Not being directly readable by a user: an image needs to be displayed on the screen, and to do so, its technical format and 
      characteristics must be known; a video needs to be viewed by video software component and stored in an appropriate storage service;
      a PDF file requires a dedicated app to be displayed and printed.
      * It can have multiple possible representations (referred to as renditions) depending on the context in which it is displayed to illustrate 
      the entity it refers to. For example, an image has an original version at very high resolution, and various versions with different 
      resolutions and, above all, significantly smaller byte sizes suitable for quick display in a product list or a summary card.

  - name: Discount List
    description: |
      The discount lists allow you to define the commercial discount conditions, to be applied to a set of products for 
      a group of customers. The rules for applying a discount list depend mainly on the customers to whom the price list
      is assigned and on the period of validity.

  - name: Document
    description: |
      APIs to manage documents, including document types and document line reasons.
      A type of document  (DocType), belongs to a document _category_.
      While document types can be freely created as needed, the document categories are fixed and managed by the application.
      A category will determine both the application behaviour and the document data structure.
      A document type can have lines of different 'reasons': the Reason specify which is the "effect" of the document 
      line on different areas: value of the document, taxes, item stock, etc.

  - name: Email Verification
    description: APIs for email verification.

  - name: Entity Attribute
    description: |
      Provides APIs to manage attributes in a generic way. 

      An `EntityAttribute` is a generic description of an attribute of a generic entity.
      It may refer to a real column in the database or a "virtual" one and has a DataType.
      When describing a virtual attribute, it is also called a "dynamic" attribute, since it is only known at runtime, 
      not a compile time.

      A `Sheet` is a group of EntityAttributes.
      Referring to products, customers, document types, etc. it groups a set of additional attributes of an entity and 
      provides an order. It is used for viewing and editing purposes. 

      When an `EntityAttribute` is used in a `Sheet`, it is called a `SheetEntityAttribute` and has additional 
      properties that describes it (like editable, mandatory, etc.), which are useful to show and modify the value in a 
      user interface.

  - name: Entity Set
    description: |
      A dynamic set allows you to define a search expression that returns a set of elements of an entity 
      (for example a list of customers that satisfy a set of conditions). 
      Dynamic sets are used when it is necessary to define a set of customers or products based on their characteristics. 
      The dynamism depends on the fact that the elements included in the set are determined when the extraction of the 
      set is requested and depend on the given values.

  - name: Grey Market Survey
    description: Grey Market Survey

  - name: Hierarchy
    description: |
      APIs to manage hierarchical structures. 
      Hierarchies allow you to create hierarchical trees of generic entities. 

      ### How a Hierarchy is structured

      Each node in a hierarchy can have at most one parent and can have multiple child nodes.
      Children can be other nodes (which does not have a specific type, they are just nodes)
      or be a generic entity, of the type `entityName`, specified by the hierarchy.

      For example we want to represent a hierarchy of customers, so `entityName = CustomerAccount`.
      The root node is "Italy", which has children nodes "North" and "South". 
      "North" has an associated list of entities of type "CustomerAccount", like "C001", "C002", "C003" 
      (the customers in the northern part of Italy), 
      while "South" has another list of entities: "C015", "C016" the customers in the southern part of Italy.

      In the above example, "Italy", "North", "South" are just nodes with an id and a description, 
      while "C001", "C002", etc. are customer, i.e. objects of type "CustomerAccount".

      Every node can be related also to other specific objects, depending on the use of the hierarchy.
      For example, in a hierarchy that models a sales network, the entities pointed by "entityName" are the customers, 
      so `entityName = CustomerAccount` and every node is associated with one user, which are the sales reps or their 
      chiefs (area managers, brand managers and so on).

      To continue with the above example, we may associate the user "Paolo Rossi" to the node "Italy": he is the area 
      manager for Italy.
      Then we associate the user "Giovanna Bianchi" to the node "North" and "Matteo Verdi" to the node "South": 
      they are the sales reps that manage the customers in the north and south, respectively.

      ### How to modify a Hierarchy

      A Hierarchy is a complex entity: to modify it, the user must enter the "edit mode", by calling the _edit_ API.
      The system will return a draft copy of the entity, which can be modified and saved, even if the editing is partial.
      The draft copy will only be visible to the user that is editing the object, while other users will continue to see the published version.
      When the user has finished to modify the object, he must call the _publish_ API to request the publication.
      Depending on the application configuration, a valid object may be directly published, or it can require the revision
      of other users: in this case the publish action starts an approval workflow.

  - name: Identifier
    description: |
      In general, an identifier is an object that allows to uniquely identify another one.
      Supported identifiers are:
      * `UHF`. They are UHF (Ultra-High Frequency) RFID electronic tags that transmit data
      wirelessly using radio waves in the UHF frequency band.
      * `NFC`. An NFC (Near Field Communication) tag is a small, passive device that stores
      data and communicates wirelessly with NFC-enabled devices (like smartphones) when
      brought within close proximity.
      * `Barcode`. A barcode is a visual representation of data in the form of parallel lines
      (linear barcode) or patterns (2D barcode, like QR codes) that can be read by optical
      scanners.

  - name: Identity
    description: |
      An identity is an external entity which can be authenticated and authorized to make API calls to .one system.
      Typically, these entities can be: users (or remote systems) which act on their own; devices which operate on
      general features without identifying the user who is using them.

  - name: Inventory Document
    description: Inventory Document.

  - name: Item
    description: Item

  - name: Item Catalog
    description: .one B2B Item Catalog related APIs.

  - name: Item Category
    description: The category of an item defines the set of attributes that all items of that category have.

  - name: Item Allergen
    description: ItemAllergens related APIs.

  - name: Item Packaging Part
    description: ItemPackagingPart related APIs.

  - name: Item Instance
    description: Item Instance related APIs.

  - name: Item Nutrition Fact
    description: |
      Nutrition facts of an item. An item can have a related list of nutrition facts, if this is specified in the item 
      category. See `hasNutritionFacts` attribute in `ItemCategory` entity.

  - name: Item Supplier
    description: Suppliers of an item. An item can have a related list of suppliers.

  - name: Item Related
    description: Suppliers of an item. An item can have a related list of related items.

  - name: Job
    description: Job

  - name: Language
    description: Languages of the onSales Next suite.

  - name: Note
    description: Note

  - name: Notification
    description: |
      The .one platform provides the various application modules with communication channels that allow them to send 
      messages.  
      For each instance of .one it is possible to configure multiple communication channels, each of which is identified 
      by a unique id.  
      Each communication channel has a configuration file that contains the parameters necessary to send messages via 
      the channel itself.

  - name: Organization
    description: The Organization is the higher level that groups the entities managed by the application.

  - name: Party
    description: Party related APIs.

  - name: Payment
    description: Payment related APIs.

  - name: Permission
    description: |
      Users are granted permissions through the roles assigned to them within the .one system.  
      Permissions control access to APIs and define the available menu items and features for each application.  
      An application permission specifies how a user can interact with a given feature.
      In particular, permissions determine:
        - whether an API service can be invoked;
        - whether a specific operation within an application feature can be performed (e.g., creating a new user in the 
      page listing the users of an organization);
        - whether a specific menu item is visible.

  - name: Plant
    description: Plant related APIs.

  - name: Price Condition
    description: Price Condition

  - name: Price List
    description: |
      Price lists allow you to define the prices to apply to the items of customer documents.
      A price list is characterized by the definition of the price of every single item and has a reference currency. 
      It determines the price list to be applied to the document.
      A price list has also a validity period and it is applicable only to documents whose date is included therein.

      There are different ways of applying discounts:
      * **Over** discounts overwrite existing ones;
      * **Add** discounts are added to existing.

  - name: Privacy Agreement
    description: |
      This functionality allows users to manage privacy agreements, which are legal documents that outline how an 
      organization collects, uses, and protects personal data. It provides a centralized location for storing and 
      managing these agreements, making it easier to ensure compliance with data protection regulations.

      The functionality tracks the status of each privacy agreement, including whether it has been requested, given, 
      refused, or withdrawn. It also allows users to view the details of each agreement, including its code, description, 
      and body.

  - name: Purchase Document
    description: Purchase Document.

  - name: Reason
    description: |
      Every document line must have a "reason", which explains what the line is about, like "sale" if the product is sold 
      or "free gift" if the product is not payed by the customer or "returned" for a product that has been returned by 
      the customer.

  - name: Recurrence
    description: Recurrence of an entity (inspection item, task etc...).

  - name: Report
    description: |
      The .one reporting engine produces reports from Jasper format templates designed using the JasperSoft Studio tool.
      A report is typically a `PDF` file that is produced and then made available to the user. In addition to the `PDF` 
      format, the engine also allows you to obtain reports in different formats, as `.xlsx`.
      Finally, the `ReportFormatType.DirectPrint` which allows you to define the format defined to printers (typically 
      thermal bar code label and receipt printers etc...)

  - name: Role
    description: |
      User role. Every role is essentially a collection of permissions. 

      Since a user can have one or more roles, then the resulting list of associated permissions is the union of the 
      permissions of all roles.

  - name: Sales Department
    description: Sales department

  - name: Sales Document
    description: Sales document

  - name: Sales Rep
    description: Sales representative

  - name: Sheet
    description: |
      Referring to products, customers, document types etc. groups a set of additional attributes of an entity and provides an order. 
      It is used for viewing and editing purposes.

  - name: Sales Point
    description: Sales Point

  - name: Statistics
    description: |
      The .one data model offers flexible structures for collecting datasets to support various statistical analyses.

      Each analysis, associated with a specific phenomenon, is defined by a statistical type (`StatType`), which 
      determines whether measures are expressed as quantities (using a defined unit of measurement) or as amounts 
      (using a specified currency).  

      Statistics can be targeted to different locations, such as dashboards, customer profiles, or item records, 
      as defined by the `StatTargetLocation` dictionary. 

      Depending on the nature of the data, each statistic can be visualized with the most suitable chart type. 

      For instance, overlapping line charts are ideal for comparing sales trends to targets, while pie charts are better 
      suited for showing sales distribution by customer group.

  - name: Supplier
    description: Supplier

  - name: Survey Document
    description: |
      Survey documents are used to collect information through the completion of questionnaires. These questionnaires 
      can contain a series of questions, ranging from customer qualification to specific surveys, such as the arrangement 
      of items in a supermarket.
      A Survey document may consist of multiple parts, called "sections," each of which is used to gather various types 
      of data. For example, in a supermarket survey, there might be sections for store information, for counter items, 
      and for items displayed on shelves, each with their own specific questions.
      To specify how the Survey document should be structured, a "template" is used, consisting of a header and several 
      section templates, of which at least one must be defined.

  - name: Survey Document Section
    description: |
      A Survey document section is a part of a Survey document that contains a set of questions. Each section is based 
      on a template section, which defines the questions that will be asked.

  - name: Survey Document Template
    description: |
      A Survey document template is a model that defines the structure of a Survey document. It consists of a header and 
      several section templates, each of which defines the questions that will be asked in a section of the Survey document.

  - name: Tag
    description: |
      Tags can be used to highlight information, making specific entities (e.g. items) easily identifiable within a list 
      or enabling filtering options. They also offer a way to create custom filters when retrieving a list of entities.

  - name: Tag Association
    description: |
      Tag association is meant to bind some identifiers to an `Item` such that it will be uniquely identified 
      by onTag system.

  - name: Tag Generation
    description: |
      Tag generation is the action of creating tags identifiers using Aton's algorithm.
      This operation must ensure that each tag is unique such that the item the tag is associated with can be uniquely 
      identified.

  - name: Target
    description: |
      A **Target** is a specific goal that members of an organization can aim to achieve (*target*) or can consider as the maximum limit that a certain counter must not exceed (*budget*).

      An example of a target could be the sales amount of a specific product line in a period, while an example of a budget could be the maximum value of discounts that an agent can grant to a group of customers for a specific item.

      A target is created by a user by defining its main characteristics such as type, measurement method, and validity period.

  - name: Task
    description: Task

  - name: Taxes
    description: Taxes

  - name: Ticket
    description: |
      A ticket allows a report or issue to be assigned to a specific `Party`. 
      This report must then be acknowledged, managed, and resolved until it is officially closed.

  - name: Unit Of Measurement
    description: Unit of measurement.

  - name: User Message
    description: |
      Messages are a form of communication that .one users can use to contact other users of the platform.
      Messages are created and exchanged only within the .one platform Apps.

  - name: User Profile
    description: |
      User of the onSales Next system, i.e. a person or machine authorized to perform operations on the solution's Apps.

      Application users are defined at the instance level and therefore do not refer to a specific tenant.

      The UserProfile object defines the personal data of the user, but does not contain its authentication data. 
      The latter are defined in the systems delegated to authentication and are therefore stored externally.

      The authentication request for the user profile is then handled from time to time by the authentication system 
      which checks the credentials in its authentication system and returns the check to onSales Next 
      if the credentials provided are correct.

  - name: Vehicle
    description: Vehicle

  - name: Warehouse
    description: Warehouses

  - name: Warehouse Document
    description: Warehouse documents

  - name: Widget
    description: Dashboard widgets

  - name: Work Session
    description: Work Sessions

  - name: Zone
    description: A delimited area in the space. Zones can be hierarchically organized.
