openapi: 3.0.3
info:
  title: Aton .one APIs
  version: "84.4.0"
  description: |
    **.one** is the new virtual table that brings together an organization’s stakeholders, breaking down the information 
    silos that often make collaboration between teams difficult.  

    It is conceived as a single digital hub that embraces the entire supply chain: it gathers all the data necessary for 
    the functioning of sales and the distribution of consumer goods, whether for companies distributing wholesale or 
    retail.  

    It consists of a set of applications that meet the needs of different stakeholders and enable:  

    - **Having a comprehensive view of the entire customer base and the history of their transactions:** sales orders, 
    purchase orders, invoices, shipping documents, tickets, scheduled tasks.  
    - **Building relationships with customers and managing the entire business development process:** new customers, 
    upselling, and cross-selling.  
    - **Enriching the company’s asset base with product data:** pricing, commercial terms, trade promotion management, 
    campaign activation, accompanying materials to certify quality, support post-sale services or logistics distribution.  
    - **Organizing retail commerce, both at headquarters and at points of sale:** planning reordering operations, 
    inventory in all its forms, tracking all support activities within the store, managing tasks assigned to individuals 
    or workgroups, sales assistance, sales management.  
    - **Ensuring product traceability along the supply chain for wholesale and retail.**  
    - **Facilitating collaboration between people by promoting information exchange and responding to needs expressed 
    in natural language, thanks to functionalities enabled by artificial intelligence.**
  contact:
    name: Aton S.p.A. Società Benefit
    email: info@aton.com
    url: https://aton.com/en/
