        - $ref: "./jsonapi.yaml#/components/parameters/include"
        - name: "filter"
          in: query
          description: Filter group
          required: true
          style: deepObject
          schema:
            type: object
            properties:
              s:
                type: string
              linked:
                description: |
                  * If `nn:` (not-null), retrieves only the customers **already linked** to the Cluster;
